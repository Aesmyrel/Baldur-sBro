id: lore.lieux.sword-coast
theme: lieux
nom: { fr: Côte des Épées, en: Sword Coast, statut: NON_OFFICIELLE }
etiquette_titre: { act: prologue, level: aucun, otherWorks: aucun }
etiquette: { act: prologue, level: aucun, otherWorks: aucun }
resume: >-
  Longue bande de terres sauvages et de cités libres au bord de la mer des Épées, la Côte des Épées est le cadre de la saga Baldur’s Gate.
sections:
  - type: general
    titre: Des cités libres et des terres sauvages
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          La Côte des Épées est la région de l’ouest de Faerûn qui borde la mer des Épées (Sea of Swords). C’est une immense étendue sauvage, semée de cités indépendantes et parcourue par des bandes de monstres, que certains ne voient que comme une terre à traverser, d’où son surnom anglais d’Empty Lands ; elle abrite pourtant quelques-unes des villes les plus importantes des Royaumes. Deux explications de son nom circulent : les falaises blanches qui se dressent à pic sur des centaines de kilomètres entre la rivière Dessarin et la Porte de Baldur, ou, selon le voyageur Volo, la dangerosité de ses habitants, humanoïdes comme bêtes.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-sword-coast }
          - { ref: frwiki-sword-coast/volos-guide-sword-coast, page: "5" }
          - { ref: frwiki-sword-coast/frcs-3e, page: "225" }
          - { ref: frwiki-sword-coast/scag, page: "17" }
      - texte: >-
          Son paysage va des champs verdoyants qui bordent la Voie côtière (Coast Way) aux dangereuses terres arides du nord de la Chionthar. Cette rivière est l’artère commerciale de l’intérieur : elle relie le grand port de la Porte de Baldur à Elturel, Iriaebor, Berdusk et Scornubel. La région n’a pas de gouvernement commun. La Porte de Baldur et Daggerford appartiennent à l’Alliance des Seigneurs, et un accord entre les localités protège les voyageurs de la Voie côtière, de la Porte de Baldur jusqu’à l’Amn ; mais loin des routes et des villes, brigands, pillards et monstres font la loi. La Porte de Baldur, carrefour du commerce de toute la côte, en est la plus grande ville.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-sword-coast }
          - { ref: frwiki-sword-coast/volos-guide-sword-coast, page: "7–8" }
          - { ref: frwiki-sword-coast/frcs-3e, page: "225" }
          - { ref: frwiki-sword-coast/scag, page: "7" }
          - { ref: frwiki-sword-coast/rise-of-tiamat, page: "13" }
          - { ref: frwiki-sword-coast/fr-campaign-guide, page: "84" }
      - texte: >-
          Le XIVe siècle CV y est un temps de guerres. En 1356 CV, la première guerre de Dragonspear (First Dragonspear War) oppose les armées d’Eauprofonde et de la Porte de Baldur à des hordes de gobelinoïdes et de fiélons sorties d’un portail ouvert sous le château de Dragonspear ; elle fait d’ailleurs croître la population tieffeline de la région. Une seconde guerre éclate en 1363 CV, au lendemain du Temps des Troubles : pendant deux ans, les habitants de la côte doivent repousser des forces des Neuf Enfers sur leurs propres terres, parfois jusqu’aux portes de leurs villes.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-sword-coast }
          - { ref: frwiki-sword-coast/grand-history-of-the-realms, page: "142" }
          - { ref: frwiki-sword-coast/players-guide-to-faerun, page: "28" }
          - { ref: frwiki-sword-coast/grand-tour-of-the-realms, page: "91" }
          - { ref: frwiki-sword-coast/hordes-of-dragonspear, page: "10" }
  - type: ecarts
    titre: Où commence et où finit la Côte ?
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Pour la plupart des auteurs, dont Volo dans son guide de la Côte des Épées et le décor des Royaumes de la 3e édition, la région s’étend des frontières de l’Amn, au sud, jusqu’à Eauprofonde et à la vallée de la Delimbiyr, au nord. Les terres littorales situées au-delà d’Eauprofonde forment alors une région à part, la Côte des Épées du Nord (Sword Coast North).
        nature: canon_dnd
        edition: multi
        variantes: limites
        refs:
          - { ref: frwiki-sword-coast }
          - { ref: frwiki-sword-coast/volos-guide-sword-coast, page: "5" }
          - { ref: frwiki-sword-coast/frcs-3e, page: "29, 78, 176, 225" }
      - texte: >-
          D’autres guides, comme A Grand Tour of the Realms (1993) ou le Player’s Guide to Faerûn (2004), la font commencer au sud à Château-Suif et la prolongent vers le nord jusqu’à Luskan, englobant ainsi Eauprofonde et le littoral qui mène à cette cité. Le premier reconnaît d’ailleurs que les érudits ne s’accordent pas sur les limites exactes de la région, et ce découpage reste moins répandu que le précédent.
        nature: canon_dnd
        edition: multi
        variantes: limites
        refs:
          - { ref: frwiki-sword-coast }
          - { ref: frwiki-sword-coast/grand-tour-of-the-realms, page: "101" }
          - { ref: frwiki-sword-coast/players-guide-to-faerun, page: "18" }
          - { ref: frwiki-sword-coast/volos-guide-sword-coast, page: "5" }
  - type: bg3
    titre: Dans Baldur’s Gate 3
    etiquette: { act: acte1, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Comme toute la saga Baldur’s Gate, qui se déroule dans la région de la Porte de Baldur, Baldur’s Gate 3 tire son titre de la grande cité portuaire de la Côte. L’acte I s’ouvre pourtant à l’intérieur des terres : le nautiloïde s’écrase sur une plage au bord de la Chionthar, dans une contrée boisée que traversent la rivière et la Route surélevée, quelque part entre Elturel et la Porte de Baldur. Une carte que l’on peut consulter en jeu situe ces terres dans l’Elturgard, à l’est, et rappelle que la ville est encore loin.
        nature: canon_bg3
        refs:
          - { ref: bg3wiki-ravaged-beach }
          - { ref: bg3wiki-wilderness }
          - { ref: frwiki-sword-coast }
          - { ref: wpfr-royaumes-oublies }
