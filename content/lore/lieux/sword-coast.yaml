nom: { fr: Côte des Épées, en: Sword Coast, statut: NON_OFFICIELLE }
alias: []
etiquette_titre: { act: prologue, level: aucun, otherWorks: aucun }
etiquette: { act: prologue, level: aucun, otherWorks: aucun }
resume: >-
  La façade occidentale de Faerûn sur la mer des Épées, terre rude de hautes falaises, de cités marchandes et de routes peu sûres.
sections:
  - type: general
    titre: Une côte rude et convoitée
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          La Côte des Épées est une région de l’ouest de Faerûn, rattachée aux Contrées du Mitan occidentales (Western Heartlands), qui longe la mer des Épées : ce nom désigne les eaux côtières de la Trackless Sea et vient de la côte elle-même. Pour certains, la région doit son nom aux falaises blanches qui la bordent sur des centaines de milles ; Volothamp Geddarm, dit Volo, y voit plutôt la marque de ses habitants dangereux, humanoïdes ou bêtes. Rude par son relief comme par ses gens, c’est une vaste étendue sauvage, surnommée les Terres vides (Empty Lands), que d’aucuns tiennent pour une terre de passage plutôt qu’une destination. Elle abrite pourtant quelques-unes des cités les plus importantes des Royaumes, et son histoire est longue et riche.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: mroi-cote-des-epees }
          - { ref: frwiki-sword-coast/volos-guide-sword-coast, page: "5" }
          - { ref: frwiki-sword-coast/grand-tour-of-the-realms, page: "101, 108" }
          - { ref: frwiki-sword-coast/frcs-3e, page: "225" }
          - { ref: frwiki-sword-coast/scag, page: "15" }
      - texte: >-
          Le littoral décourage les marins. Des falaises blanches et tranchantes, les Dents de l’Épée (Sword’s Teeth), dressées par endroits à près de 800 m, séparent la mer de la terre, notamment entre la Dessarin et Baldur’s Gate ; de vastes cavernes les percent, dont certaines descendent jusqu’en Outreterre. Récifs immergés, brisants et hauts-fonds de vase rendent l’approche périlleuse, les mouillages sont presque inexistants et les ports rares. Dans les terres, des champs verdoyants bordent la Voie côtière (Coast Way), mais au nord du Chionthar, fleuve vital au commerce qui relie Baldur’s Gate à Elturel, Iriaebor, Berdusk et Scornubel, s’étendent des terres arides et dangereuses. Le Bois du Manteau (Cloak Wood), vieille forêt semée de portails, abrite monstres et fées malveillantes, et le Marais des Lézards (Lizard Marsh) des hommes-lézards, des dinosaures et des dragons noirs.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: mroi-cote-des-epees/fr-players-guide, page: "118" }
          - { ref: mroi-cote-des-epees/frcs-3e, page: "111" }
          - { ref: mroi-cote-des-epees/fr-campaign-guide, page: "84" }
          - { ref: frwiki-sword-coast/frcs-3e, page: "222–225" }
          - { ref: frwiki-sword-coast/volos-guide-sword-coast, page: "7" }
      - texte: >-
          Aucun gouvernement central ne règne sur la Côte : des cités indépendantes, liées par l’intérêt commun du commerce, y voisinent avec des bandes de monstres errants. Plusieurs, dont Baldur’s Gate et Gué de la dague (Daggerford), adhèrent à l’Alliance des Seigneurs (Lords’ Alliance), qui défend en partie les terres côtières du nord et garantit à ses membres plus d’ordre et de sécurité. Loin des routes et des cités, la loi s’efface : bandits, pillards et monstres guettent les voyageurs, que l’on invite, s’ils en ont les moyens, à engager des gardes ou des aventuriers. Faute de pouvoir unique, des organisations rivales s’implantent dans les cités côtières, des Ménestrels aux Zhentarim, de l’Enclave d’émeraude à l’Ordre du Gantelet.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-sword-coast/rise-of-tiamat, page: "13" }
          - { ref: frwiki-sword-coast/scag, page: "17, 43, 147" }
          - { ref: frwiki-sword-coast/fr-campaign-guide, page: "84" }
          - { ref: frwiki-sword-coast/volos-guide-sword-coast, page: "5, 7" }
      - texte: >-
          Baldur’s Gate, surnommée « la Porte » (the Gate), est la plus grande cité de la Côte. Port et centre du commerce régional, elle compte au XVe siècle CV parmi les villes les plus influentes de Faerûn ; son Poing enflammé (Flaming Fist), à la fois force de l’ordre et armée permanente, défend aussi ses intérêts hors les murs. Gué de la dague est un petit duché fortifié, entouré de villages agricoles, où un duc ou une duchesse laisse les affaires courantes à un conseil des guildes. Beregost, bourg marchand, sert d’étape entre l’Amn et Baldur’s Gate ; Château-Suif (Candlekeep), citadelle du savoir, ouvre ses bibliothèques contre paiement.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-sword-coast/frcs-3e, page: "225–226" }
          - { ref: frwiki-sword-coast/volos-guide-sword-coast, page: "8, 27, 34" }
          - { ref: frwiki-sword-coast/fr-campaign-guide, page: "84, 94" }
          - { ref: frwiki-sword-coast/scag, page: "47" }
      - texte: >-
          Des dizaines de millénaires avant l’Ère des bouleversements, le royaume elfique d’Illefarn domine la région ; vers −4974 CV, le royaume nain de Haunghdannar s’y affirme pour plus de 1 500 ans, avant un déclin rapide dont les causes sont oubliées. Au début du VIe siècle CV naît au nord le Delimbiyran, « royaume de l’Homme », qui s’éteint en 697 CV. En 1356 CV, la première guerre de Dragonspear oppose Eauprofonde (Waterdeep) et Baldur’s Gate à des gobelinoïdes et à des fiélons sortis d’un portail sous Dragonspear Castle ; la seconde, plus vaste, éclate sept ans plus tard, peu après le Temps des troubles, et dure deux ans contre des armées des Neuf Enfers.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-sword-coast/grand-tour-of-the-realms, page: "91, 95" }
          - { ref: frwiki-sword-coast/scag, page: "48, 58" }
          - { ref: frwiki-sword-coast/grand-history-of-the-realms, page: "142" }
          - { ref: frwiki-sword-coast/hordes-of-dragonspear, page: "5–8" }
  - type: ecarts
    titre: Où commence la Côte ?
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Les érudits ne s’entendent pas sur les frontières exactes de la région, et les ouvrages de la 2e édition en donnent deux tracés. Le guide de Volo, Volo’s Guide to the Sword Coast, la fait courir de l’Amn, au sud, jusqu’à Eauprofonde et au val du Delimbiyr, au nord, et présente ce découpage comme celui que retiennent la plupart des cartographes et des auteurs. A Grand Tour of the Realms la fait aller de Château-Suif, au sud, jusqu’à Luskan, au nord.
        nature: canon_dnd
        edition: add2
        variantes: limites
        refs:
          - { ref: frwiki-sword-coast/volos-guide-sword-coast, page: "5" }
          - { ref: frwiki-sword-coast/grand-tour-of-the-realms, page: "101" }
      - texte: >-
          La 3e édition reprend la limite nord du guide de Volo, Eauprofonde et le val du Delimbiyr : Baldur’s Gate y est la cité la plus au sud de la Côte, Eauprofonde la plus au nord, et les terres côtières situées au-delà forment une région distincte, la Sword Coast North, aussi appelée Côte des Épées septentrionale. Une délimitation plus étroite circule également : elle ne garde que le rivage compris entre l’embouchure de la Dessarin et celle du Chionthar.
        nature: canon_dnd
        edition: 3e
        variantes: limites
        refs:
          - { ref: frwiki-sword-coast/frcs-3e, page: "29, 78, 176, 225" }
          - { ref: mroi-cote-des-epees }
          - { ref: mroi-cote-des-epees/frcs-3e, page: "111" }
  - type: bg3
    titre: La région de l’Acte I
    etiquette: { act: acte1, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Dans Baldur’s Gate 3, l’Acte I se déroule dans une région que le jeu nomme les Terres sauvages (Wilderness). On y trouve la Plage ravagée (Ravaged Beach), la Route surélevée (Risen Road), le Bosquet d’émeraude (Emerald Grove), le Village dévasté (Blighted Village), les Marécages ensoleillés (Sunlit Wetlands), la Crique isolée (Secluded Cove), le Repos de Waukeen (Waukeen’s Rest) et le Col de montagne (Mountain Pass). Tous ces noms de lieux sont des traductions non officielles.
        nature: canon_bg3
        refs:
          - { ref: bg3wiki-wilderness }
          - { ref: bg3wiki-ravaged-beach }
