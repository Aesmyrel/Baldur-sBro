etiquette: { act: acte1, level: aucun, otherWorks: aucun }
resume: >-
  Une société semi-secrète d’agents dispersés dans tout Faerûn, qui travaillent dans l’ombre contre la tyrannie, sous le signe de la harpe d’argent et du croissant de lune.
sections:
  - type: general
    titre: Une société de l’ombre
    etiquette: { act: acte1, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Les Ménestrels (Harpers) forment une organisation semi-secrète à la structure lâche, qui unit par des buts communs des individus d’origines très diverses. Ils n’ont ni registre officiel des membres ni base attitrée, et cette absence de forme protège leur secret. Leur modèle reste Myth Drannor, sa culture, ses arts et son éducation, à l’image de laquelle ils rêvent de refaire le monde. Ils veulent défendre les innocents contre le mal, préserver la mémoire du passé et garder les royaumes à taille modeste ; plus largement, ils cherchent l’équilibre en toute chose, entre nature et civilisation comme entre ordre social et liberté personnelle.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-harpers/code-of-the-harpers, page: "3–6, 8–11" }
          - { ref: frwiki-harpers/fr-adventures, page: "123–124" }
          - { ref: frwiki-harpers/scag, page: "123–124" }
          - { ref: frwiki-harpers }
      - texte: >-
          Longtemps, leur code n’est consigné nulle part, et un rituel de reconnaissance, ponctué de mots de passe, permet aux membres de s’identifier. Ses principes, simples en apparence, sont durs à tenir : défendre la liberté, la paix et les lois justes, s’opposer à la tyrannie, protéger les opprimés, empêcher toute concentration excessive de pouvoir ou de richesse, s’entraider sans compter. On entre chez les Ménestrels parrainé par un membre reconnu, avec l’accord des Grands Ménestrels, en jurant le code. Rôdeurs et bardes y dominent, et les femmes y sont plus nombreuses que les hommes.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-harpers/warriors-priests-realms, page: "9–13" }
          - { ref: frwiki-harpers/frcs-3e, page: "46–47, 274" }
          - { ref: frwiki-harpers/code-of-the-harpers, page: "3–6" }
          - { ref: frwiki-harpers/fr-adventures, page: "123–124" }
      - texte: >-
          Les Ménestrels opèrent en coulisses, où ils ont commis moins d’erreurs graves qu’à découvert, et ne sortent de l’ombre qu’en dernier recours. Ils préfèrent le savoir et l’influence à la violence. La plupart mènent une double vie, entre un métier ordinaire et la collecte des rumeurs. Boîtes aux lettres, caches et refuges forment leur réseau, et un accord modifié dans une chanson suffit à porter un message. Leur symbole, harpe d’argent et croissant de lune sur fond noir ou bleu roi, est le seul signe commun à tous.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-harpers/fr-adventures, page: "123–124" }
          - { ref: mroi-menestrels }
          - { ref: frwiki-harpers/warriors-priests-realms, page: "9–13" }
          - { ref: frwiki-harpers/code-of-the-harpers, page: "3–6, 12–13" }
          - { ref: frwiki-harpers/elminsters-forgotten-realms, page: "189" }
      - texte: >-
          Seul un petit conseil, les Grands Ménestrels (High Harpers), élus à bulletin secret parmi les membres anciens et discrets, exerce une véritable direction. Longtemps, deux branches se partagent les Contrées du Mitan (Heartlands) : celle de l’est, basée à Valombre (Shadowdale), et celle de l’ouest, à Berdusk, dont le Manoir du crépuscule (Twilight Hall) est presque le quartier général. Les Ménestrels s’appuient sur des églises amies, de Mystra à Silvanus, sur les druides du Nord et sur les Hérauts de Faerûn ; ils combattent le culte du Dragon, les Zhentarim et les églises des dieux sombres, Bane en tête.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-harpers/dragon-430, page: "33–38" }
          - { ref: frwiki-harpers/frcs-3e, page: "274" }
          - { ref: frwiki-harpers/code-of-the-harpers, page: "3–6, 12–13, 21, 85–86" }
          - { ref: mroi-menestrels }
  - type: general
    titre: Chutes et renaissances
    etiquette: { act: acte1, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Leur histoire, si embrouillée qu’Elminster la nomme « le Récit caché » (The Hidden Tale), commence à Myth Drannor. L’idée naît parmi des chefs militaires elfes rejoints par quelques rôdeurs et druides humains ; ils se réunissent au crépuscule dans des lieux secrets de la Cour elfique, d’où leur premier nom de Ménestrels du Crépuscule (Harpers at Twilight). Le groupe, dont Elminster Aumar siège au premier conseil, prend pour symbole les armoiries de la famille de la mage Dathlue Brumhiver (Mistwinter), qui en prend la tête en 324 CV. En 712 CV, quand Myth Drannor tombe au terme de la Guerre des larmes (Weeping War), plus de la moitié des Ménestrels périt en une seule bataille, et Dathlue meurt avant la fin du conflit.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-harpers/code-of-the-harpers, page: "20–22" }
          - { ref: frwiki-harpers/frcs-3e, page: "269–270" }
          - { ref: frwiki-harpers/grand-history-of-the-realms, page: "70, 99" }
      - texte: >-
          La refondation passe par une nuit restée célèbre, la Réunion des dieux (Gathering of the Gods), à la Cour dansante (Dancing Place). Des elfes appellent à l’aide contre les fidèles de cinq dieux, parmi lesquels Malar et Loviatar ; des prêtres de nombreuses fois se réunissent, et Elminster leur explique l’appel. Ce soir-là, le crépuscule tombe trop tôt et la lune paraît hors de saison ; par la bouche de leurs prêtres, Corellon, Mielikki, Mystra, Oghma, Selûne, Silvanus et Tymora soutiennent et bénissent l’entreprise. Selon Running the Realms, la Cour dansante est un bosquet de High Dale, où se tient le 27 Flamerule 720 CV un rassemblement de dryades.
        nature: canon_dnd
        edition: add2
        variantes: dieux-cour-dansante
        refs:
          - { ref: frwiki-harpers/code-of-the-harpers, page: "21–22" }
          - { ref: frwiki-harpers/running-the-realms, page: "15–17" }
      - texte: >-
          La version de la 3e édition date de 720 CV la renaissance de l’organisation, désormais appelée les Ménestrels, autour de quinze de ses anciens membres, parmi lesquels Elminster et Khelben. Les divinités présentes à la Cour dansante y sont Deneir, Eldath, Lliira, Mielikki, Milil, Oghma, Selûne, Silvanus et Tymora, ainsi que les Seldarine, et Mystra s’y joint. Ces dieux, qui soutiennent l’organisation, dotent parfois de pouvoirs les Grands Ménestrels.
        nature: canon_dnd
        edition: 3e
        variantes: dieux-cour-dansante
        refs:
          - { ref: mroi-menestrels }
      - texte: >-
          Suivent les Longues Années (Long Years), marquées par un recrutement lent ; en 1022 CV, Elminster et Khelben Arunsun refondent les Ménestrels en réseau clandestin d’aventuriers. En 1321 CV, une réorganisation installe la branche de l’ouest au Manoir du crépuscule, sous Cylyria Dragonbreast, Haute Dame de Berdusk, tandis que Khelben conduit les Ménestrels de la Côte des Épées. Les Ménestrels défendent Valombre contre les Zhentilar pendant la crise des Avatars, en 1358 CV, et détruisent Hellgate Keep en 1368–1369 CV, renvoyant ses diables aux Enfers.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-harpers/code-of-the-harpers, page: "22" }
          - { ref: frwiki-harpers/grand-history-of-the-realms, page: "115, 137, 149" }
          - { ref: mroi-menestrels }
          - { ref: frwiki-harpers }
      - texte: >-
          En 1370–1371 CV, Khelben se trouve mêlé au vol d’un artefact qui finit aux mains des Zhentarim ; la scission qui suit voit partir Khelben, Laeral et Alustriel, fondateurs des Étoiles de lune (Moonstars), tantôt alliées, tantôt rivales. Dissous à la fin du XIVe siècle CV, les Ménestrels perdent nombre des leurs dans la Magepeste et les Années de lamentation (Wailing Years), et leurs survivants n’agissent plus qu’à l’échelle locale. Storm Silverhand les ranime au Cormyr en 1479 CV. Après la Seconde Fracture, dans les années 1480 CV, l’organisation retrouve effectifs et ressources, et s’oppose au nouveau culte du Dragon, voué à Tiamat.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: frwiki-harpers/grand-history-of-the-realms, page: "150" }
          - { ref: frwiki-harpers/scag, page: "123–124" }
          - { ref: mroi-menestrels }
          - { ref: frwiki-harpers/dragon-430, page: "33–38" }
          - { ref: frwiki-harpers }
