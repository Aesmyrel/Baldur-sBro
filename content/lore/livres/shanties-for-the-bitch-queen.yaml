id: lore.livres.shanties-for-the-bitch-queen
theme: livres
nom: { fr: Chants de marins pour la Reine Garce, en: Shanties for the Bitch Queen, statut: NON_OFFICIELLE }
etiquette_titre: { act: acte1, level: aucun, otherWorks: aucun }
etiquette: { act: acte1, level: aucun, otherWorks: aucun }
resume: >-
  Un petit recueil de chants de marins à la gloire d’Umberlie, la déesse des mers, posé sur un ponton de la Plage ravagée dès le début de l’Acte I.
sections:
  - type: bg3
    titre: Sur le ponton de la Plage ravagée
    etiquette: { act: acte1, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Ce petit livre se ramasse dès les premiers pas de l’Acte I, sur le ponton en ruine de la Plage ravagée, au nord de l’épave du nautiloïde. C’est un recueil de chants de marins composés pour Umberlie (Umberlee), la déesse de la mer, que le jeu attribue à son Église plutôt qu’à un auteur nommé. Tous disent la même chose : la mer, le vent et la vie des équipages restent à la merci d’une déesse qu’il faut se concilier.
        nature: canon_bg3
        refs: [ { ref: b-bg3wiki-shanties-for-the-bitch-queen }, { ref: bg3wiki-ravaged-beach } ]
  - type: general
    titre: Umberlie, la Reine Garce
    etiquette: { act: acte1, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Dans le panthéon de Faerûn, Umberlie (Umberlee) gouverne les océans, les courants, les vagues et les vents du large. Les suppléments de la 2e et de la 3e édition la décrivent cruelle, vaniteuse, avide et lunatique : elle ne tient pas ses promesses et se réjouit des naufrages. On la vénère donc surtout par peur, et la 5e édition range encore les marins et les habitants des côtes parmi ses fidèles, sous le domaine de la Tempête. Elle appartient aux dieux de la fureur que mène Talos, aux côtés d’Aurile et de Malar ; ses titres de Reine des Profondeurs et de Mère de l’Onde se retrouvent jusque dans les suppléments parus en 2025.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: b-frwiki-umberlee }
          - { ref: b-frwiki-umberlee/faiths-and-avatars, page: "173" }
          - { ref: b-frwiki-umberlee/faiths-and-pantheons, page: "82-83" }
          - { ref: b-frwiki-umberlee/phb-5e-2014, page: "62, 294" }
          - { ref: b-frwiki-umberlee/heroes-of-faerun, page: "123, 127" }
          - { ref: b-mroi-umberlie }
      - texte: >-
          Ce culte se paie. Le clergé d’Umberlie prêche la peur de ses vagues et de ses vents, ne rend aucun service sans lourde dîme et, contre rémunération, embarque avec les équipages pour leur garantir une traversée paisible. Avant le départ, marins, marchands et gens des côtes laissent sur ses autels fleurs, bougies, pièces ou friandises, que les prêtres emportent quand nul ne les voit, en lavant l’autel à l’eau de mer et au varech pour signifier que la déesse a pris sa part. Quand la tempête se lève, on jette par-dessus bord or, gemmes ou cargaison, parfois au son d’airs qui lui sont dédiés ; et si le navire sombre malgré tout, il arrive que l’équipage se retourne contre les prêtres qui lui avaient promis la sécurité.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: b-frwiki-umberlee }
          - { ref: b-mroi-umberlie }
          - { ref: b-frwiki-umberlee/faiths-and-avatars, page: "173-174" }
          - { ref: b-frwiki-umberlee/faiths-and-pantheons, page: "83" }
      - texte: >-
          Notre lecture : le recueil reflète fidèlement ce rapport de crainte. Aucun de ses chants ne vante la bonté de la déesse ; tous reconnaissent son pouvoir sur le vent et sur la houle, et se contentent de demander qu’elle les tolère. Ils tiennent davantage de la prière prudente, celle de gens qui vivent de la mer et savent ce qu’elle peut leur coûter, que de l’hymne de dévotion qu’on adresserait à une divinité bienveillante.
        nature: interpretation
        refs:
          - { ref: b-bg3wiki-shanties-for-the-bitch-queen }
          - { ref: b-frwiki-umberlee }
  - type: bg3
    titre: Plus tard, à la Porte de Baldur
    etiquette: { act: acte3, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Le livre n’est pas unique : un autre exemplaire attend dans le Tabernacle de Stormshore, un temple de la Ville basse de la Porte de Baldur où les fidèles de presque tous les dieux viennent prier. Umberlie possède d’ailleurs son propre sanctuaire dans le même quartier, la Maison de la Reine des eaux, bâtie sur un cap rocheux au bout des Quais du port Gris ; sous son portique, une fontaine à l’image de la déesse reçoit les prières et les offrandes du peuple.
        nature: canon_bg3
        refs:
          - { ref: b-bg3wiki-shanties-for-the-bitch-queen }
          - { ref: b-bg3wiki-stormshore-tabernacle }
          - { ref: b-bg3wiki-water-queens-house }
      - texte: >-
          Ce temple ne doit rien au hasard : dans le canon de D&D, la Maison de la Reine des eaux est le plus ancien temple de la Porte de Baldur, et les suppléments la décrivent desservie par des veuves de marins disparus en mer. Le détail figure déjà dans Forgotten Realms Adventures (1990), revient dans le Sword Coast Adventurer’s Guide (2015), et l’aventure Baldur’s Gate: Descent into Avernus (2019) confirme l’ancienneté du lieu.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: b-frwiki-umberlee }
          - { ref: b-frwiki-umberlee/forgotten-realms-adventures, page: "76" }
          - { ref: b-frwiki-umberlee/scag, page: "41" }
          - { ref: b-frwiki-umberlee/descent-into-avernus, page: "193" }
