nom: { fr: Halaster Sombrecape, en: Halaster Blackcloak, statut: NON_OFFICIELLE }
alias: [Halaster Blackcloak, le Mage dément, Hilather]
etiquette_titre: { act: prologue, level: aucun, otherWorks: aucun }
etiquette: { act: prologue, level: aucun, otherWorks: aucun }
resume: >-
  Archimage réputé fou à lier, le créateur de Montprofond, le dédale mortel creusé sous Eauprofonde.
sections:
  - type: general
    titre: Le Mage dément
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Halaster Sombrecape est un magicien humain d’un très grand âge, archimage et créateur de Montprofond (Undermountain), le donjon qui s’étend sous Eauprofonde (Waterdeep). On le dit complètement fou : dans ses souterrains, la lucidité lui revient rarement, mais au-dehors il garde le plus souvent la tête claire et se montre alors froid, courtois, méticuleux, ennuyeux même, et toujours mauvais. Il marmonne, ricane, perd vite le fil d’une conversation, sans que sa folie émousse sa vigilance. Il collectionne monstres inédits, venus surtout d’autres plans, et formes de magie inconnues. Dans le donjon, golems, heaumes animés et pièges lui obéissent ; il y circule « dans les murs », sans un bruit, par ses passages secrets. Des souhaits répétés ont accru son intelligence, et des sorts de contingence comme des clones le protègent en duel. Il n’oublie ni une offense ni un service, impose sa volonté sans souci des dégâts et se mêle parfois de politique, par caprice.
        nature: canon_dnd
        edition: 3e
        refs:
          - { ref: b-frwiki-halaster-blackcloak/frcs-3e, page: "180-181" }
          - { ref: b-mroi-halaster-sombrecape }
  - type: general
    titre: Eauprofonde et la naissance de Montprofond
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          En 168 CV, Halaster s’installe au pied du mont Eauprofonde avec ses apprentis, les Sept. Des êtres d’autres plans qu’il invoque lui élèvent, au centre du plateau d’Aquafond, une tour, des remparts et de petites tours pour ses élèves. En secret, il explore les Bas-foyers de Melairbode (Underhalls), domaine du clan nain Melairkyn ; dès 171 CV, ses Chasses en délogent drows, duergars et monstres. Les Sept le quittent en 307 CV pour régner sur leurs propres domaines souterrains, et en 309 CV il est le maître des tunnels. Son fort abandonné, que les gens de Blackcloak Hold croient maudit, est englobé par la ville au début du XIe siècle CV.
        nature: canon_dnd
        edition: "3.5"
        refs:
          - { ref: b-frwiki-halaster-blackcloak/grand-history-of-the-realms, page: "66, 69, 115, 149-150" }
          - { ref: b-mroi-halaster-sombrecape/city-of-splendors-waterdeep, page: "7" }
      - texte: >-
          Jeune, Halaster est un mage sociable, qui organise foires et assemblées de magiciens et prend de nombreux apprentis ; c’est, dit-on, à force de côtoyer des êtres d’autres plans qu’il sombre dans la folie. Vers 309 CV, il se met à creuser Montprofond, s’y retire et laisse son fort tomber en ruine ; ses ouvriers, jamais libérés, servent à agrandir les salles. Des apprentis venus le chercher, deux périssent et les autres doivent fortifier le donjon. L’apprentie Jhesiyra Kestellharp, elle, refuse et s’échappe, avant de devenir Magister : c’est d’elle que vient le peu qu’on sait de lui.
        nature: canon_dnd
        edition: add2
        refs:
          - { ref: b-frwiki-halaster-blackcloak/ruins-of-undermountain-ii, page: "3-4" }
  - type: ecarts
    titre: D’où vient Halaster ?
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Dans le Villains’ Lorebook (1998), son origine reste inconnue, et on le soupçonne d’être plus âgé qu’Elminster : en 168 CV arrive seulement un mage qui se fait appeler Halaster Sombrecape. Il se nommait peut-être Hilather, et aurait pris un nom qu’il jugeait plus digne d’un grand mage.
        nature: canon_dnd
        edition: add2
        variantes: origine
        refs:
          - { ref: b-frwiki-halaster-blackcloak/villains-lorebook, page: "30" }
      - texte: >-
          The Grand History of the Realms (2007) lui prête un long passé. Né Hilather au Raurin, dans l’Imaskar tardif, ce jeune prodige devient l’un des premiers archimages de l’empire, seigneur et artificier ; il vainc à Metos le mage Madryoch, auteur de la Pierre d’ombre, et l’enferme dans le demi-plan d’emprisonnement. À la chute d’Imaskar, en −2488 CV, il se réfugie en secret sous les monts occidentaux et s’y plonge en stase des millénaires durant, avant d’explorer Faerûn. En 128 CV, la cour de l’empire Shoon l’engage pour mieux lier les fiélons à leurs invocateurs ; en 132 CV, il remet treize Demonshields au qysar Amahl Shoon IV, puis disparaît.
        nature: canon_dnd
        edition: "3.5"
        variantes: origine
        refs:
          - { ref: b-frwiki-halaster-blackcloak/grand-history-of-the-realms, page: "18, 31, 63" }
  - type: ecarts
    titre: Enlèvement, mort et survivances
    etiquette: { act: prologue, level: aucun, otherWorks: leger }
    paragraphes:
      - texte: >-
          À Higharvestide 1369 CV, deux membres de la Twisted Rune l’enlèvent de Montprofond ; dans Undermountain: Stardock (1997), la liche Priamon Frostrune et l’alhoon Ralayan le retiennent à Stardock pour fouiller son esprit. Privé de lui, le donjon se déchaîne et ses portails jettent ses créatures à travers les Royaumes, jusqu’à ce que des aventuriers engagés par les seigneurs d’Eauprofonde le délivrent. En 1372 CV, Mystra lui promet de guérir sa folie s’il tire Elminster des Neuf Enfers ; Halaster s’aventure pour cela en Averne (Avernus).
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: b-frwiki-halaster-blackcloak/grand-history-of-the-realms, page: "69, 115, 149-150" }
          - { ref: b-frwiki-halaster-blackcloak/undermountain-stardock }
          - { ref: b-frwiki-halaster-blackcloak/elminster-in-hell }
      - texte: >-
          Selon The Grand History of the Realms, il meurt par accident le 30 Eleint 1375 CV, peu après l’aube, au cours d’un puissant rituel. Une légère secousse ébranle Eauprofonde, beaucoup d’habitants ont la vision d’un Halaster hurlant, et en mourant il projette visions et contraintes sur des gens de tout le continent. Les prêtresses d’Eilistraee, menées par Qilué Veladorn, fêtent sa disparition d’un chant de joie.
        nature: canon_dnd
        edition: "3.5"
        variantes: sort
        refs:
          - { ref: b-frwiki-halaster-blackcloak/grand-history-of-the-realms, page: "158" }
          - { ref: b-frwiki-halaster-blackcloak }
      - texte: >-
          Pour Dragon n° 409 (2012), Halaster, laissé pour mort, a survécu au rituel : son essence s’est dispersée à travers les plans, et la Magepeste l’empêche de se reformer dans l’un de ses clones. Ces corps de rechange en stase, cachés sous la ville et son donjon, ont tous les âges, sexes et espèces, ne vieillissent pas et portent son esprit dans leur subconscient ; un ou plusieurs se seraient éveillés vers 1479 CV, sans confirmation.
        nature: canon_dnd
        edition: 4e
        variantes: sort
        refs:
          - { ref: b-frwiki-halaster-blackcloak/dragon-409, page: "3-5" }
          - { ref: b-mroi-halaster-sombrecape }
      - texte: >-
          Waterdeep: Dungeon of the Mad Mage (2018) le fait figurer dans son donjon, avec un profil de jeu complet : magicien de niveau 20, de facteur de puissance 23, il parle huit langues, dont l’infernal et le commun des profondeurs, et joue assidûment aux quilles dans une taverne au fond de Montprofond.
        nature: canon_dnd
        edition: 5e-2014
        variantes: sort
        refs:
          - { ref: b-frwiki-halaster-blackcloak/dungeon-of-the-mad-mage, page: "310" }
          - { ref: b-frwiki-halaster-blackcloak }
  - type: autres_oeuvres
    titre: Où le rencontrer
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Halaster traverse les aventures The Ruins of Undermountain (TSR, 1991), sa suite The Deep Levels (1994), Undermountain: Stardock (1997), Expedition to Undermountain (2007) et Waterdeep: Dungeon of the Mad Mage (2018), en français « Waterdeep : Le Donjon du mage dément ». On le retrouve dans les romans Escape from Undermountain (1996) et Elminster in Hell (2001), dans les jeux vidéo Descent to Undermountain (1998) et Neverwinter Nights: Hordes of the Underdark (2003), où il ne s’exprime qu’en rimes.
        nature: hors_univers
        refs:
          - { ref: b-frwiki-halaster-blackcloak/ruins-of-undermountain }
          - { ref: b-frwiki-halaster-blackcloak/ruins-of-undermountain-ii }
          - { ref: b-frwiki-halaster-blackcloak/undermountain-stardock }
          - { ref: b-frwiki-halaster-blackcloak/expedition-to-undermountain }
          - { ref: b-frwiki-halaster-blackcloak/dungeon-of-the-mad-mage }
          - { ref: b-frwiki-halaster-blackcloak/escape-from-undermountain }
          - { ref: b-frwiki-halaster-blackcloak/elminster-in-hell }
          - { ref: b-frwiki-halaster-blackcloak/descent-to-undermountain }
          - { ref: b-frwiki-halaster-blackcloak/nwn-hordes-of-the-underdark }
          - { ref: b-frwiki-halaster-blackcloak }
