id: lore.personnages.halaster-blackcloak
theme: personnages
nom: { fr: Halaster Sombrecape, en: Halaster Blackcloak, statut: NON_OFFICIELLE }
alias: [Halaster Blackcloak, le Mage dément, Hilather]
etiquette_titre: { act: prologue, level: aucun, otherWorks: aucun }
etiquette: { act: prologue, level: aucun, otherWorks: aucun }
resume: >-
  Archimage dément vieux de plusieurs millénaires, Halaster a creusé sous Eauprofonde le plus célèbre donjon des Royaumes, Montprofond, dont il reste le maître insaisissable.
sections:
  - type: general
    titre: Le maître fou de Montprofond
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Après des millénaires d’existence, Halaster Sombrecape (Halaster Blackcloak), le Mage dément de Montprofond (Undermountain), ne trouve presque plus rien de neuf : lui qui collectionne les monstres inconnus et les magies nouvelles trompe son ennui en se mêlant, par caprice, des affaires du monde. Le décor de campagne de 2001 le montre, dans son dédale sous Eauprofonde (Waterdeep), marmonnant et ricanant sans fin, incapable de suivre une discussion, mais toujours prompt à flairer le danger et à riposter. Hors de chez lui, la raison lui revient presque entièrement : c’est alors un homme glacial et courtois, maniaque dans ses habitudes, qui ne supporte aucune insolence, se souvient de chaque tort comme de chaque aide, et reste foncièrement mauvais. Expert en taille des gemmes et en ingénierie, il commande golems et autres créatures artificielles, et des clones le protègent de la mort.
        nature: canon_dnd
        edition: 3e
        refs:
          - { ref: b-frwiki-halaster-blackcloak }
          - { ref: b-mroi-halaster-sombrecape }
          - { ref: b-frwiki-halaster-blackcloak/frcs-3e, page: "180-181" }
  - type: general
    titre: Le bâtisseur du dédale
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Tout commence par une tour. En 168 CV, Halaster s’installe sur le plateau d’Aquafond (Deepwater Plateau), au pied de la montagne qui domine le site d’Eauprofonde, avec sept apprentis, les Sept, et y fait élever une place forte, tour, remparts et tours plus petites pour ses élèves, par des êtres convoqués d’autres plans. L’ouvrage achevé, il ne les libère pas : il les envoie creuser toujours plus loin sous la roche. Il s’approprie les Bas-foyers de Melairbode (Underhalls), anciennes salles des nains du clan Melairkyn, et, à partir de 171 CV, mène de longues chasses pour en déloger drows, duergars et monstres. Vers 309 CV, maître de ces galeries, il se met à les transformer en un donjon sans égal par son étendue comme par ses dangers, et abandonne sa tour pour vivre sous terre.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: b-frwiki-halaster-blackcloak }
          - { ref: b-mroi-halaster-sombrecape }
          - { ref: b-frwiki-halaster-blackcloak/villains-lorebook, page: "30" }
          - { ref: b-frwiki-halaster-blackcloak/grand-history-of-the-realms, page: "66, 69" }
          - { ref: b-frwiki-halaster-blackcloak/ruins-of-undermountain-ii, page: "3-4" }
          - { ref: b-mroi-halaster-sombrecape/city-of-splendors-waterdeep, page: "7" }
      - texte: >-
          Jeune, il était sociable, organisait des rencontres de mages et formait de nombreux élèves ; les sages imputent sa démence à son long commerce avec les puissances d’autres plans, qui aurait fait grandir sa folie avec son pouvoir. Les Sept le quittent en 307 CV pour se tailler leurs propres domaines souterrains. Quand certains reviennent le chercher, il en tue deux et exige des autres qu’ils fortifient son dédale ; seule Jhesiyra Kestellharp lui échappe, et c’est d’elle que vient le peu qu’on sait de lui. La ville finit par gagner les ruines de sa tour, qu’Ahghairon entoure de protections en 1007 CV. En 1369 CV encore, son enlèvement hors de Montprofond par des membres de la Rune tordue (Twisted Rune) suffit à libérer la magie du dédale, qui projette ses créatures à travers les Royaumes.
        nature: canon_dnd
        edition: multi
        refs:
          - { ref: b-frwiki-halaster-blackcloak }
          - { ref: b-mroi-halaster-sombrecape }
          - { ref: b-frwiki-halaster-blackcloak/ruins-of-undermountain-ii, page: "3-4" }
          - { ref: b-frwiki-halaster-blackcloak/grand-history-of-the-realms, page: "69, 115, 149-150" }
          - { ref: b-frwiki-halaster-blackcloak/undermountain-stardock }
  - type: ecarts
    titre: D’où vient-il ?
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Dans le Villains’ Lorebook (1998), un supplément de la 2e édition, ses origines restent une énigme : l’histoire ne retient ni sa patrie ni l’époque de sa naissance, et l’on soupçonne seulement qu’il est plus âgé encore qu’Elminster. Le livre raconte en revanche son installation sur le site d’Eauprofonde en 168 CV, entouré de ses apprentis : pour cet ouvrage, l’histoire connue du Mage dément commence là.
        nature: canon_dnd
        edition: add2
        variantes: origine
        refs:
          - { ref: b-frwiki-halaster-blackcloak/villains-lorebook, page: "30" }
          - { ref: b-frwiki-halaster-blackcloak }
      - texte: >-
          La Grand History of the Realms (2007) lui prête au contraire un très long passé. Né Hilather, dans le Raurin, au temps de l’empire d’Imaskar, ce prodige devient l’un des plus grands mages de l’empire, qu’il sauve d’un rival, Madryoch, en l’enfermant dans un demi-plan. À la chute d’Imaskar, il se réfugie dans une forteresse cachée sous les montagnes et y dort en stase des millénaires durant. Réveillé, il entre en 128 CV au service de l’empire de Shoon, qui le charge de trouver un moyen plus sûr d’asservir les fiélons à leurs invocateurs ; quatre ans plus tard, il lui remet treize boucliers démoniaques (Demonshields), puis disparaît.
        nature: canon_dnd
        edition: "3.5"
        variantes: origine
        refs:
          - { ref: b-frwiki-halaster-blackcloak/grand-history-of-the-realms, page: "18, 31, 63" }
          - { ref: b-frwiki-halaster-blackcloak }
  - type: ecarts
    titre: Mort ou vivant ?
    etiquette: { act: prologue, level: aucun, otherWorks: leger }
    paragraphes:
      - texte: >-
          Pour la Grand History of the Realms, Halaster meurt en 1375 CV : il se tue par mégarde en tentant un puissant rituel. Peu après l’aube, un séisme ébranle Eauprofonde sans y faire grand dégât ; beaucoup y voient en vision le mage hurlant, le regard en feu, et les lanceurs de sorts aperçoivent des piliers qui se fendent et des gouffres qui s’ouvrent dans le dédale. En mourant, il projette à travers Faerûn des visions et des appels désespérés.
        nature: canon_dnd
        edition: "3.5"
        variantes: sort
        refs:
          - { ref: b-frwiki-halaster-blackcloak/grand-history-of-the-realms, page: "158" }
          - { ref: b-frwiki-halaster-blackcloak }
          - { ref: b-mroi-halaster-sombrecape }
      - texte: >-
          Le magazine Dragon (n° 409, 2012) revient sur cette fin : le rituel aurait dispersé l’essence d’Halaster à travers les plans sans le tuer, et la Magepeste l’aurait empêchée de se reformer dans l’un des clones qu’il gardait en stase dans Montprofond et sous Eauprofonde. Un ou plusieurs de ces corps, d’âge, de sexe ou de peuple différents, auraient pu être libérés d’ici 1479 CV ; chacun mène sa propre vie, épargné par le vieillissement, avec au fond de l’esprit une part du mage qui cherche à prendre le dessus.
        nature: canon_dnd
        edition: 4e
        variantes: sort
        refs:
          - { ref: b-frwiki-halaster-blackcloak/dragon-409, page: "3-5" }
          - { ref: b-frwiki-halaster-blackcloak }
      - texte: >-
          Waterdeep: Dungeon of the Mad Mage (2018), aventure de la 5e édition située en 1492 CV, le remet au premier plan en maître bien vivant de Montprofond. Chaotique mauvais comme dans les éditions précédentes, il y est un magicien de niveau 20, d’un facteur de puissance de 23, contre 30 dans le décor de 2001, et parle huit langues, de l’abyssal au commun des profondeurs en passant par le céleste, le draconique et l’infernal.
        nature: canon_dnd
        edition: 5e-2014
        variantes: sort
        refs:
          - { ref: b-frwiki-halaster-blackcloak/dungeon-of-the-mad-mage, page: "310" }
          - { ref: b-frwiki-halaster-blackcloak/frcs-3e, page: "180-181" }
          - { ref: b-frwiki-halaster-blackcloak }
  - type: autres_oeuvres
    titre: Dans les aventures, les romans et les jeux
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Halaster traverse les aventures consacrées à Montprofond, de The Ruins of Undermountain (1991) à Undermountain: Stardock (1997), Expedition to Undermountain (2007) et Waterdeep: Dungeon of the Mad Mage (2018). On le croise aussi dans des romans, comme Escape from Undermountain (1996) ou Elminster in Hell (2001), et dans des jeux vidéo, de Descent to Undermountain (1998) à l’extension Hordes of the Underdark (2003) de Neverwinter Nights, où il ne s’exprime qu’en vers.
        nature: hors_univers
        refs:
          - { ref: b-frwiki-halaster-blackcloak }
          - { ref: b-frwiki-halaster-blackcloak/ruins-of-undermountain }
          - { ref: b-frwiki-halaster-blackcloak/undermountain-stardock }
          - { ref: b-frwiki-halaster-blackcloak/expedition-to-undermountain }
          - { ref: b-frwiki-halaster-blackcloak/dungeon-of-the-mad-mage }
          - { ref: b-frwiki-halaster-blackcloak/escape-from-undermountain }
          - { ref: b-frwiki-halaster-blackcloak/elminster-in-hell }
          - { ref: b-frwiki-halaster-blackcloak/descent-to-undermountain }
          - { ref: b-frwiki-halaster-blackcloak/nwn-hordes-of-the-underdark }
