id: lore.chronologie.dales-compact
theme: chronologie
nom: { fr: Pacte des Vaux, en: Dales Compact, statut: NON_OFFICIELLE }
etiquette_titre: { act: prologue, level: aucun, otherWorks: aucun }
etiquette: { act: prologue, level: aucun, otherWorks: aucun }
resume: >-
  En 1 CV, elfes et humains scellent au cœur du Cormanthor un accord dont l’année devient le point de départ du calendrier le plus répandu de Faerûn.
sections:
  - type: general
    titre: L’accord de l’an 1
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Vers −200 CV, des hameaux et des fermes humaines s’égrènent déjà autour du Cormanthor. Aux premiers venus, d’ascendance chondathe, se joignent des colons de tout Faerûn qu’attire une région riche ; mais la grande forêt appartient à l’empire elfe de Cormanthyr, qui la défend et freine les coupes humaines. Pour prévenir une guerre avec cette population croissante, le coronal Eltargrim Irithyl négocie avec les magiciens de la jeune société humaine, ancêtres des Valiens (Dalesfolk). Conclu en 1 CV, l’année dite Year of Sunrise, l’accord ouvre aux futurs habitants des Vaux (Dalelands) les terres de lisière où la forêt ne pousse pas et que les elfes ne revendiquent pas ; en retour, ils renoncent à abattre le moindre arbre plus avant. Elfes et Valiens dressent alors au centre des bois la Pierre levée (Standing Stone), symbole d’unité dont des runes elfiques gravent les termes du traité.
        nature: canon_dnd
        edition: 3e
        refs:
          - { ref: b-frwiki-history-of-the-dalelands/frcs-3e, page: "118" }
          - { ref: b-frwiki-dales-compact/frcs-3e, page: "118" }
          - { ref: b-mroi-pacte-des-vaux/frcs-3e, page: "197 (éd. fr.)" }
          - { ref: b-frwiki-1-dr }
          - { ref: b-frwiki-standing-stone/frcs-3e, page: "124" }
      - texte: >-
          Le monument est un grand obélisque, un monolithe gris sombre et lustré, haut de 6 m (20 pieds), dont la surface enchantée efface vite toute dégradation. Il s’élève dans le Cormanthor, juste au sud de Myth Drannor, à la croisée de la route de Rauthauvyr et de la route de la Mer de Lune (Moonsea Ride), à peu près à mi-chemin entre Blackfeather Bridge et Hillsfar.
        nature: canon_dnd
        edition: add2
        refs:
          - { ref: b-frwiki-standing-stone/the-dalelands, page: "4, 55" }
          - { ref: b-frwiki-standing-stone/volos-guide-to-the-dalelands, page: "7" }
  - type: general
    titre: Le Calendrier des Vaux
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Le Calendrier des Vaux (CV ; en anglais Dalereckoning, DR), qu’on appelle encore Calendrier de la Naissance du Val ou de l’Homme Libre, part de la fondation de la Pierre levée et de la conclusion de l’accord. Premier calendrier humain, accordé dès sa création au calendrier elfe par la Cour elfique, il se répand vite partout où les deux peuples vivent en paix ; il devient le plus populaire de Faerûn, l’étalon de tous les autres. Les noms des années viennent du Roll of Years, une liste de plusieurs milliers d’entrées due à Augathra la Folle (Augathra the Mad), que conserve la bibliothèque de Château-Suif (Candlekeep).
        nature: canon_dnd
        edition: 3e
        refs:
          - { ref: b-mroi-calendrier-des-vaux }
          - { ref: b-mroi-calendrier-des-vaux/frcs-3e, page: "78, 269 (éd. fr.)" }
          - { ref: b-frwiki-marking-the-years }
      - texte: >-
          Si chaque année porte le même nom dans tous les Royaumes, chaque royaume ou cité-État la numérote à sa manière, d’après une dynastie, un règne ou une fondation, et ces décomptes entremêlés déroutent le commun comme les sages. Le Cormyr compte depuis la fondation de la maison Obarskyr, toujours sur le trône ; les marchands sembiens répandent ce calendrier comme celui des Vaux, et les 25 ans qui les séparent sèment la confusion. Celui d’Amn, compté depuis Athkatla en 100 CV, reste peu employé : on lui préfère le Calendrier des Vaux. Le Present Reckoning (PR), dont l’an 0 est 1358 CV, l’année du Temps des troubles, reçoit l’aval de Khelben Arunsun et de Vangerdahast, et les Ménestrels (Harpers) le diffusent.
        nature: canon_dnd
        edition: add2
        refs:
          - { ref: b-frwiki-marking-the-years/grand-tour-of-the-realms, page: "22-23" }
          - { ref: b-frwiki-marking-the-years }
  - type: ecarts
    titre: Le Cormyr, fondé en 1 ou en 26 CV ?
    etiquette: { act: prologue, level: aucun, otherWorks: aucun }
    paragraphes:
      - texte: >-
          Dans Old Empires, supplément de 2e édition paru en 1990, le royaume du Cormyr naît en 1 CV : la même année, donc, que le pacte conclu entre les elfes de Cormanthyr et les Valiens, et que l’érection de la Pierre levée.
        nature: canon_dnd
        edition: add2
        variantes: fondation-cormyr
        refs:
          - { ref: b-frwiki-1-dr/old-empires, page: "5" }
      - texte: >-
          Le Forgotten Realms Campaign Setting de 2001 place cette fondation en 26 CV : Faerlthann Obarskyr établit alors le royaume, avec l’accord des elfes du pays. La même année meurt Ondeth Obarskyr, et Baerauble Etharr devient le premier magicien royal.
        nature: canon_dnd
        edition: 3e
        variantes: fondation-cormyr
        refs:
          - { ref: b-frwiki-26-dr/frcs-3e, page: "113" }
      - texte: >-
          The Grand History of the Realms (2007) retient lui aussi 26 CV, l’année où commence le calendrier du Cormyr (Cormyr Reckoning). Il note que des chronologies plus anciennes, datées elles aussi en CV, plaçaient cette fondation en 1 CV.
        nature: canon_dnd
        edition: "3.5"
        variantes: fondation-cormyr
        refs:
          - { ref: b-frwiki-26-dr/grand-history-of-the-realms, page: "60" }
          - { ref: b-frwiki-marking-the-years/grand-history-of-the-realms, page: "4" }
  - type: ecarts
    titre: Qui a détruit la Pierre levée ?
    etiquette: { act: prologue, level: aucun, otherWorks: leger }
    paragraphes:
      - texte: >-
          Selon The Grand History of the Realms (2007), la Pierre tombe le 21 Flamerule 1374 CV sous les coups des fey’ri de la maison Dlardrageth, dits aussi daemonfey, qui remportent ensuite une victoire décisive sur l’armée de Hillsfar. Dès le 26 Kythorn, ils s’en étaient pris au grand camp que les Plumes rouges de Hillsfar avaient dressé à la Pierre. Après la destruction, la maison Dlardrageth s’allie aux drows de la maison Jaelre.
        nature: canon_dnd
        edition: "3.5"
        variantes: destruction
        refs:
          - { ref: b-frwiki-standing-stone/grand-history-of-the-realms, page: "156" }
          - { ref: b-frwiki-cormanthor-war }
      - texte: >-
          L’Encyclopédie des Royaumes oubliés (Forgotten Realms Campaign Guide, 2008) attribue la destruction à des drows, vers la fin du XIVe siècle CV, cinquante ans avant 1425 CV. Les gens d’Ashabenford la rebâtissent un peu plus d’un demi-siècle plus tard : en 1425 CV, l’Année des Sept Sœurs, Ashabenford, siège permanent du conseil des Vaux, réaffirme l’ancien pacte avec Myth Drannor restaurée.
        nature: canon_dnd
        edition: 4e
        variantes: destruction
        refs:
          - { ref: b-mroi-pierre-levee/forgotten-realms-campaign-guide, page: "192 (éd. fr.)" }
          - { ref: b-mroi-pacte-des-vaux }
          - { ref: b-frwiki-standing-stone/forgotten-realms-campaign-guide, page: "108" }
  - type: general
    titre: Treize siècles d’épreuves
    etiquette: { act: prologue, level: aucun, otherWorks: leger }
    paragraphes:
      - texte: >-
          Le pacte tient plus de treize siècles. Il résiste aux envahisseurs venus de la Mer de Lune (Moonsea), à l’expansion sembienne, à des catastrophes magiques, le plus souvent elfiques, et à des trahisons, le plus souvent humaines. Après 714 CV, privés de leurs protecteurs elfes, les Vaux humains prennent leur essor par eux-mêmes ; en 1344 CV, la plupart des elfes du Cormanthor quittent le continent. C’est au moment de leur départ pour Éternelle-Rencontre (Evermeet) que Valarchen (Archendale) rompt le pacte, en 1372 CV, puis exploite les arbres de la forêt.
        nature: canon_dnd
        edition: 3e
        refs:
          - { ref: b-mroi-pacte-des-vaux/frcs-3e, page: "197 (éd. fr.)" }
          - { ref: b-frwiki-history-of-the-dalelands/frcs-3e, page: "118, 123" }
      - texte: >-
          Dès 1044 CV, les Vaux forment des communautés indépendantes, alliées au sein du conseil des Vaux (Dales Council). En 1374 CV, Seiveril Miritar, seigneur elfe d’Evereska à la tête d’une croisade partie d’Éternelle-Rencontre, ravive le pacte le 28 Mirtul, au lac Sember, avec Battledale, Deepingdale, Mistledale et Shadowdale. Il l’invoque pour engager ces Vaux dans la guerre contre la maison Dlardrageth : c’est la guerre de Cormanthor, qui embrase la forêt et les Vaux de 1374 à 1376 CV.
        nature: canon_dnd
        edition: "3.5"
        refs:
          - { ref: b-frwiki-history-of-the-dalelands/grand-history-of-the-realms, page: "155, 156" }
          - { ref: b-frwiki-cormanthor-war }
