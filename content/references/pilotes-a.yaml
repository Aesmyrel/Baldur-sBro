# Registre des références du lot de fiches pilotes A (un par thème : panthéon, cosmologie, peuples,
# bestiaire, factions, lieux). Pages de wiki consultées directement, avec leur révision ; livres cités par
# ces pages, non consultés nous-mêmes (consultation secondaire, « via » la page qui les cite).
# Identifiant d’un livre cité : « <page de wiki>/<livre> », pour que chaque renvoi désigne la page qui le cite.
# Éditeur et année repris du modèle de citation de la page qui cite le livre. Titres VF (« titre_vf ») vérifiés sur
# Wikipédia FR, articles « Royaumes oubliés » (révision 240404251, entrée wpfr-royaumes-oublies) et « Donjons et Dragons ».

