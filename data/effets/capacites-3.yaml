feature.draconic-resilience:
  effets:
    - "Sans armure : classe d’armure de base 13 + modificateur de Dextérité, au lieu de 10 + modificateur de Dextérité."
  notes:
    - "Un bouclier ne l’empêche pas ; un casque, des gants ou des bottes classés comme armure légère, intermédiaire ou lourde l’empêchent."
    - "Ne se cumule pas avec Armure de mage, Défense sans armure ou Peau d’écorce : seule la meilleure classe d’armure de base compte ; les autres bonus de classe d’armure s’ajoutent normalement."
    - "Fonctionne sous Forme sauvage si aucune armure n’était portée avant la transformation, pour une forme dont la classe d’armure de base est inférieure à 13."
  revision: 432293
feature.dread-ambusher:
  effets:
    - "Initiative : +3."
    - "Premier tour de chaque combat : +3 m de vitesse de déplacement et une attaque d’arme supplémentaire, qui inflige 1d8 dégâts supplémentaires du type de l’arme (état Embusqué redoutable, 1 tour)."
  notes:
    - "Le déplacement supplémentaire disparaît dès que l’attaque supplémentaire est faite."
  revision: 432295
feature.dread-ambusher-hide:
  effets:
    - "Action bonus : le personnage tente de se cacher (état Caché), sur des tests de Dextérité (Discrétion)."
    - "Caché : invisible pour les ennemis tant qu’il n’entre pas dans leur champ de vision ; avantage aux jets d’attaque."
    - "Attaquer ou lancer un sort fait sortir de l’état Caché."
  revision: 365266
feature.dread-ambusher-melee:
  effets:
    - "Premier tour du combat, sans coût d’action, une fois par combat : attaque avec l’arme de corps à corps ; dégâts de l’arme + 1d8 dégâts du type de l’arme."
  notes:
    - "Met fin à l’état Embusqué redoutable, et donc aux 3 m de déplacement supplémentaires."
  revision: 417933
feature.dread-ambusher-ranged:
  effets:
    - "Premier tour du combat, sans coût d’action, une fois par combat : attaque avec l’arme à distance ; dégâts de l’arme + 1d8 dégâts du type de l’arme."
  notes:
    - "Met fin à l’état Embusqué redoutable, et donc aux 3 m de déplacement supplémentaires."
  revision: 417934
feature.dreadful-aspect:
  effets:
    - "Action, 1 charge de Conduit de serment : chaque ennemi dans un rayon de 9 m fait un jet de sauvegarde de Sagesse (DD de sauvegarde des sorts) ; en cas d’échec, il subit l’état Effrayé pendant 2 tours."
  revision: 417937
feature.drunkards-luck:
  effets:
    - "Une fois par tour, 2 points de ki : annule le désavantage d’un test de caractéristique, d’un jet d’attaque ou d’un jet de sauvegarde que le moine vient de lancer."
  revision: 432305
feature.drunken-performance:
  effets:
    - "Maîtrise de la compétence Représentation."
  notes:
    - "Vaut avec ou sans l’état Ivre (maître ivre) ; ne donne pas la maîtrise des instruments de musique."
  revision: 432306
feature.drunken-technique:
  effets:
    - "Action bonus, 1 point de ki : deux attaques à mains nues au corps à corps ; chacune inflige les dégâts contondants à mains nues."
    - "Le moine obtient l’état Technique de l’ivrogne pendant 1 tour : +3 m de déplacement et les effets de Désengagement."
  notes:
    - "Chaque coup profite de tout ce qui améliore les attaques à mains nues."
  revision: 417994
feature.dual-wielder:
  effets:
    - "Combat à deux armes possible avec toute arme qui n’est pas à deux mains, même si elle n’est pas légère."
  notes:
    - "Ne donne pas le style Combat à deux armes : sans lui, le modificateur de caractéristique ne s’ajoute toujours pas aux dégâts de la main secondaire."
  revision: 438929
feature.dual-wielder-bonus-armour-class:
  effets:
    - "Une arme de corps à corps dans chaque main : +1 à la classe d’armure."
  revision: 438866
feature.duelling:
  effets:
    - "Arme de corps à corps qui n’est pas à deux mains, tenue d’une main, sans arme dans l’autre : +2 dégâts avec cette arme."
    - "Un bouclier dans l’autre main n’empêche pas le bonus."
  revision: 432309
feature.duergar-resilience:
  effets:
    - "Jets de sauvegarde contre les illusions et contre les états Charmé et Paralysé : avantage."
  notes:
    - "Contre la paralysie, l’avantage ne joue en pratique que contre deux actions de tout le jeu."
  revision: 438333
feature.dungeon-delver-perception:
  effets:
    - "Tests de Sagesse (Perception) qui portent sur des objets, y compris pour repérer les objets cachés : avantage."
  revision: 438969
feature.dungeon-delver-resist-traps:
  effets:
    - "Jets de sauvegarde contre les pièges : avantage."
    - "Résistance aux dégâts des pièges."
  revision: 438970
feature.durable:
  effets:
    - "Repos court : tous les points de vie sont rendus."
    - "Constitution +1, jusqu’à 20 au maximum."
  notes:
    - "L’augmentation est perdue si des bonus non plafonnés portent déjà la Constitution à 20 ou plus ; elle s’applique aussi sous Forme sauvage."
  revision: 438922
feature.dwarven-resilience:
  effets:
    - "Jets de sauvegarde contre l’état Empoisonné : avantage."
    - "Résistance aux dégâts de poison."
  revision: 438182
feature.dwarven-toughness:
  effets:
    - "Points de vie maximum : +1 par niveau."
  revision: 425962
feature.eagle-heart:
  effets:
    - "Donne Rage : cœur d’aigle, une rage propre à cette voie, et Frappe en piqué."
    - "Sous cette rage : désavantage aux attaques d’opportunité contre le barbare, Pointe possible par une action bonus, et Frappe en piqué utilisable."
  revision: 438243
feature.eldritch-strike:
  effets:
    - "Attaque d’arme réussie contre une créature : état Frappé d’inertie occulte pendant 2 tours ; désavantage à ses jets de sauvegarde contre le personnage."
  notes:
    - "Joue sur tous les jets de sauvegarde que le personnage impose pendant la durée, pas seulement contre le prochain sort ; les actions d’arme et les autres effets qui ne sont pas des sorts comptent aussi."
  revision: 432475
feature.elemental-affinity-damage:
  effets:
    - "Sort qui inflige des dégâts du type de l’ascendance draconique : le modificateur de Charisme s’ajoute à ces dégâts."
  revision: 432493
feature.elemental-affinity-resistance:
  effets:
    - "Au lancement d’un sort qui inflige des dégâts du type de l’ascendance draconique, 1 point de sorcellerie : résistance à ce type de dégâts jusqu’au prochain repos long."
  notes:
    - "Proposée aussi pour des actions de ce type qui n’infligent pas de dégâts, et même quand la résistance est déjà acquise : le point peut être gaspillé."
  revision: 432495
feature.elemental-cleaver:
  effets:
    - "Sous l’état Rage, sans coût d’action : jusqu’à la fin de la rage, l’arme inflige 1d6 dégâts supplémentaires d’acide, de froid, de feu, de foudre ou de tonnerre, au choix."
    - "L’arme gagne aussi la propriété Lancer et revient aussitôt en main après un lancer."
  notes:
    - "Utilisable plusieurs fois par tour, sur autant d’armes qu’on veut, y compris une arme à distance, qu’il faut alors déséquiper pour la lancer."
    - "Se cumule avec Arme élémentaire ; les dégâts élémentaires d’une arme lancée ne sont pas magiques."
  revision: 418107
feature.elk-heart:
  effets:
    - "Donne Rage : cœur d’élan, une rage propre à cette voie, et Ruée primitive."
    - "Sous cette rage : +4,5 m de vitesse de déplacement, et Ruée primitive utilisable."
  revision: 432503
feature.embrace-of-the-inferno:
  effets:
    - "Action, 3 points de ki : 3 rayons de feu à distance ; chacun fait une attaque de sort à distance et inflige 2d6 dégâts de feu."
    - "Niveau 9, avec Incantation élémentaire améliorée : un 4e rayon."
    - "Utiliser l’aptitude ouvre droit à Arts martiaux : attaque à mains nues supplémentaire."
  revision: 335588
feature.empowered-evocation:
  effets:
    - "Sort d’évocation : le modificateur d’Intelligence s’ajoute aux jets de dégâts."
  notes:
    - "S’ajoute à chaque source de dégâts du sort : chaque projectile de Projectile magique, chaque rayon de Rayon ardent ou de Décharge occulte."
    - "Vaut pour tous les sorts d’évocation, sorts mineurs compris (Trait de feu, Poigne électrique…), même appris par une autre classe."
  revision: 432507
feature.enraged-throw:
  effets:
    - "Sous l’état Frénétique, action bonus : un objet ou une créature à 1,5 m ou moins est lancé sur une cible à 18 m ou moins ; jet d’attaque à distance à mains nues."
    - "Dégâts contondants selon le poids de ce qui est lancé, plus des dégâts supplémentaires selon la Force ; une arme de lancer inflige ses dégâts de corps à corps."
    - "La cible touchée tombe À terre pendant 1 tour, sans jet de sauvegarde."
  notes:
    - "La Force détermine aussi le poids qu’on peut soulever ; les objets plus lourds font plus mal."
  revision: 391871
feature.entropic-ward:
  effets:
    - "Réaction, une fois par repos court, jet d’attaque contre le personnage : désavantage à ce jet."
    - "Si l’attaque échoue : avantage au prochain jet d’attaque contre l’attaquant, pendant 1 tour (état Protection entropique)."
  notes:
    - "Inutilisable sous Forme étoilée ou sous l’effet de Déguisement."
  revision: 432511
feature.escape-the-horde:
  effets:
    - "Attaques d’opportunité contre le personnage : désavantage."
  revision: 432513
feature.evasion:
  effets:
    - "Effet de zone qui permet un jet de sauvegarde de Dextérité pour subir la moitié des dégâts : aucun dégât en cas de réussite, la moitié en cas d’échec."
  notes:
    - "En pratique, surtout les explosions de zone (Boule de feu, oui ; Flamme sacrée, à cible unique, non) ; quelques effets sans jet de Dextérité comptent aussi."
    - "Les autres effets de l’attaque, comme un état, s’appliquent quand même."
  revision: 432519
feature.evasive-footwork:
  effets:
    - "Sans coût d’action, 1 dé de supériorité : désavantage aux attaques au corps à corps contre le personnage (état Jeu de jambes évasif, 1 tour)."
  notes:
    - "L’état prend fin à la fin du tour du personnage : il ne protège que des attaques subies pendant ce tour, comme une attaque d’opportunité ou une riposte."
  revision: 418303
feature.exceptional-training:
  effets:
    - "Les compagnons invoqués du rôdeur peuvent foncer (Pointe), se désengager (Désengagement) et aider un allié par une action bonus."
  notes:
    - "Un compagnon qui fonce d’abord par l’action bonus ne peut plus utiliser l’action Pointe ordinaire dans le même tour ; dans l’autre ordre, si."
  revision: 432523
feature.experimental-alchemy:
  effets:
    - "Combinaison d’extraits : test de Sagesse (Médecine) DD 15 ; en cas de réussite, deux solutions alchimiques au lieu d’une."
  revision: 432530
feature.expert-divination:
  effets:
    - "Un dé de Présage supplémentaire, soit 3 au total."
    - "Après un repos court : une prophétie tirée au hasard par dé de Présage dépensé ; chaque prophétie accomplie rend un dé, de valeur tirée au hasard."
    - "Prophéties possibles : infliger un type de dégâts donné, lancer un sort d’une école donnée, apprendre ou lancer un sort depuis un parchemin, tuer un ennemi, aider un allié."
  notes:
    - "La prophétie qui demande d’aider un allié ne peut jamais être accomplie."
    - "Les dés de Présage ont des valeurs distinctes : un dé rendu dont la valeur est déjà détenue n’est pas gagné."
  revision: 432532
feature.expertise-passive-feature:
  effets:
    - "Deux compétences maîtrisées, au choix : bonus de maîtrise doublé pour les tests de caractéristique qui les utilisent."
  revision: 418324
feature.exploit-weakness:
  effets:
    - "Créature blessée par l’arme au corps à corps : vulnérabilité aux dégâts perforants pendant 1 tour (état Aura de meurtre (malus))."
  notes:
    - "Lancer l’arme n’applique pas l’effet."
  revision: 432533
feature.extra-attack:
  effets:
    - "Après une attaque qui coûte une action (arme, mains nues ou lancer) : une attaque supplémentaire, sans coût d’action."
  notes:
    - "Une attaque par action bonus ou par réaction ne la déclenche pas."
    - "Ne se cumule pas avec une autre Attaque supplémentaire, sauf celle du Pacte de la lame hors du mode Honneur."
    - "L’action de Fougue la déclenche ; hors du mode Honneur, les actions supplémentaires d’autres sources, comme l’état Accéléré, aussi."
    - "Une attaque qui ouvre le combat, ou qui fait rejoindre le premier round d’un combat en cours, ne la déclenche pas."
  revision: 432537
feature.eyes-of-the-dark:
  effets:
    - "Vision dans le noir jusqu’à 24 m : pas de désavantage pour attaquer une créature dans l’obscurité à cette distance."
  notes:
    - "Ne permet pas de voir dans les ténèbres magiques."
  revision: 437803
feature.fancy-footwork:
  effets:
    - "Attaque au corps à corps, réussie ou non, contre une cible : celle-ci ne peut plus porter d’attaque d’opportunité contre le roublard jusqu’à la fin de son tour."
  notes:
    - "Les ennemis dotés des dons Mage de guerre ou Maître des armes d’hast gardent leurs attaques d’opportunité."
  revision: 432543
feature.fangs-of-the-fire-snake:
  effets:
    - "Action, 1 point de ki : attaque à mains nues contre une cible à 6 m ou moins ; dégâts contondants à mains nues + 1d10 dégâts de feu."
    - "Puis état Crocs du serpent de feu pendant 1 tour : les attaques au corps à corps suivantes infligent 1d4 dégâts de feu supplémentaires."
  notes:
    - "Compte comme une attaque à mains nues : profite de tout ce qui les améliore, dont Attaque supplémentaire."
    - "Le bonus de 1d4 s’applique aussi aux attaques d’arme à distance, mais pas aux sorts qui sont des attaques au corps à corps."
  revision: 418395
feature.fast-hands:
  effets:
    - "Une action bonus supplémentaire par tour, utilisable pour n’importe quelle action bonus."
  revision: 432544
feature.fast-movement:
  effets:
    - "Sans armure lourde : +3 m de vitesse de déplacement."
  revision: 432545
feature.feinting-attack:
  effets:
    - "Action : attaque avec l’arme de corps à corps, avec l’avantage ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "L’action bonus et le dé de supériorité ne sont dépensés que si l’attaque touche."
  notes:
    - "N’existe qu’au corps à corps, sans version à distance."
  revision: 418419
feature.feral-instinct:
  effets:
    - "Initiative : +3."
    - "Immunité à l’état Surpris."
  revision: 432553
feature.fey-ancestry:
  effets:
    - "Jets de sauvegarde contre l’état Charmé : avantage."
    - "La magie ne peut pas plonger le personnage dans le sommeil (état Endormi)."
  revision: 438170
feature.fey-life:
  effets:
    - "Jets de sauvegarde contre la mort du porteur : DD 5 au lieu de 10."
  revision: 432556
feature.fey-presence:
  effets:
    - "Action, une fois par repos court, au choix : chaque ennemi dans un rayon de 3 m fait un jet de sauvegarde de Sagesse (DD de sauvegarde des sorts) ; en cas d’échec, il subit l’état Charmé, ou l’état Effrayé, pendant 2 tours."
  notes:
    - "Pour la version qui charme, le jet est influencé par ce qui joue sur les sauvegardes contre l’état Effrayé, et non contre l’état Charmé."
  revision: 418437
feature.fiendish-resilience:
  effets:
    - "Sans coût d’action, une fois par repos court : résistance à un type de dégâts au choix, parmi les 13 du jeu."
    - "Une seule résistance de cette source à la fois ; elle persiste après les repos, jusqu’à ce qu’un autre type soit choisi."
  revision: 418448
feature.fire-breath-cone:
  effets:
    - "Action, une fois par repos court : cône de 5 m ; chaque créature prise dedans fait un jet de sauvegarde de Dextérité et subit 2d6 dégâts de feu, la moitié en cas de réussite."
    - "DD : 8 + modificateur de Constitution + bonus de maîtrise."
    - "Niveau 6 du personnage : 3d6 dégâts de feu ; niveau 11 : 4d6."
  notes:
    - "Ce DD compte comme un DD de sauvegarde des sorts : tout ce qui augmente ce dernier l’augmente aussi."
  revision: 418509
feature.fire-breath-line:
  effets:
    - "Action, une fois par repos court : ligne de 5 m depuis soi ; chaque créature prise dedans fait un jet de sauvegarde de Dextérité et subit 2d6 dégâts de feu, la moitié en cas de réussite."
    - "DD : 8 + modificateur de Constitution + bonus de maîtrise."
    - "Niveau 6 du personnage : 3d6 dégâts de feu ; niveau 11 : 4d6."
  notes:
    - "Ce DD compte comme un DD de sauvegarde des sorts : tout ce qui augmente ce dernier l’augmente aussi."
  revision: 418511
feature.fist-of-four-thunders:
  effets:
    - "Action, 2 points de ki : cube de 5 m ; chaque créature prise dedans fait un jet de sauvegarde de Constitution (DD de sauvegarde des sorts) ; en cas d’échec, 2d8 dégâts de tonnerre et poussée de 8 m."
    - "Réussite : moitié des dégâts, sans poussée. Les objets de la zone sont repoussés aussi."
    - "Niveau 9, avec Incantation élémentaire améliorée : 3d8 dégâts de tonnerre."
  notes:
    - "N’ouvre pas droit à Arts martiaux : attaque à mains nues supplémentaire."
  revision: 418552
feature.fist-of-unbroken-air:
  effets:
    - "Action, 2 points de ki : une créature à 9 m ou moins fait un jet de sauvegarde de Force (DD de sauvegarde des sorts) ; en cas d’échec, elle subit 3d10 dégâts contondants, est repoussée de 6 m et tombe À terre pendant 1 tour."
    - "Réussite : moitié des dégâts, sans autre effet."
    - "Niveau 9, avec Incantation élémentaire améliorée : 4d10 dégâts contondants."
    - "Utiliser l’aptitude ouvre droit à Arts martiaux : attaque à mains nues supplémentaire."
  revision: 418553
feature.flames-of-the-phoenix:
  effets:
    - "Action, 4 points de ki : boule de feu lancée à distance, qui explose dans un rayon de 4 m ; chaque créature prise dedans fait un jet de sauvegarde de Dextérité (DD de sauvegarde des sorts) et subit 8d6 dégâts de feu, la moitié en cas de réussite."
    - "Utiliser l’aptitude ouvre droit à Arts martiaux : attaque à mains nues supplémentaire."
  revision: 335590
feature.fleet-of-foot:
  effets:
    - "Vitesse de déplacement : +1,5 m."
  revision: 414062
feature.flurry-of-blows:
  effets:
    - "Action bonus, 1 point de ki : deux attaques à mains nues au corps à corps contre une cible ; chacune inflige les dégâts contondants à mains nues."
    - "Pas besoin d’avoir attaqué auparavant dans le tour."
  notes:
    - "Chaque coup profite de tout ce qui améliore les attaques à mains nues ; ne déclenche pas Attaque supplémentaire, faute de coûter une action."
  revision: 418630
feature.flurry-of-blows-push:
  effets:
    - "Action bonus, 1 point de ki : deux attaques à mains nues au corps à corps ; chacune inflige les dégâts contondants à mains nues."
    - "Second coup réussi : jet de sauvegarde de Force de la cible (DD d’action d’arme) ; en cas d’échec, elle est repoussée de 5 m."
  notes:
    - "Si le second coup rate, la cible n’est pas repoussée, même quand le premier a touché."
    - "Chaque coup profite de tout ce qui améliore les attaques à mains nues ; ne déclenche pas Attaque supplémentaire."
  revision: 418631
feature.flurry-of-blows-stagger:
  effets:
    - "Action bonus, 1 point de ki : deux attaques à mains nues au corps à corps ; chacune inflige les dégâts contondants à mains nues."
    - "La cible subit l’état Technique de la Paume : ébranlé pendant 1 tour, sans jet de sauvegarde : elle ne peut plus dépenser de réaction, donc ni attaque d’opportunité ni autre réaction ordinaire."
  notes:
    - "Les réactions qui ne dépensent pas la ressource de réaction restent possibles."
    - "Chaque coup profite de tout ce qui améliore les attaques à mains nues ; ne déclenche pas Attaque supplémentaire."
  revision: 418632
feature.flurry-of-blows-topple:
  effets:
    - "Action bonus, 1 point de ki : deux attaques à mains nues au corps à corps ; chacune inflige les dégâts contondants à mains nues."
    - "Second coup réussi : jet de sauvegarde de Dextérité de la cible (DD d’action d’arme) ; en cas d’échec, elle tombe À terre pendant 1 tour."
  notes:
    - "Si le second coup rate, la cible ne tombe pas, même quand le premier a touché."
    - "Chaque coup profite de tout ce qui améliore les attaques à mains nues ; ne déclenche pas Attaque supplémentaire."
  revision: 439304
feature.flurry-of-moths:
  effets:
    - "Une nuée de phalènes combat aux côtés du personnage."
    - "Une fois par round, après une attaque réussie contre un ennemi, au choix : 1d6 dégâts psychiques supplémentaires ; ou l’ennemi peut subir l’état Aveuglé ; ou le personnage se téléporte jusqu’à 5 m."
    - "Niveau 11, avec Essaim puissant : devient Tourbillon de phalènes puissant (1d8 dégâts psychiques, nuée qui ralentit aussi, téléportation avec +2 à la classe d’armure pendant 1 tour)."
  notes:
    - "Les trois options partagent le même délai : une seule par round."
  revision: 432569
feature.fly-class-action:
  effets:
    - "Vol jusqu’à un point à 18 m ou moins ; la distance volée ne consomme que la moitié autant de déplacement."
  notes:
    - "C’est l’action que donne l’état Vol."
  revision: 418642
feature.fly-starry-form:
  effets:
    - "Sous Forme étoilée : dragon, avec Constellations scintillantes, une fois par tour : vol jusqu’à un point à 6 m ou moins ; la distance volée ne consomme que la moitié autant de déplacement."
  revision: 418640
feature.focused-conjuration:
  effets:
    - "Concentration sur un sort d’invocation : les dégâts subis ne la rompent pas."
  notes:
    - "Concerne par exemple Nuée de dagues, Nuage nauséabond, Toile d’araignée ou Nappe de brouillard."
  revision: 432572
feature.font-of-inspiration:
  effets:
    - "Repos court ou long : toutes les charges d’Inspiration bardique sont rendues."
  revision: 432575
feature.forest-passive-feature:
  effets:
    - "Sorts toujours préparés, hors du nombre de sorts préparés : Peau d’écorce et Immobilisation de personne."
    - "Niveau 5 : Appel de la foudre et Croissance végétale ; niveau 7 : Invocation d’élémentaires mineurs et Liane avide ; niveau 9 : Soins de groupe et Contagion."
  revision: 432578
feature.frenzied-strike:
  effets:
    - "Sous l’état Frénétique, action bonus, une fois par tour : attaque avec l’arme de corps à corps équipée ; dégâts de l’arme."
    - "Chaque utilisation ajoute une charge de Surmenage frénétique : −1 aux jets d’attaque par charge, jusqu’à la fin de la Frénésie."
  notes:
    - "À partir du niveau 9 de barbare, l’attaque n’ajoute plus de Surmenage frénétique."
  revision: 418707
feature.frenzy:
  effets:
    - "En combat, action bonus, 1 charge de Rage : état Frénétique pendant 10 tours."
    - "Frénétique : +2 dégâts avec les armes de corps à corps, les armes improvisées et les objets lancés (+3 au niveau 9) ; résistance aux dégâts contondants, perforants et tranchants ; avantage aux tests et jets de sauvegarde de Force."
    - "Donne Frappe frénétique, Lancer enragé et une attaque avec une arme improvisée par une action bonus."
    - "Pendant la Frénésie : aucun sort, aucune concentration ; elle prend fin si le barbare n’a ni attaqué un ennemi ni subi de dégâts depuis son tour précédent."
  notes:
    - "Avec une armure lourde, l’état Rage bridée supprime le bonus de dégâts, la résistance et l’avantage."
  revision: 418709
feature.frost-breath:
  effets:
    - "Action, une fois par repos court : cône de 5 m ; chaque créature prise dedans fait un jet de sauvegarde de Constitution et subit 2d6 dégâts de froid, la moitié en cas de réussite."
    - "DD : 8 + modificateur de Constitution + bonus de maîtrise."
    - "Niveau 6 du personnage : 3d6 dégâts de froid ; niveau 11 : 4d6."
  notes:
    - "Ce DD compte comme un DD de sauvegarde des sorts : tout ce qui augmente ce dernier l’augmente aussi."
  revision: 391124
feature.fungal-infestation:
  effets:
    - "Réaction, 1 charge d’Infestation fongique : le cadavre d’une bête ou d’un humanoïde à 3 m ou moins se relève en zombi fongique allié, jusqu’au prochain repos long."
    - "4 charges au niveau 6 de druide, rendues par un repos long."
  notes:
    - "Un même cadavre peut resservir."
  revision: 415263
feature.giant-killer:
  effets:
    - "Réaction, quand une créature de taille Grande ou plus, visible et à 1,5 m ou moins, attaque le personnage : attaque au corps à corps contre elle."
  notes:
    - "Beaucoup de grandes créatures attaquent de plus de 2 m : la réaction ne se déclenche alors pas, et une arme à allonge n’y change rien."
  revision: 433035
feature.giants-rage:
  effets:
    - "En combat, action bonus, 1 charge de Rage : état Rage du géant pendant 10 tours ; le barbare grandit d’une catégorie de taille."
    - "Rage du géant : +2 dégâts avec les armes de corps à corps, les armes improvisées et à mains nues, +4 avec les objets lancés (niveau 9 : +3 et +6) ; résistance aux dégâts contondants, perforants et tranchants ; avantage aux tests et jets de sauvegarde de Force."
    - "Pendant la rage : aucun sort, aucune concentration ; elle prend fin si le barbare n’a ni attaqué un ennemi ni subi de dégâts depuis son tour précédent."
  notes:
    - "Avec une armure lourde, l’état Rage bridée supprime le bonus de dégâts, la résistance et l’avantage."
    - "Remplace les autres effets de taille, comme celui d’Agrandissement/Rapetissement."
  revision: 418870
feature.gleamdancer:
  effets:
    - "Dague tenue en main secondaire : +1 à la classe d’armure du porteur."
  revision: 432597
feature.gnome-cunning:
  effets:
    - "Jets de sauvegarde d’Intelligence, de Sagesse et de Charisme : avantage."
  revision: 432600
feature.goading-attack-melee:
  effets:
    - "Action : attaque avec l’arme de corps à corps ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "Puis jet de sauvegarde de Sagesse de la cible (DD d’action d’arme) ; en cas d’échec, état Provoqué pendant 1 tour : désavantage à tous ses jets d’attaque, y compris contre le personnage."
  notes:
    - "Une attaque ratée ne dépense pas de dé de supériorité."
    - "La cible n’est pas réellement forcée d’attaquer le personnage."
  revision: 418995
feature.goading-attack-ranged:
  effets:
    - "Action : attaque avec l’arme à distance ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "Puis jet de sauvegarde de Sagesse de la cible (DD d’action d’arme) ; en cas d’échec, état Provoqué pendant 1 tour : désavantage à tous ses jets d’attaque, y compris contre le personnage."
  notes:
    - "Une attaque ratée ne dépense pas de dé de supériorité."
    - "La cible n’est pas réellement forcée d’attaquer le personnage."
  revision: 418996
feature.gong-of-the-summit:
  effets:
    - "Action, 3 points de ki : point à 18 m ou moins, rayon de 3 m ; chaque créature prise dedans fait un jet de sauvegarde de Constitution (DD de sauvegarde des sorts) et subit 3d8 dégâts de tonnerre, la moitié en cas de réussite."
    - "Les créatures faites de matière inorganique, comme la pierre, ont le désavantage à ce jet ; les objets de la zone subissent aussi les dégâts."
    - "Niveau 9, avec Incantation élémentaire améliorée : 4d8 dégâts de tonnerre."
    - "Utiliser l’aptitude ouvre droit à Arts martiaux : attaque à mains nues supplémentaire."
  notes:
    - "Inutilisable sous l’état Réduit au silence, contrairement aux autres actions élémentaires du moine."
  revision: 371824
feature.grassland:
  effets:
    - "Sorts toujours préparés, hors du nombre de sorts préparés : Invisibilité et Passage sans trace."
    - "Niveau 5 : Lumière du jour et Hâte ; niveau 7 : Liberté de mouvement et Métamorphose ; niveau 9 : Restauration supérieure et Fléau d’insectes."
  revision: 432606
feature.great-weapon-fighting:
  effets:
    - "Attaque avec une arme de corps à corps à deux mains : chaque dé de dégâts qui donne 1 ou 2 est relancé une fois."
  notes:
    - "Vaut aussi pour une arme polyvalente tenue à deux mains, la main secondaire libre."
    - "Les dés de dégâts ajoutés à l’attaque sont relancés aussi : dé de supériorité, Châtiment divin, arme trempée dans une surface."
  revision: 432608
feature.great-weapon-master-all-in:
  effets:
    - "Passif activable. Attaque avec une arme de corps à corps maîtrisée, tenue à deux mains : −5 au jet d’attaque, +10 aux dégâts."
  notes:
    - "S’applique aussi aux actions d’arme à 1d4 dégâts fixes, sans que leur infobulle l’affiche."
  revision: 438972
feature.great-weapon-master-bonus-attack:
  effets:
    - "Coup critique ou créature tuée avec une attaque d’arme de corps à corps : pendant ce tour, une nouvelle attaque d’arme de corps à corps est possible par une action bonus (état du même nom, 1 tour)."
  notes:
    - "Toute arme de corps à corps convient, et l’autre passif du même don, celui qui échange −5 au jet d’attaque contre +10 aux dégâts, n’a pas besoin d’être actif."
    - "Une créature mise hors de combat par des dégâts non létaux, ou réduite à 0 point de vie sans mourir grâce à Protection contre la mort, compte aussi."
    - "Peut se déclencher plusieurs fois par tour, mais pas par l’attaque supplémentaire elle-même ; l’attaque qui ouvre le combat ne la donne pas."
  revision: 438971
feature.grim-harvest:
  effets:
    - "Une fois par tour, créature tuée par un sort : le magicien récupère 2 fois le niveau de l’emplacement de sort utilisé en points de vie, 3 fois pour un sort de nécromancie."
  notes:
    - "Les emplacements de Magie de pacte comptent aussi ; les morts-vivants et les artificiels tués déclenchent aussi l’effet."
  revision: 432616
feature.guided-strike:
  effets:
    - "1 charge de Conduit divin, après un jet d’attaque : +10 à ce jet, qui peut ainsi toucher."
    - "Ou, comme action, 1 charge de Conduit divin : +10 au prochain jet d’attaque (état Frappe guidée : active, jusqu’au prochain repos long)."
  revision: 425397
feature.halfling-luck:
  effets:
    - "Résultat de 1 au dé d’un jet d’attaque, d’un test de caractéristique ou d’un jet de sauvegarde : le dé est relancé une fois, et le nouveau résultat s’impose."
  notes:
    - "Le nouveau résultat peut être un autre 1."
    - "Avec l’avantage, chaque dé qui donne 1 est relancé ; le meilleur résultat est gardé."
  revision: 437818
feature.halo-of-spores:
  effets:
    - "En dépensant sa réaction : une créature à 6 m ou moins fait un jet de sauvegarde de Constitution (DD de sauvegarde des sorts) ; en cas d’échec, elle subit 1d4 dégâts nécrotiques."
    - "Niveau 6 de druide : 1d6 dégâts nécrotiques ; niveau 10 : 1d8."
  notes:
    - "La réaction dépensée n’est plus disponible pour autre chose jusqu’au tour suivant."
  revision: 419275
feature.harmony-of-fire-and-water:
  effets:
    - "Action, hors combat, une fois par repos long : récupère la moitié de son maximum de points de ki, arrondie à l’inférieur."
  revision: 419328
feature.healing-radiance:
  effets:
    - "Action bonus, 1 charge de Conduit de serment : le paladin et ses alliés dans un rayon de 3 m récupèrent bonus de maîtrise + niveau de paladin + modificateur de Charisme points de vie."
    - "Au tour suivant, ils récupèrent de nouveau la même quantité (état Rayonnement guérisseur, 1 tour)."
    - "Sans effet sur les morts-vivants et les artificiels."
  revision: 419396
feature.heart-of-the-storm:
  effets:
    - "Sort de niveau 1 ou plus qui inflige des dégâts de foudre ou de tonnerre : chaque ennemi dans un rayon de 6 m subit autant de dégâts du même type que la moitié du niveau d’ensorceleur, arrondie à l’inférieur."
  notes:
    - "Se déclenche aussi avec un sort mineur de ce type et avec quelques sorts du bon type qui n’infligent pas de dégâts ; pas avec des dégâts de foudre ou de tonnerre venus d’un autre effet, comme les Charges de foudre."
  revision: 432627
feature.heart-of-the-storm-lightning:
  effets:
    - "Déclenché sans coût par un sort de foudre : chaque ennemi dans un rayon de 6 m subit des dégâts de foudre égaux à la moitié du niveau d’ensorceleur, arrondie à l’inférieur."
  notes:
    - "Sorts qui le déclenchent : Appel de la foudre, Chaîne d’éclairs, Orbe chromatique (foudre), Éclair, Poigne électrique, Trait ensorcelé, quelques autres ; pas les dégâts de foudre venus d’un effet comme les Charges de foudre."
  revision: 419409
feature.heart-of-the-storm-resistance:
  effets:
    - "Résistance aux dégâts de foudre et de tonnerre."
  revision: 432628
feature.heart-of-the-storm-thunder:
  effets:
    - "Déclenché sans coût par un sort de tonnerre : chaque ennemi dans un rayon de 6 m subit des dégâts de tonnerre égaux à la moitié du niveau d’ensorceleur, arrondie à l’inférieur."
  notes:
    - "Sorts qui le déclenchent : Orbe chromatique (tonnerre), Fracassement, Châtiment tonitruant, Vague tonnante, quelques autres ; pas Vague destructrice ni les dégâts de tonnerre venus d’un autre effet."
  revision: 419411
feature.heavily-armoured:
  effets:
    - "Maîtrise des armures lourdes."
    - "Force +1, jusqu’à 20 au maximum."
  notes:
    - "L’augmentation est perdue si des bonus non plafonnés portent déjà la Force à 20 ou plus ; elle s’applique aussi sous Forme sauvage."
  revision: 438997
feature.heavy-armour-master:
  effets:
    - "Force +1, jusqu’à 20 au maximum."
    - "Armure lourde portée sur le corps : les dégâts contondants, perforants et tranchants subis sont réduits de 3, qu’ils soient magiques ou non."
  notes:
    - "Un casque ou une autre pièce classée armure lourde ne suffit pas : il faut une armure de corps lourde."
    - "L’augmentation de Force est perdue si des bonus non plafonnés la portent déjà à 20 ou plus ; elle s’applique aussi sous Forme sauvage."
  revision: 438871
feature.hellish-resistance:
  effets:
    - "Résistance aux dégâts de feu."
  revision: 432638
feature.hex-warrior:
  effets:
    - "Maîtrise des armures intermédiaires, des boucliers et des armes de guerre."
    - "Donne Lier une arme maléfique : pour attaquer avec l’arme liée, le modificateur de Charisme remplace celui de Force ou de Dextérité."
  notes:
    - "Le Charisme s’applique même s’il est plus faible que la Force ou la Dextérité."
  revision: 432642
feature.hexblades-curse:
  effets:
    - "Action bonus, une fois par repos court : une créature à 18 m ou moins subit l’état Malédiction de la lame maléfique pendant 10 tours."
    - "Contre elle : bonus de maîtrise ajouté aux jets de dégâts, et coup critique sur un résultat de 19 ou 20."
    - "Si elle meurt : l’occultiste récupère niveau d’occultiste + modificateur de Charisme points de vie."
  revision: 429840
feature.hide-in-plain-sight:
  effets:
    - "Action, hors combat : état Camouflage jusqu’au prochain repos long ; invisible et +10 aux tests de Dextérité (Discrétion), tant que le rôdeur reste immobile."
    - "L’invisibilité cesse si le rôdeur se déplace, attaque, lance un sort, accomplit une action ou subit des dégâts."
  notes:
    - "Sauter ou voler ne la rompt pas, ni les autres actions discrètes de ce genre : on peut ainsi se déplacer sans la perdre."
  revision: 419509
feature.holy-rebuke:
  effets:
    - "Action, 1 charge de Conduit de serment : une créature à 18 m ou moins obtient l’état Représailles sacrées pendant 2 tours ; toute créature qui la touche au corps à corps subit 1d4 dégâts radiants."
  revision: 419558
feature.horde-breaker:
  effets:
    - "Donne les actions Briseur de hordes (corps à corps) et Briseur de hordes (à distance)."
  revision: 432649
feature.horde-breaker-melee:
  effets:
    - "Action, une fois par tour : attaque avec l’arme de corps à corps ; dégâts de l’arme."
    - "Touchée ou non, chaque créature à 2 m ou moins de la cible subit l’état Briseur de hordes (1 tour) ; une attaque de suivi gratuite, au corps à corps ou à distance, est alors possible contre l’une d’elles."
  notes:
    - "Déclenche Attaque supplémentaire."
    - "Certains effets prévus pour la première cible peuvent s’appliquer à une autre créature de la zone, et certains effets sans dégâts se déclenchent sur toutes les créatures de la zone."
  revision: 426888
feature.horde-breaker-ranged:
  effets:
    - "Action, une fois par tour : attaque avec l’arme à distance ; dégâts de l’arme."
    - "Touchée ou non, chaque créature à 2 m ou moins de la cible subit l’état Briseur de hordes (1 tour) ; une attaque de suivi gratuite, au corps à corps ou à distance, est alors possible contre l’une d’elles."
  notes:
    - "Déclenche Attaque supplémentaire."
  revision: 426844
feature.hound-of-ill-omen:
  effets:
    - "Action bonus, 3 points de sorcellerie, une fois par repos court : invoque un molosse des ombres à 18 m ou moins, qui reste sans limite de durée."
  notes:
    - "Le molosse voit dans les ténèbres magiques : il attaque avec l’avantage dans les nuages de Ténèbres du personnage."
  revision: 419601
feature.human-versatility:
  effets:
    - "Maîtrise d’une compétence supplémentaire, au choix."
    - "Capacité de charge augmentée d’un quart."
  revision: 432651
feature.hypnotic-gaze:
  effets:
    - "Action, une fois par repos long : une créature au contact fait un jet de sauvegarde de Sagesse (DD de sauvegarde des sorts) ; en cas d’échec, état Regard hypnotique pendant 2 tours : charmée et neutralisée, elle ne peut ni agir ni attaquer le magicien."
    - "Chaque tour, une action de maintien prolonge l’état, sans nouveau jet de sauvegarde."
    - "L’état prend fin si la créature subit des dégâts."
  notes:
    - "Ce n’est pas un sort : Enchantement partagé ne s’y applique pas."
  revision: 419638
feature.illusory-self:
  effets:
    - "Réaction, une fois par repos court, quand une attaque vise le magicien : l’attaque échoue."
  notes:
    - "Inutilisable sous Forme étoilée ou sous l’effet de Déguisement."
  revision: 432662
feature.improved-abjuration:
  effets:
    - "Chaque repos court : l’intensité de Protection arcanique augmente du niveau de magicien."
  revision: 432668
feature.improved-bardic-inspiration-passive-feature:
  effets:
    - "Inspiration bardique : le dé passe à 1d8 au niveau 5 de barde, à 1d10 au niveau 10."
  revision: 432669
feature.improved-combat-superiority:
  effets:
    - "Les dés de supériorité passent à 1d10."
  revision: 432674
feature.improved-critical-hit:
  effets:
    - "Jets d’attaque : coup critique sur un résultat de 19 ou 20 ; se cumule avec les autres réductions du seuil de critique."
  revision: 432678
feature.improved-divine-smite:
  effets:
    - "Attaque avec une arme de corps à corps : 1d8 dégâts radiants supplémentaires."
  notes:
    - "Se cumule avec toutes les autres sources de dégâts, dont Châtiment divin."
  revision: 432679
feature.improved-elemental-casting:
  effets:
    - "Un dé de dégâts de plus : Froid de la montagne 2d10, Poing des quatre tonnerres 3d8, Poing de l’air ininterrompu 4d10, Gong du sommet 4d8, Frappe de braises balayante 4d6, Toucher de la tempête 2d10, Fouet d’eau 4d10."
    - "Poigne du vent du nord retient une créature de plus ; Étreinte du brasier tire un rayon de plus."
  revision: 432680
feature.improved-extra-attack:
  effets:
    - "Après une attaque qui coûte une action : deux attaques supplémentaires au lieu d’une, sans coût d’action."
  notes:
    - "Pas besoin d’arme : une attaque à mains nues ou de lancer la déclenche aussi, comme Attaque supplémentaire."
  revision: 432681
feature.improved-minor-illusion-passive-feature:
  effets:
    - "Illusion mineure se lance par une action bonus (Illusion mineure améliorée)."
  revision: 432682
feature.improved-warding-flare:
  effets:
    - "Réaction, quand un ennemi attaque un allié : désavantage à ce jet d’attaque."
  notes:
    - "Sans effet sur les créatures qui ne peuvent pas être aveuglées."
  revision: 425401
feature.improved-wild-strike:
  effets:
    - "Sous une Forme sauvage animale, après une attaque : deux attaques supplémentaires au lieu d’une."
  notes:
    - "Vaut pour toute action d’attaque avec jet d’attaque des formes sauvages, sauf sous Forme étoilée."
  revision: 432684
feature.inciting-howl:
  effets:
    - "Sous Rage : cœur de loup, action : chaque allié dans un rayon de 9 m peut se déplacer de 3 m de plus pendant son prochain tour (état Hurlement galvanisant, 1 tour)."
  revision: 419725
feature.indomitable:
  effets:
    - "Une fois par repos long, jet de sauvegarde raté : le jet est relancé et le nouveau résultat s’impose ; ne consomme pas la réaction."
  notes:
    - "Inutilisable sous Forme étoilée ou sous l’effet de Déguisement."
  revision: 432687
feature.inescapable-destruction:
  effets:
    - "Les dégâts nécrotiques infligés par le clerc ignorent la résistance aux dégâts nécrotiques, quelle qu’en soit la source, sorts ou non."
  revision: 432688
feature.infiltration-expertise:
  effets:
    - "Action : le roublard prend l’apparence d’un humanoïde de la race et du sexe choisis, au visage tiré au hasard, jusqu’au prochain repos long (état Expertise en infiltration)."
  notes:
    - "Effet proche du sort Déguisement."
  revision: 419764
feature.inquisitors-might:
  effets:
    - "Action bonus, 1 charge de Conduit de serment : le paladin ou un allié à 9 m ou moins obtient l’état Puissance de l’inquisiteur pendant 2 tours."
    - "Puissance de l’inquisiteur : ses attaques d’arme infligent des dégâts radiants supplémentaires égaux au modificateur de Charisme du paladin (minimum 1), et la cible touchée subit l’état Hébété pendant 1 tour, sans jet de sauvegarde."
  revision: 419782
feature.instinctive-charm:
  effets:
    - "Réaction, quand un ennemi vise le magicien d’un jet d’attaque (arme, sort ou mains nues) : l’ennemi fait un jet de sauvegarde de Sagesse (DD de sauvegarde des sorts)."
    - "Échec : l’attaque est annulée, ressources dépensées comprises ; l’ennemi subit l’état Charmé pendant 1 tour et reçoit une attaque gratuite, qu’il ne peut pas diriger contre le magicien."
    - "Réussite : l’attaque a lieu, et l’ennemi devient insensible à ce charme."
  notes:
    - "En combat, l’ennemi a toujours l’avantage à ce jet de sauvegarde."
    - "L’insensibilité ne disparaît pas après un repos long : elle reste acquise pour toute la partie."
  revision: 432711
feature.intimidating-presence:
  effets:
    - "Action : un ennemi à 9 m ou moins fait un jet de sauvegarde de Sagesse (DD de sauvegarde des sorts) ; en cas d’échec, état Apeuré pendant 2 tours : désavantage aux tests de caractéristique et aux jets d’attaque, il doit fuir et ne peut pas agir autrement."
    - "Chaque tour, une action de maintien prolonge l’état, sans nouveau jet de sauvegarde."
    - "Une cible qui réussit son jet ne peut plus être visée avant son prochain repos long."
  notes:
    - "Les effets qui donnent l’avantage ou le désavantage aux sauvegardes contre la peur ne jouent pas sur ce jet."
  revision: 439321
feature.intoxicating-strike:
  effets:
    - "Action, 1 point de ki : attaque à mains nues au corps à corps ; dégâts contondants à mains nues."
    - "Si elle touche : jet de sauvegarde de Constitution de la cible (DD de sauvegarde des sorts) ; en cas d’échec, état Ivre pendant 5 tours : désavantage aux tests de Dextérité et de Charisme."
  revision: 419825
feature.intoxicating-strike-bonus-action:
  effets:
    - "Action bonus, 1 point de ki : attaque à mains nues au corps à corps ; dégâts contondants à mains nues."
    - "Si elle touche : jet de sauvegarde de Constitution de la cible (DD de sauvegarde des sorts) ; en cas d’échec, état Ivre pendant 5 tours : désavantage aux tests de Dextérité et de Charisme."
  revision: 432023
feature.inured-to-undeath:
  effets:
    - "Résistance aux dégâts nécrotiques."
    - "Le maximum de points de vie ne peut pas être réduit : les états qui le réduisent, comme Contamination, sont sans effet."
  revision: 434056
feature.invoke-duplicity:
  effets:
    - "Action, 1 charge de Conduit divin, concentration, 10 tours : crée une illusion du clerc à 9 m ou moins."
    - "Le clerc et ses alliés ont l’avantage aux jets d’attaque quand l’attaquant et sa cible se trouvent tous deux à 3 m ou moins de l’illusion."
  notes:
    - "Les ennemis peuvent viser l’illusion et gaspiller leurs actions ; tout effet qui la vise, même amical, la dissipe."
  revision: 401921
