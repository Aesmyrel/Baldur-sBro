# Effets rédigés des capacités, lot effets-feature, lignes 0 à 252. Voir docs/LOTS_ECRITURE.md §4.
feature.abjure-enemy:
  effets:
    - "Action, 1 charge de Conduit de serment : un ennemi à 18 m ou moins fait un jet de sauvegarde de Sagesse (DD de sauvegarde des sorts)."
    - "Échec : état Abjuration d’ennemi : effrayé pendant 3 tours ; désavantage aux tests de caractéristique et aux jets d’attaque, aucun déplacement possible."
    - "Réussite : état Abjuration d’ennemi : ralenti pendant 3 tours."
    - "Fiélons et morts-vivants : désavantage à ce jet de sauvegarde."
  revision: 437903
feature.acid-breath:
  effets:
    - "Action, une fois par repos court : ligne de 5 m depuis soi ; chaque créature prise dedans fait un jet de sauvegarde de Dextérité et subit 2d6 dégâts d’acide, la moitié en cas de réussite."
    - "DD : 8 + modificateur de Constitution + bonus de maîtrise."
    - "Niveau 6 du personnage : 3d6 dégâts d’acide ; niveau 11 : 4d6."
  notes:
    - "Ce DD compte comme un DD de sauvegarde des sorts : tout ce qui augmente ce dernier l’augmente aussi."
  revision: 391128
feature.acolyte-of-nature:
  effets:
    - "Un sort mineur au choix, pris dans la liste des sorts de druide."
    - "Maîtrise d’une compétence au choix : Dressage, Nature ou Survie."
  revision: 415768
feature.action-surge:
  effets:
    - "En combat, une fois par repos court, sans coût d’action : une action supplémentaire pour le tour en cours (état Fougue, 1 tour)."
  notes:
    - "Met fin aux états Invisible et Caché."
  revision: 415803
feature.actor:
  effets:
    - "Charisme +1 ; cette augmentation n’est pas plafonnée à 20."
    - "Tests de Charisme (Tromperie) et de Charisme (Représentation) : bonus de maîtrise doublé, même sans maîtrise de la compétence."
  notes:
    - "Ne s’ajoute pas à une expertise déjà acquise dans ces compétences."
  revision: 439273
feature.advanced-unarmoured-movement:
  effets:
    - "Le terrain difficile ne ralentit pas : aucun état de type Terrain difficile ne s’applique."
    - "Sans armure ni bouclier : +6 m à la distance de saut."
  revision: 438401
feature.alert:
  effets:
    - "Initiative : +5."
    - "Immunité à l’état Surpris."
  revision: 438858
feature.arcane-recovery:
  effets:
    - "Action, hors combat : rend un emplacement de sort dépensé, contre autant de charges de Restauration magique que son niveau."
    - "Emplacements accessibles : niveau 1 d’emblée, niveau 2 au niveau 3, niveau 3 au niveau 5, niveau 4 au niveau 7, niveau 5 au niveau 9."
    - "Charges : la moitié du niveau de magicien, arrondie au supérieur ; rendues par un repos long."
  notes:
    - "Aucun emplacement au-delà du niveau 5 ; ne crée pas d’emplacement, ne rend que ceux déjà dépensés."
  revision: 428903
feature.arcane-ward:
  effets:
    - "Sort d’abjuration lancé : l’intensité de Protection arcanique augmente du niveau du sort, jusqu’à 2 fois le niveau de magicien."
    - "Dégâts subis : la protection en bloque autant que son intensité, qui baisse ensuite de 1."
    - "Après un repos long : intensité égale au niveau de magicien."
  notes:
    - "La réduction ne dépasse jamais 20 dégâts, même au-delà de 20 points d’intensité."
    - "Tout sort d’abjuration compte, même lancé depuis un parchemin ou un objet, même s’il échoue ; sauf Bouclier, qui n’apporte rien, et Contresort, qui apporte toujours 3 points, quel que soit son niveau."
  revision: 432073
feature.archery:
  effets:
    - "Jet d’attaque avec une arme à distance : +2."
  revision: 432074
feature.arctic:
  effets:
    - "Sorts toujours préparés, hors du nombre de sorts préparés : Immobilisation de personne et Croissance d’épines."
    - "Niveau 5 : Tempête de neige et Hâte ; niveau 7 : Invocation d’élémentaires mineurs et Tempête de grêle ; niveau 9 : Cône de froid et Contagion."
  revision: 432075
feature.armour-of-hexes:
  effets:
    - "Réaction, attaque d’une créature qu’on a frappée de Malédiction de la lame maléfique : 50 % de chances d’annuler l’attaque."
  revision: 432078
feature.aspect-of-the-beast-bear:
  effets:
    - "Capacité de charge doublée."
    - "Tests de Force : avantage."
  notes:
    - "Équivaut à Force du taureau et ne se cumule pas avec."
  revision: 432083
feature.aspect-of-the-beast-chimpanzee:
  effets:
    - "Résistance aux dégâts de chute."
    - "Provisions de camp lancées sur une créature : jet de sauvegarde de Dextérité (DD 8 + bonus de maîtrise + modificateur de Dextérité) ; en cas d’échec, état Aveuglé pendant 2 tours."
  revision: 432093
feature.aspect-of-the-beast-crocodile:
  effets:
    - "Debout dans une surface d’eau, d’alcool, d’huile, de graisse ou de glace : +3 m de vitesse de déplacement."
    - "Sur la glace : avantage aux jets de sauvegarde pour ne pas glisser."
  notes:
    - "L’avantage ne vaut que contre la glissade, pas contre les autres façons d’être mis À terre."
    - "L’eau électrifiée et les autres surfaces ne comptent pas."
  revision: 432085
feature.aspect-of-the-beast-eagle:
  effets:
    - "Vision dans le noir jusqu’à 12 m."
    - "Tests de Sagesse (Perception) : avantage."
  revision: 432086
feature.aspect-of-the-beast-elk:
  effets:
    - "Donne l’action Aspect de l’élan, sans coût d’action : le personnage et ses alliés dans un rayon de 18 m gagnent 1,5 m de vitesse de déplacement, sans limite de durée."
  revision: 432087
feature.aspect-of-the-beast-honey-badger:
  effets:
    - "Passif activable. Début de tour sous l’état Empoisonné, Effrayé ou Charmé : 55 % de chances d’entrer en Rage sans dépenser de charge de Rage."
  notes:
    - "Seuls ces trois états comptent, pas les autres états de la même famille (Apeuré, Hypnotisé…)."
    - "Un seul jet par tour, quel que soit le nombre d’états subis."
  revision: 432088
feature.aspect-of-the-beast-stallion:
  effets:
    - "Pointe : points de vie temporaires égaux à 2 fois le niveau de barbare (état Aspect de l’étalon)."
  notes:
    - "Tant qu’il en reste, une nouvelle Pointe ne les renouvelle pas : il faut les avoir tous perdus."
    - "La Pointe des Bottes de rapidité ne les accorde pas."
    - "Ils peuvent coexister avec des points de vie temporaires d’une autre source : la plus forte s’applique, les autres rechargent ce qu’elle a perdu."
  revision: 432089
feature.aspect-of-the-beast-tiger:
  effets:
    - "Jet d’attaque contre une cible sous Saignement ou Empoisonné : le modificateur de Force s’ajoute une seconde fois."
    - "Maîtrise de la compétence Survie."
  notes:
    - "Cible à la fois sous Saignement et Empoisonné : le bonus s’applique deux fois."
  revision: 433031
feature.aspect-of-the-beast-wolf:
  effets:
    - "Maîtrise de la compétence Discrétion."
    - "Donne l’action Aspect du loup, sans coût d’action : le personnage et ses alliés dans un rayon de 18 m ajoutent son modificateur de Dextérité à leurs tests de Dextérité (Discrétion), sans limite de durée."
  revision: 433032
feature.aspect-of-the-beast-wolverine:
  effets:
    - "Action ou effet qui cible une créature sous Saignement ou Empoisonné, attaque ou non, réussie ou non : elle subit l’état Estropié pendant 1 tour."
  notes:
    - "Vaut aussi pour le barbare lui-même : s’il saigne ou est empoisonné, une action qu’il dirige sur lui, comme Pointe, l’estropie."
  revision: 432092
feature.assassinate-ambush:
  effets:
    - "Jet d’attaque réussi contre une créature sous l’état Surpris : coup critique."
  revision: 432095
feature.assassinate-initiative:
  effets:
    - "En combat : avantage aux jets d’attaque contre les créatures qui n’ont pas encore joué leur tour."
  revision: 432096
feature.assassins-alacrity:
  effets:
    - "Début du combat, une fois par combat : l’action et l’action bonus sont rendues."
  notes:
    - "Une attaque qui ouvre le combat ne coûte donc rien au premier tour ; la cible n’a pas besoin d’être sous l’état Surpris."
  revision: 432094
feature.astral-knowledge:
  effets:
    - "Action : maîtrise de toutes les compétences d’une caractéristique au choix (Force, Dextérité, Intelligence, Sagesse ou Charisme), jusqu’au prochain repos long."
  revision: 286183
feature.athlete-standing-up:
  effets:
    - "Se relever de l’état À terre ne coûte que 1,5 m de déplacement."
    - "Saut : distance augmentée de 50 %."
  notes:
    - "Avec moins de 3 m de vitesse en début de tour, se relever coûte davantage qu’à un personnage sans cette aptitude."
  revision: 434107
feature.aura-of-courage:
  effets:
    - "Aura à activer, sans limite de durée : le personnage et ses alliés dans un rayon de 3 m ne peuvent subir aucun état de type Effrayé."
    - "L’aura disparaît si le personnage tombe inconscient."
  revision: 416190
feature.aura-of-devotion:
  effets:
    - "Aura à activer, sans limite de durée : le personnage et ses alliés dans un rayon de 3 m ne peuvent subir aucun état de type Charmé."
    - "L’aura disparaît si le personnage tombe inconscient."
  revision: 416191
feature.aura-of-hate:
  effets:
    - "Aura à activer, sans limite de durée : le personnage et les fiélons et morts-vivants dans un rayon de 3 m ajoutent son modificateur de Charisme aux dégâts de leurs attaques avec une arme de corps à corps."
  notes:
    - "Profite à tous les fiélons et morts-vivants proches, ennemis compris."
    - "Chacun inflige ce supplément dans le type de dégâts de sa propre arme."
  revision: 439913
feature.aura-of-protection:
  effets:
    - "Aura à activer, sans limite de durée : le personnage et ses alliés dans un rayon de 3 m ajoutent son modificateur de Charisme à leurs jets de sauvegarde."
    - "L’aura disparaît si le personnage tombe inconscient."
  notes:
    - "Accordée d’office, elle doit être activée une fois ; elle dure ensuite tant que l’aptitude reste disponible."
  revision: 416200
feature.aura-of-warding:
  effets:
    - "Aura à activer, sans limite de durée : le personnage et ses alliés dans un rayon de 3 m ne subissent que la moitié des dégâts des sorts."
  notes:
    - "Ne se cumule pas avec une autre résistance : des dégâts de froid d’un sort, subis par une créature déjà résistante au froid, ne sont divisés que par 2."
  revision: 416201
feature.bardic-inspiration-class-action:
  effets:
    - "Action bonus, 1 charge d’Inspiration bardique : un allié à 18 m ou moins, qui n’a pas déjà l’état Inspiration bardique, ajoute 1d6 à son prochain jet d’attaque, test de caractéristique ou jet de sauvegarde."
    - "L’état dure jusqu’au prochain repos long ; le dé passe à 1d8 au niveau 5 de barde, à 1d10 au niveau 10."
  notes:
    - "Avec le dé de 1d10, un jet d’attaque ne consomme pas l’état : il reste disponible."
    - "Un allié qui a déjà la version à 1d10 peut être visé : l’effet est alors perdu, les deux ne se cumulant pas."
  revision: 416309
feature.bear-heart:
  effets:
    - "Sous l’état Rage : résistance à tous les dégâts sauf psychiques, et accès à Férocité acharnée."
  revision: 432110
feature.beguiling-defences:
  effets:
    - "Immunité à tous les états de type Charmé."
  notes:
    - "Le charme n’est pas renvoyé à son auteur."
  revision: 432114
feature.bend-luck-passive-feature:
  effets:
    - "Réaction, 2 points de sorcellerie, jet d’attaque ou jet de sauvegarde d’un allié : +1d4 au résultat."
    - "Réaction, 2 points de sorcellerie, jet d’attaque ou jet de sauvegarde d’un ennemi : −1d4 au résultat."
  revision: 439262
feature.benign-transposition-teleport:
  effets:
    - "Action, une fois par repos long : téléportation vers un emplacement libre à 9 m ou moins, ou échange de place avec un allié à 9 m ou moins ; cibles de taille Moyenne ou Petite seulement."
    - "Sort d’invocation lancé, hors sort mineur : l’utilisation est rendue."
  notes:
    - "Pas besoin de dépenser un emplacement : un rituel, une relance gratuite ou un sort d’objet suffit."
  revision: 428519
feature.bestial-fury:
  effets:
    - "Tous les compagnons du personnage obtiennent une attaque supplémentaire, comme avec Attaque supplémentaire."
  revision: 432118
feature.bind-hexed-weapon:
  effets:
    - "Action : lie l’arme tenue en main principale ; ses dégâts deviennent magiques, elle ne peut être ni lâchée ni lancée, et le personnage la maîtrise."
    - "Attaque avec cette arme contre une cible non maudite : 20 % de chances (17 ou plus sur 1d20) de lui appliquer Malédiction de la lame maléfique."
    - "Une seule arme de pacte à la fois."
  notes:
    - "Ce jet ne reçoit aucun modificateur, pas même l’avantage ; une attaque ne prolonge pas une malédiction en cours."
    - "L’arme reste liée même quand le personnage s’en éloigne."
  revision: 416456
feature.blade-of-rime:
  effets:
    - "Action, 2 points de ki : attaque de sort à distance contre une cible à 18 m ou moins ; 1d10 dégâts perforants."
    - "Touchée ou non, l’éclat explose : chaque créature dans un rayon de 2 m fait un jet de sauvegarde de Dextérité (DD de sauvegarde des sorts) ou subit 2d6 dégâts de froid ; aucun en cas de réussite."
    - "Laisse une surface de glace de 2 m de rayon pendant 2 tours. Utilisable sous l’état Réduit au silence."
  revision: 416525
feature.bladesong:
  effets:
    - "1 charge de Chant de la lame, sans coût d’action : état Chant de la lame pendant 10 tours ; +2 à la classe d’armure, +3 m de vitesse de déplacement, avantage aux tests de Dextérité (Acrobaties), +2 aux jets de sauvegarde de Constitution."
    - "Niveau 5 de magicien : +3 à la classe d’armure et aux jets de sauvegarde de Constitution ; niveau 9 : +4."
    - "Débloque aussi l’action d’apogée du chant et, en combat, l’accumulation de charges de dégâts et de soins."
    - "Conditions : ni armure intermédiaire ou lourde ni bouclier ; dague, épée longue, rapière, cimeterre, épée courte ou serpe en main principale."
  notes:
    - "Seule la main principale est vérifiée ; avec une arme incompatible en main secondaire, l’état Chant de la lame bridé s’affiche mais le Chant reste actif ; les charges ne s’accumulent pas et l’apogée est impossible."
    - "Activable hors combat, mais les charges ne s’accumulent qu’en combat."
  revision: 416528
feature.blessed-healer:
  effets:
    - "Sort de soins de niveau 1 ou plus lancé sur une autre créature : le personnage récupère 2 + le niveau du sort en points de vie."
  notes:
    - "Vaut aussi pour un sort qui soigne à la fois le lanceur et d’autres créatures ; un sort à plusieurs cibles le soigne une fois par cible soignée."
  revision: 432120
feature.blessing-of-the-trickster:
  effets:
    - "Action, concentration : une autre créature à 1,5 m ou moins obtient l’avantage aux tests de Dextérité (Discrétion) jusqu’au prochain repos long (état Bénédiction du filou)."
    - "Une seule cible à la fois."
  revision: 416544
feature.blessings-of-knowledge:
  effets:
    - "Expertise dans deux compétences au choix parmi Arcanes, Histoire, Nature et Religion : bonus de maîtrise doublé pour les tests qui les utilisent."
  notes:
    - "Fonctionne même sans maîtrise préalable de la compétence."
  revision: 416546
feature.bolstering-magic-boon:
  effets:
    - "Action, une fois par repos long : le personnage ou un allié à portée de corps à corps gagne +1d4 aux jets d’attaque et aux tests de caractéristique pendant 10 tours (état Magie fortifiante : faveur)."
  revision: 439214
feature.bolstering-magic-level-1-spell-slot:
  effets:
    - "Action, une fois par repos long : le personnage ou un allié à portée de corps à corps récupère un emplacement de sort de niveau 1."
  notes:
    - "Une cible qui a des emplacements de niveau 1 ordinaires et de Magie de pacte récupère d’abord un emplacement ordinaire, jamais les deux."
    - "Ne rend aucun emplacement de niveau 1 à un druide."
  revision: 439215
feature.bolstering-magic-level-2-spell-slot:
  effets:
    - "Action, une fois par repos long : le personnage ou un allié à portée de corps à corps récupère un emplacement de sort de niveau 2."
  notes:
    - "Une cible qui a des emplacements de niveau 2 ordinaires et de Magie de pacte récupère d’abord un emplacement ordinaire, jamais les deux."
  revision: 439216
feature.bolstering-magic-level-3-spell-slot:
  effets:
    - "Action, une fois par repos long : le personnage ou un allié à portée de corps à corps récupère un emplacement de sort de niveau 3."
  notes:
    - "Une cible qui a des emplacements de niveau 3 ordinaires et de Magie de pacte récupère d’abord un emplacement ordinaire, jamais les deux."
  revision: 439217
feature.boot-of-the-giants:
  effets:
    - "Action bonus : coup de pied contre une cible au contact, qui inflige les dégâts contondants à mains nues et tente de la repousser par un test opposé de Force (Athlétisme), comme une bousculade."
    - "Chances accrues si le personnage est caché ou invisible."
    - "Poids maximal de la cible : Force × 24, le double d’une bousculade ordinaire (Force × 12)."
  notes:
    - "Tout ce qui augmente les dégâts à mains nues augmente ceux du coup de pied."
    - "Impossible contre une cible trop lourde ou insensible à la bousculade, comme une créature éthérée : pas même de dégâts."
  revision: 416674
feature.brave:
  effets:
    - "Jets de sauvegarde contre l’état Effrayé : avantage."
  revision: 432138
feature.brutal-critical:
  effets:
    - "Coup critique : un dé de dégâts de l’arme supplémentaire, en plus du dé de critique habituel."
  notes:
    - "Seulement pour les attaques au corps à corps avec l’arme en main principale ou à mains nues."
    - "Un seul dé ajouté, même pour une arme à plusieurs dés : 1d6 pour une épée à deux mains (2d6), 1d12 pour une hache à deux mains (1d12)."
  revision: 432145
feature.chalice-healing:
  effets:
    - "Sous Forme étoilée : calice, après un sort de soins, sans coût d’action, une fois par tour : le personnage ou une créature à 9 m ou moins récupère 1d8 + modificateur de caractéristique d’incantation points de vie."
    - "Niveau 10, avec Constellations scintillantes : 2d8 + modificateur."
  notes:
    - "Une utilisation par sort de soins : Mot de guérison, Mot de guérison de groupe, Soins, Soins de groupe, Toucher du vampire (relances comprises), Prière de guérison, Guérison."
    - "Sans effet après Baies nourricières, Gardien de vitalité, Aide, un sort d’objet, un sort qui donne des points de vie temporaires ou un soin qui n’est pas un sort, comme Imposition des mains."
    - "Le modificateur est celui de la dernière classe de lanceur de sorts acquise, pas forcément la Sagesse."
  revision: 434117
feature.champion-challenge:
  effets:
    - "Action bonus, 1 charge de Conduit de serment : chaque ennemi dans un rayon de 9 m fait un jet de sauvegarde de Sagesse (DD de sauvegarde des sorts) ; en cas d’échec, il subit l’état Défi du champion pendant 10 tours."
    - "Défi du champion : désavantage aux jets d’attaque contre toute autre cible que le paladin."
  revision: 416980
feature.channel-divinity-cloak-of-shadows:
  effets:
    - "Action, 1 charge de Conduit divin : état Conduit divin : cape d’ombres pendant 2 tours ; le personnage devient invisible, même en pleine lumière et à la vue de tous."
    - "L’invisibilité cesse plus tôt si le personnage attaque, lance un sort, accomplit une action ou subit des dégâts."
  revision: 416984
feature.charger-shove:
  effets:
    - "Action et action bonus : charge en ligne droite jusqu’à 9 m, puis bousculade du premier ennemi rencontré, par un test opposé de Force (Athlétisme) contre la meilleure valeur passive d’Acrobaties ou d’Athlétisme de la cible."
    - "Distance de poussée selon la Force du personnage et le poids de la cible ; chances accrues s’il est caché ou invisible."
    - "Ne provoque pas d’attaque d’opportunité ; impossible quand le personnage ne peut pas se déplacer."
  revision: 431451
feature.charger-weapon-attack:
  effets:
    - "Action et action bonus : charge en ligne droite jusqu’à 9 m, puis attaque avec une arme de corps à corps contre la première créature rencontrée : dégâts de l’arme + 5 dégâts du type de l’arme."
    - "Ne provoque pas d’attaque d’opportunité."
  notes:
    - "La charge ne s’arrête pas sur la cible et peut la traverser, mais ne blesse qu’une créature ; un allié ou un objet sur la trajectoire peut être touché à sa place."
    - "Compte comme une seule attaque d’arme et profite d’Attaque supplémentaire."
    - "Règles de hauteur : +2 au jet d’attaque en chargeant depuis 2,5 m au-dessus de la cible, −2 depuis 2,5 m en dessous."
  revision: 438928
feature.charm-animals-and-plants:
  effets:
    - "Action, 1 charge de Conduit divin : chaque bête et chaque plante dans un rayon de 9 m fait un jet de sauvegarde de Sagesse (DD de sauvegarde des sorts) ; en cas d’échec, elle subit l’état Charmé (charme des animaux et des plantes) pendant 10 tours."
    - "L’état prend fin plus tôt si le personnage ou un allié blesse la cible."
  notes:
    - "Une créature qui réussit son jet de sauvegarde tient l’action pour hostile."
    - "Certaines plantes sont insensibles au charme."
  revision: 366939
feature.cheeky-tipple:
  effets:
    - "Immunité aux effets négatifs de l’ivresse : tout état d’ivresse est remplacé par Ivre (maître ivre) pendant 5 tours."
    - "Une fois par repos long, en buvant de l’alcool : récupère la moitié de ses points de ki, arrondie à l’inférieur."
  notes:
    - "La récupération est consommée même si aucun point de ki n’avait été dépensé."
  revision: 432167
feature.chill-of-the-mountain:
  effets:
    - "Action, 1 point de ki : attaque de sort à distance ; 1d10 dégâts de froid, et la cible perd 3 m de vitesse de déplacement pendant 1 tour (état Rayon de givre)."
    - "Niveau 9, avec Incantation élémentaire améliorée : 2d10 dégâts de froid."
  revision: 417036
feature.chilling-counter:
  effets:
    - "Créature qui rate une attaque contre le porteur : elle subit l’état Transi pendant 2 tours, sans jet de sauvegarde."
  revision: 432169
feature.clench-of-the-north-wind:
  effets:
    - "Action, 3 points de ki, concentration : un humanoïde ennemi à distance fait un jet de sauvegarde de Sagesse (DD de sauvegarde des sorts) ; en cas d’échec, il subit l’état Immobilisation de personne pendant 10 tours."
    - "Immobilisation de personne : ni déplacement, ni action, ni réaction ; une attaque qui le touche depuis 3 m ou moins est un coup critique."
    - "Niveau 9 : jusqu’à 2 humanoïdes."
  notes:
    - "Au niveau 9, la même cible peut être choisie deux fois : elle fait deux jets initiaux, mais un seul jet réussi suffit ensuite à s’en libérer."
    - "Inutilisable sous l’état Réduit au silence, contrairement aux autres actions élémentaires du moine."
  revision: 374434
feature.cloak-of-shadows:
  effets:
    - "Action, en zone à visibilité réduite ou nulle : état Cape d’ombres pendant 10 tours ; le personnage devient invisible."
    - "L’invisibilité cesse plus tôt si le personnage attaque, lance un sort, accomplit une action, subit des dégâts ou entre dans une zone dégagée."
  notes:
    - "L’effet se perd aussi en passant d’une visibilité réduite à une visibilité nulle, ou l’inverse."
  revision: 417142
feature.cloud-of-jellyfish:
  effets:
    - "Une nuée de méduses combat aux côtés du personnage."
    - "Une fois par round, après une attaque réussie contre un ennemi, au choix : 1d6 dégâts de foudre supplémentaires ; ou l’ennemi peut subir l’état Électrocuté ; ou le personnage se téléporte jusqu’à 5 m."
    - "Niveau 11, avec Essaim puissant : devient Nuage de méduses puissant (1d8 dégâts de foudre, piqûre qui désarme aussi, téléportation avec +2 à la classe d’armure pendant 1 tour)."
  notes:
    - "Les trois options partagent le même délai : une seule par round."
  revision: 432179
feature.coast:
  effets:
    - "Sorts toujours préparés, hors du nombre de sorts préparés : Image miroir et Foulée brumeuse."
    - "Niveau 5 : Tempête de neige et Appel de la foudre ; niveau 7 : Liberté de mouvement et Confusion ; niveau 9 : Invocation d’élémentaire et Restauration supérieure."
  revision: 432180
feature.colossus-slayer:
  effets:
    - "Une fois par tour, attaque avec une arme contre une cible qui n’a plus tous ses points de vie : 1d8 dégâts supplémentaires du type de l’arme."
  revision: 432184
feature.combat-inspiration:
  effets:
    - "Action bonus, 1 charge d’Inspiration bardique : un allié à 18 m ou moins ajoute 1d6 à son prochain jet d’attaque, test de caractéristique, jet de sauvegarde, jet de dégâts d’arme ou à sa classe d’armure (état Inspiration martiale)."
    - "L’état dure jusqu’au prochain repos long ; le dé passe à 1d8 au niveau 5 de barde, à 1d10 au niveau 10."
  revision: 417198
feature.combat-wild-shape:
  effets:
    - "Action bonus, 1 charge de Forme sauvage : prend la forme d’une bête, comme avec Forme sauvage ; 2 transformations par repos court."
    - "Formes exclusives : Forme sauvage : ours au niveau 2, Forme sauvage : corbeau sanguinaire au niveau 4, Forme sauvage : tigre à dents de sabre au niveau 8, les quatre myrmidons (air, terre, feu, eau) au niveau 10."
  notes:
    - "Une forme de myrmidon coûte 2 charges de Forme sauvage."
    - "Beaucoup d’objets, de dons et d’aptitudes de classe ne fonctionnent pas sous Forme sauvage."
  revision: 439089
feature.companions-bond:
  effets:
    - "Compagnons du rôdeur : bonus à la classe d’armure et aux dégâts égal au bonus de maîtrise du compagnon."
    - "Ils gagnent aussi des points de vie, des aptitudes et une nouvelle apparence."
  notes:
    - "C’est le bonus de maîtrise du compagnon qui compte, pas celui du rôdeur : il ne passe à +4 qu’avec la dernière amélioration du compagnon, au niveau 11."
    - "Un compagnon déjà présent au passage du niveau 5 est amélioré aussitôt, sans nouvelle invocation."
  revision: 432186
feature.control-undead:
  effets:
    - "Action, 1 charge de Conduit de serment : un mort-vivant à 6 m ou moins, de niveau inférieur au paladin, fait un jet de sauvegarde de Sagesse (DD de sauvegarde des sorts) ; en cas d’échec, il subit l’état Contrôlé jusqu’au prochain repos long."
    - "Le mort-vivant devient un allié qui attaque l’ennemi le plus proche du paladin, ou le suit s’il n’y en a pas ; il ne se dirige pas directement."
  notes:
    - "Le contrôle est perdu si le paladin tombe à 0 point de vie, et ne revient pas quand il se relève."
  revision: 438263
feature.controlled-chaos:
  effets:
    - "Réaction, quand un ennemi lance un sort : déclenche chez lui une manifestation de magie sauvage, tirée d’une liste surtout néfaste."
  notes:
    - "Aucune limite de portée."
  revision: 439504
feature.cosmic-omen:
  effets:
    - "Après chaque repos long, à 50 % de chances chacun : état Augure cosmique faste ou Augure cosmique néfaste, jusqu’au repos long suivant."
    - "Faste : réaction pour ajouter 1d6 à un jet d’attaque ou de sauvegarde, et sort mineur qui donne +1d6 aux tests de caractéristique d’un allié au contact (concentration, 10 tours)."
    - "Néfaste : réaction pour retrancher 1d6 d’un jet d’attaque ou de sauvegarde."
  revision: 432193
feature.countercharm:
  effets:
    - "Action : pendant 3 tours, le personnage et ses alliés dans un rayon de 9 m ont l’avantage aux jets de sauvegarde contre les états Charmé et Effrayé (état Aura de contre-charme)."
  notes:
    - "La zone est portée par une entité insensible aux dégâts et aux états, que les ennemis prennent parfois pour cible."
  revision: 417335
feature.create-sorcery-points:
  effets:
    - "Action bonus : un emplacement de sort dépensé se change en points de sorcellerie, autant que son niveau (emplacements de niveau 1 à 6)."
  revision: 428901
feature.create-spell-slot:
  effets:
    - "Action bonus : des points de sorcellerie dépensés se changent en un emplacement de sort."
    - "Coût : 2 points pour un emplacement de niveau 1, 3 pour le niveau 2, 5 pour le niveau 3, 6 pour le niveau 4, 7 pour le niveau 5."
  notes:
    - "Aucun emplacement au-delà du niveau 5."
  revision: 428902
feature.crimson-weapon:
  effets:
    - "Attaque avec l’arme tenue en main secondaire : le porteur ajoute son modificateur de caractéristique aux dégâts."
  notes:
    - "Vaut aussi pour une arbalète de poing en main secondaire."
    - "Ne se cumule pas avec une autre source de Combat à deux armes."
  revision: 432198
feature.crossbow-expert-point-blank:
  effets:
    - "Attaque à l’arbalète contre une cible au contact : pas de désavantage au jet d’attaque."
  notes:
    - "Ne sert qu’avec un seul ennemi au contact, celui qu’on vise : dès que deux ennemis ou plus sont au contact, le désavantage revient."
  revision: 434106
feature.crossbow-expert-wounding:
  effets:
    - "Tir perforant : l’état Plaies béantes infligé dure deux fois plus longtemps, soit 4 tours."
  revision: 438303
feature.cunning-action-dash:
  effets:
    - "Action bonus : vitesse de déplacement doublée pour le tour en cours (état Pointe, 1 tour)."
  notes:
    - "Mêmes règles de cumul que l’action Pointe."
  revision: 417432
feature.cunning-action-disengage:
  effets:
    - "Action bonus : pendant le tour en cours, se déplacer ne provoque pas d’attaque d’opportunité (état Désengagement, 1 tour)."
  revision: 417433
feature.cunning-action-hide:
  effets:
    - "Action bonus : le personnage tente de se cacher (état Caché), sur des tests de Dextérité (Discrétion)."
    - "Caché : invisible pour les ennemis tant qu’il n’entre pas dans leur champ de vision ; avantage aux jets d’attaque."
    - "Attaquer ou lancer un sort fait sortir de l’état Caché."
  revision: 365263
feature.curving-shot:
  effets:
    - "Une fois par tour, attaque à distance ratée : action bonus pour relancer la même attaque contre l’ennemi le plus proche de la première cible."
    - "Attaques admises : attaque à distance ordinaire, tirs arcaniques, la plupart des flèches magiques, Tir au jarret, Tir perforant, Tir mobile et quelques attaques à distance de classe."
  notes:
    - "La nouvelle cible ne se choisit pas ; un obstacle entre les deux cibles peut arrêter le projectile."
    - "Exclus : attaques en main secondaire, actions spéciales des autres armes, manœuvres de combat."
    - "Sans effet quand tous les ennemis proches sont neutralisés."
  revision: 432219
feature.cutting-words:
  effets:
    - "Réaction, 1 charge d’Inspiration bardique : une créature subit −1d6 à son jet d’attaque, test de caractéristique ou jet de sauvegarde."
    - "Niveau 5 de barde : −1d8 ; niveau 10 : −1d10."
  notes:
    - "Ne s’applique pas aux jets de dégâts."
    - "Sauf quand l’auteur de l’attaque est lui-même barde, la réaction n’est proposée que si 6 points au plus suffisent à faire échouer le jet, même avec 1d8 ou 1d10."
    - "Utilisable sous l’état Réduit au silence."
  revision: 432220
feature.dampen-elements:
  effets:
    - "Réaction, quand le personnage ou un allié est touché par des dégâts d’acide, de froid, de feu, de foudre ou de tonnerre : résistance à ce type de dégâts, qui divise par 2 les dégâts de l’attaque."
  notes:
    - "Sans effet pour une cible déjà résistante à ce type : les résistances ne se cumulent pas."
  revision: 425373
feature.danger-sense:
  effets:
    - "Jets de sauvegarde de Dextérité, contre les pièges, les sorts, les surfaces ou autre : avantage."
    - "Perdu sous l’état Aveuglé ou quand le personnage est assommé."
  notes:
    - "Les autres états d’aveuglement ou de neutralisation ne l’empêchent pas."
  revision: 438159
feature.dark-ones-blessing:
  effets:
    - "Créature hostile réduite à 0 point de vie : points de vie temporaires égaux au modificateur de Charisme + niveau d’occultiste (état Bénédiction du ténébreux)."
  notes:
    - "Une hausse du niveau ou du Charisme ne compte qu’à la créature suivante."
    - "Remplacés par les points de vie temporaires de toute autre source, même plus faibles."
  revision: 432231
feature.dark-ones-own-luck:
  effets:
    - "Passif activable, une fois par repos court : +1d10 au prochain test de caractéristique."
  revision: 432232
feature.dash:
  effets:
    - "Action : vitesse de déplacement doublée pour le tour en cours (état Pointe, 1 tour)."
  notes:
    - "Plusieurs pointes dans un même tour s’additionnent, chacune ajoutant la vitesse de base : ×3 pour deux, ×4 pour trois ; une quatrième n’apporte plus rien."
  revision: 417553
feature.dazzling-breath:
  effets:
    - "Sous Forme étoilée : dragon, action bonus, une fois par tour : cône de 5 m ; chaque créature prise dedans fait un jet de sauvegarde de Dextérité et subit 2d6 + modificateur de caractéristique d’incantation dégâts radiants, la moitié en cas de réussite."
    - "DD : 8 + modificateur de Constitution + bonus de maîtrise."
    - "Niveau 5 de druide : 3d6 + modificateur ; niveau 10 : 4d6 + modificateur."
  notes:
    - "Ce DD compte comme un DD de sauvegarde des sorts : tout ce qui augmente ce dernier l’augmente aussi."
    - "Le modificateur de dégâts est celui de la dernière classe de lanceur de sorts acquise, pas forcément la Sagesse."
  revision: 417567
feature.deepened-pact:
  effets:
    - "Pacte de la lame : Attaque supplémentaire avec l’arme de pacte."
    - "Pacte de la chaîne : le familier d’Appel de familier gagne lui aussi une attaque supplémentaire."
    - "Pacte du grimoire : Animation des morts, Hâte et Appel de la foudre, chacun une fois par repos long."
  notes:
    - "Avec le Pacte de la lame, l’arme liée par Lier une arme maléfique compte aussi."
    - "Hors du mode Honneur, cette attaque supplémentaire se cumule avec celle d’une autre classe ; en mode Honneur, non."
  revision: 439161
feature.defence:
  effets:
    - "Classe d’armure : +1 tant qu’une armure légère, intermédiaire ou lourde est portée."
  revision: 432254
feature.defensive-duellist:
  effets:
    - "Réaction, attaque au corps à corps reçue avec une arme de finesse maîtrisée en main principale : le bonus de maîtrise est retranché du jet d’attaque de l’adversaire."
  notes:
    - "Proposée seulement quand cela change un coup réussi en échec ; la classe d’armure elle-même ne change pas."
  revision: 438968
feature.deflect-missiles:
  effets:
    - "Réaction, attaque avec une arme à distance subie : dégâts réduits de 1d10 + modificateur de Dextérité + niveau de moine."
    - "Puis 1 point de ki : le projectile est renvoyé à l’attaquant, avec un jet d’attaque à mains nues et les dégâts contondants d’une attaque à mains nues."
  notes:
    - "Seuls les dégâts sont réduits : un état infligé par l’attaque s’applique quand même."
    - "Le renvoi est possible même si les dégâts ne tombent pas à 0."
    - "Contre une attaque à plusieurs projectiles, seul le dernier peut être paré, et aucun ne peut être renvoyé."
  revision: 432259
feature.desert:
  effets:
    - "Sorts toujours préparés, hors du nombre de sorts préparés : Flou et Silence."
    - "Niveau 5 : Protection contre une énergie et Motif hypnotique ; niveau 7 : Flétrissement et Mur de feu ; niveau 9 : Mur de pierre et Fléau d’insectes."
  revision: 432262
feature.destroy-undead:
  effets:
    - "Mort-vivant qui subit l’état Renvoyé par Renvoi des morts-vivants : il subit aussi 4d6 dégâts radiants."
  revision: 432263
feature.destructive-wrath:
  effets:
    - "Réaction, 1 charge de Conduit divin, au lancement d’un sort ou d’une action qui inflige des dégâts de foudre ou de tonnerre : ces dégâts sont maximaux."
  notes:
    - "Proposée avant le jet d’attaque : elle peut être perdue sur une attaque ratée."
    - "Seules certaines actions la déclenchent, dont Appel de la foudre, Éclair, Chaîne d’éclairs, Fracassement, Poigne électrique, Vague tonnante et Châtiment tonitruant ; pas Lame retentissante, Vague destructrice ni une attaque d’arme ordinaire."
    - "Quelques sorts sans dégâts la déclenchent aussi et la gaspillent."
  revision: 432264
feature.dirty-trick-flick-o-the-wrist:
  effets:
    - "Action bonus, arme de finesse en main principale : attaque d’arme au corps à corps contre une créature armée ; dégâts de l’arme."
    - "Si elle touche : jet de sauvegarde de Dextérité de la cible (DD de sauvegarde des sorts, calculé avec le Charisme) ; en cas d’échec, elle lâche son arme (état Arme lâchée !)."
    - "Si elle touche, même quand la cible réussit son jet : état Avantage déloyal pendant 2 tours, soit l’avantage à la prochaine attaque."
  notes:
    - "Ne déclenche pas les effets propres à l’arme quand elle touche."
  revision: 417730
feature.dirty-trick-sand-toss:
  effets:
    - "Action bonus : attaque d’arme au corps à corps ; 1d6 dégâts contondants."
    - "Si elle touche : jet de sauvegarde de Constitution de la cible (DD de sauvegarde des sorts, calculé avec la Dextérité) ; en cas d’échec, état Aveuglé pendant 2 tours."
    - "Donne aussi l’état Avantage déloyal pendant 2 tours, soit l’avantage à la prochaine attaque."
  notes:
    - "Pas besoin d’arme de finesse : le jet d’attaque utilise la caractéristique de l’arme en main principale ; avec une arme à distance en main, la Force."
    - "Ce DD compte comme un DD de sauvegarde des sorts : tout ce qui augmente ce dernier l’augmente aussi."
    - "Déclenche de nombreux effets passifs au contact, mais pas les effets propres à l’arme."
  revision: 417731
feature.disarming-attack-melee:
  effets:
    - "Action : attaque avec l’arme de corps à corps contre une créature armée ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "Puis jet de sauvegarde de Force de la cible (DD d’action d’arme) ; en cas d’échec, elle lâche son arme (état Arme lâchée !)."
  notes:
    - "Une attaque ratée ne dépense pas de dé de supériorité."
  revision: 417735
feature.disarming-attack-ranged:
  effets:
    - "Action : attaque avec l’arme à distance contre une créature armée ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "Puis jet de sauvegarde de Force de la cible (DD d’action d’arme) ; en cas d’échec, elle lâche son arme (état Arme lâchée !)."
  notes:
    - "Une attaque ratée ne dépense pas de dé de supériorité."
  revision: 417736
feature.disciple-of-life:
  effets:
    - "Sort de soins lancé : la cible récupère en plus 2 + le niveau du sort en points de vie."
  revision: 432268
feature.distracting-strike-melee:
  effets:
    - "Action : attaque avec l’arme de corps à corps ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "La cible subit l’état Distrait pendant 1 tour : les alliés du personnage ont l’avantage à leur prochain jet d’attaque contre elle."
  notes:
    - "Une attaque ratée ne dépense pas de dé de supériorité."
    - "Une attaque suivante à plusieurs jets simultanés, comme les rayons d’un même sort, a l’avantage sur chacun."
  revision: 417795
feature.distracting-strike-ranged:
  effets:
    - "Action : attaque avec l’arme à distance ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "La cible subit l’état Distrait pendant 1 tour : les alliés du personnage ont l’avantage à leur prochain jet d’attaque contre elle."
  notes:
    - "Une attaque ratée ne dépense pas de dé de supériorité."
    - "Une attaque suivante à plusieurs jets simultanés, comme les rayons d’un même sort, a l’avantage sur chacun."
  revision: 417796
feature.divine-allegiance:
  effets:
    - "Réaction, quand un allié à 1,5 m ou moins subit des dégâts : il récupère 2 × niveau de paladin points de vie, et le paladin subit 2 × niveau de paladin dégâts radiants."
  notes:
    - "Ces dégâts radiants peuvent être réduits par une résistance ou une réduction des dégâts."
    - "Certains bonus de dégâts du paladin, comme les Charges de foudre, s’ajoutent aux dégâts qu’il s’inflige."
  revision: 432273
feature.divine-health:
  effets:
    - "Immunité aux maladies."
  revision: 432274
feature.divine-intervention:
  effets:
    - "Une seule fois par personnage dans toute la partie : l’une des quatre interventions ci-dessous, au choix, chacune pour une action."
    - "Arme légendaire : crée la Masse d’armes du fidèle, arme légendaire, dans l’inventaire et l’équipe aussitôt."
    - "Ravitaillement : fait apparaître un coffre de provisions de camp, de potions de soins supérieures ou suprêmes et de six ou sept élixirs."
    - "Résurrection : dans un rayon de 18 m, les compagnons morts reviennent à la vie avec la moitié de leurs points de vie, et tous les alliés sont rétablis comme après un repos long."
    - "Cataclysme radiant : chaque ennemi dans un rayon de 15 m fait un jet de sauvegarde de Sagesse et subit 8d10 dégâts radiants, la moitié en cas de réussite."
  notes:
    - "Changer de classe ne permet pas de l’utiliser une seconde fois avec le même personnage."
    - "La résurrection rend des points de vie calculés sur le maximum du clerc, et ne recharge pas toutes les ressources d’un repos long (Inflexible ou Présage, par exemple)."
  revision: 382846
feature.divine-sense:
  effets:
    - "Action bonus, une fois par repos court : avantage aux jets d’attaque contre les célestes, les fiélons et les morts-vivants pendant 2 tours (état Perception divine)."
  revision: 417814
feature.divine-smite:
  effets:
    - "Action : attaque avec une arme de corps à corps ; si elle touche, dépense 1 emplacement de sort de niveau 1 : dégâts de l’arme + 2d8 dégâts radiants, + 1d8 dégâts radiants contre un fiélon ou un mort-vivant."
    - "Emplacement de niveau supérieur : + 1d8 dégâts radiants par niveau au-delà du 1er, jusqu’à 5d8 avec un emplacement de niveau 4 ; au-delà, rien de plus."
  notes:
    - "L’emplacement n’est dépensé qu’en cas de coup réussi."
  revision: 426307
feature.divine-strike-elemental-fury:
  effets:
    - "Action, une fois par tour : attaque avec l’arme, au corps à corps ou à distance ; dégâts de l’arme + 1d8 dégâts de froid, de feu ou de foudre, au choix."
    - "Se déclenche aussi après une attaque d’arme réussie, sans dépenser de réaction."
  revision: 417823
feature.divine-strike-necrotic:
  effets:
    - "Action, une fois par tour : attaque avec l’arme, au corps à corps ou à distance ; dégâts de l’arme + 1d8 dégâts nécrotiques."
    - "Se déclenche aussi après une attaque d’arme réussie, sans dépenser de réaction."
  revision: 425382
feature.divine-strike-poison:
  effets:
    - "Action, une fois par tour : attaque avec l’arme, au corps à corps ou à distance ; dégâts de l’arme + 1d8 dégâts de poison."
    - "Se déclenche aussi après une attaque d’arme réussie, sans dépenser de réaction."
  revision: 425384
feature.divine-strike-radiant:
  effets:
    - "Action, une fois par tour : attaque avec l’arme, au corps à corps ou à distance ; dégâts de l’arme + 1d8 dégâts radiants."
    - "Se déclenche aussi après une attaque d’arme réussie, sans dépenser de réaction."
  revision: 425385
feature.divine-strike-thunder:
  effets:
    - "Action, une fois par tour : attaque avec l’arme, au corps à corps ou à distance ; dégâts de l’arme + 1d8 dégâts de tonnerre."
    - "Se déclenche aussi après une attaque d’arme réussie, sans dépenser de réaction."
  revision: 425386
feature.divine-strike-weapon:
  effets:
    - "Action, une fois par tour : attaque avec l’arme, au corps à corps ou à distance ; dégâts de l’arme + 1d8 dégâts du type de l’arme."
    - "Se déclenche aussi après une attaque d’arme réussie, sans dépenser de réaction."
  notes:
    - "Le type des dégâts supplémentaires est toujours celui de l’arme en main principale, même quand l’attaque part de la main secondaire."
  revision: 439186
feature.diving-strike:
  effets:
    - "Sous Rage : cœur d’aigle, action : saut sur une créature située au moins 1,5 m plus bas, avec une attaque d’arme au corps à corps ; si elle touche, dégâts de l’arme et état À terre pendant 2 tours."
    - "Le barbare ne subit pas de dégâts de chute."
  notes:
    - "Tout ce qui allonge les sauts allonge sa portée ; compte comme un saut pour les aptitudes qui en dépendent."
