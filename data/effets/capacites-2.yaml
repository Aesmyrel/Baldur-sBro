feature.malefic-funghi:
  effets:
    - "Tant que l’objet est porté : +1 au DD de sauvegarde des sorts."
    - "Dégâts nécrotiques infligés : 1 dégât nécrotique supplémentaire."
  notes:
    - "Le bonus de dégâts ne s’ajoute qu’une fois, quel que soit le nombre de sources de dégâts nécrotiques de l’attaque."
