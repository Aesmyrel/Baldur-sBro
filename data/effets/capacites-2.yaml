    - "Ennemi tué par le porteur : les alliés à 9 m ou moins gagnent des points de vie temporaires égaux à leur modificateur de Charisme (minimum 1)."
  revision: 433292
feature.strange-conduit:
  effets:
    - "Pendant une concentration : les attaques avec une arme (corps à corps, distance ou lancer) infligent 1d4 dégâts psychiques supplémentaires."
  notes:
    - "Pas les attaques à mains nues."
  revision: 433296
feature.strider-movement:
  effets:
    - "Tant que l’objet est porté : état Grande foulée en permanence."
  revision: 433301
feature.stun-immunity:
  effets:
    - "Le porteur ne peut pas subir l’état Étourdi."
  revision: 433304
feature.subtle-swap:
  effets:
    - "Attaque de lancer : +1 au jet d’attaque."
    - "Arme lancée qui inflige des dégâts : la cible fait un jet de sauvegarde de Dextérité (DD 13) ; en cas d’échec, elle et le porteur échangent leurs positions."
  notes:
    - "L’échange ne vaut pas pour les potions ou poisons lancés."
  revision: 433306
feature.sunwalkers-gift-passive-feature:
  effets:
    - "Tant que l’objet est porté : vision dans le noir jusqu’à 12 m."
  revision: 433311
feature.superior-material-1:
  effets:
    - "Dégâts tranchants subis : réduits de 1."
  revision: 433313
feature.superior-material-2:
  effets:
    - "Dégâts tranchants subis : réduits de 2."
  revision: 433314
feature.superior-padding-1:
  effets:
    - "Dégâts contondants subis : réduits de 1."
  revision: 433315
feature.superior-padding-2:
  effets:
    - "Dégâts contondants subis : réduits de 2."
  revision: 433316
feature.superior-plate-1:
  effets:
    - "Dégâts perforants subis : réduits de 1."
  revision: 433317
feature.superior-plate-2:
  effets:
    - "Dégâts perforants subis : réduits de 2."
  revision: 433318
feature.surge-accuracy:
  effets:
    - "Utilisation de Fougue : +1d4 aux jets d’attaque jusqu’à la fin du tour (état Sursaut de précision)."
  revision: 433320
feature.swathed-in-shadow:
  effets:
    - "Porteur dissimulé par l’ombre et attaqué : +1 aux jets de sauvegarde."
  revision: 433322
feature.swift-strides:
  effets:
    - "En combat, action Pointe ou action semblable : le porteur obtient l’état Élan pendant 3 tours."
  notes:
    - "Les versions de Pointe accordées par une aptitude de classe la déclenchent aussi."
  revision: 433324
feature.sword-mastery:
  effets:
    - "Tant que l’objet est porté : maîtrise des épées courtes, des épées longues et des épées à deux mains."
    - "Jets d’attaque au corps à corps : +1."
  revision: 433325
feature.synergetic-cantrips:
  effets:
    - "Dégâts infligés avec un sort mineur : le porteur obtient l’état Synergie arcanique pendant 2 tours."
    - "Synergie arcanique : les attaques avec une arme infligent des dégâts supplémentaires égaux au modificateur de caractéristique d’incantation."
  notes:
    - "Une fois par attaque."
  revision: 433328
feature.synergetic-moments:
  effets:
    - "Le porteur inflige un état à une cible : il obtient l’état Synergie arcanique pendant 2 tours."
    - "Synergie arcanique : les attaques avec une arme infligent des dégâts supplémentaires égaux au modificateur de caractéristique d’incantation."
  notes:
    - "Une fois par attaque."
  revision: 433329
feature.talk-to-the-sentient-amulet:
  etiquette: { act: acte1, level: leger, otherWorks: aucun }
  effets:
    - "Ouvre une conversation avec la conscience qui habite l’amulette."
  revision: 317034
feature.temperature-adjustment:
  effets:
    - "Tant que l’objet est porté : résistance aux dégâts de feu et de froid."
  revision: 433334
feature.the-comeback:
  effets:
    - "Soin prodigué par le porteur : la créature soignée gagne aussi 3 points de vie temporaires."
  notes:
    - "Un soin de groupe en fait profiter chaque créature soignée ; un repos court n’en fait profiter que le porteur."
    - "Les points de vie temporaires ne se cumulent pas avec ceux d’une autre source."
  revision: 433337
feature.the-pain-maidens-blessing:
  effets:
    - "Attaque réussie avec la dague : +1d4 aux jets d’attaque et aux jets de sauvegarde du porteur jusqu’au début de son prochain tour (état Bénédiction de la Demoiselle de douleur)."
  revision: 433338
feature.the-scourge-mistress-bane:
  effets:
    - "Coup réussi avec l’arme : la cible subit l’état Fléau pendant 2 tours, soit −1d4 aux jets d’attaque et de sauvegarde."
    - "Si le porteur a alors 50 % de ses points de vie ou plus : il subit lui-même 1d6 dégâts perforants."
  notes:
    - "Une fois par attaque ; ne se cumule pas avec le sort Fléau."
    - "Les réductions de dégâts perforants s’appliquent à ces dégâts ; un coup critique les double."
  revision: 433339
feature.the-shadow-itself:
  effets:
    - "Ennemi tué par le porteur : il obtient l’état Invisible pendant 2 tours."
  notes:
    - "Il faut une mise à mort directe en combat ; une mort indirecte (explosion, surface, nuage de dagues) ne compte pas."
  revision: 433950
feature.the-water-caller:
  effets:
    - "Coup réussi avec l’arme : la cible subit l’état Mouillé pendant 3 tours, et une surface d’eau permanente de 2 m de rayon se forme autour d’elle."
  revision: 433342
feature.thermodynamo:
  effets:
    - "Dégâts infligés avec l’arme : le porteur obtient 2 tours de l’état Chaleur."
  notes:
    - "Une fois par attaque, même contre plusieurs cibles."
  revision: 433343
feature.throwing-boost:
  effets:
    - "Attaque de lancer : 1d4 dégâts supplémentaires."
  revision: 433348
feature.throwing-lightning-damage:
  effets:
    - "Arme lancée sur une cible : 1d4 dégâts de foudre supplémentaires, même si l’attaque rate."
  revision: 433349
feature.thunderous-acuity:
  effets:
    - "Dégâts de tonnerre infligés : le porteur obtient l’état Acuité arcanique pendant 2 tours."
  notes:
    - "Une fois par attaque ; les dégâts de tonnerre doivent venir directement du porteur, pas d’un état posé sur la cible."
  revision: 433354
feature.thunderous-conversion:
  effets:
    - "Dégâts de tonnerre, de foudre ou radiants infligés : la cible subit 2 tours de l’état Réverbération."
  notes:
    - "Une fois par attaque ; sans effet avec le sort Rayon de lune."
  revision: 438463
feature.time-thoroughly-bided:
  effets:
    - "Porteur touché par une attaque au corps à corps : il obtient l’état Charge arcanique pendant 2 tours."
  notes:
    - "Un nouveau coup remet la durée à 2 tours, sans cumul."
  revision: 433355
feature.titan-weapon:
  effets:
    - "Attaque avec l’arme : dégâts supplémentaires égaux au modificateur de Force (minimum 1), en plus du modificateur de Dextérité habituel."
  revision: 433357
feature.topple:
  effets:
    - "Attaque au corps à corps réussie : 1d4 dégâts contondants non létaux, puis jet de sauvegarde de Dextérité de la cible (DD d’action d’arme + 2) ; en cas d’échec, elle subit l’état À terre pendant 1 tour."
  notes:
    - "Les effets propres à l’arme en main principale ne se déclenchent pas."
  revision: 377988
feature.topple-the-big-folk:
  effets:
    - "Attaque au corps à corps réussie : dégâts de l’arme + dégâts tranchants égaux au bonus de maîtrise."
    - "Cible de taille Grande ou supérieure : 2d6 dégâts tranchants supplémentaires, puis jet de sauvegarde de Force (DD d’action d’arme + 2) ; en cas d’échec, elle subit l’état À terre pendant 2 tours."
  revision: 433027
feature.treader-by-twilight:
  effets:
    - "Porteur en visibilité réduite ou nulle : +1 à la classe d’armure (état Foulée crépusculaire)."
  revision: 433371
feature.trephination:
  effets:
    - "Attaque au corps à corps réussie : dégâts de l’arme + dégâts perforants égaux au bonus de maîtrise + 1d6 dégâts nécrotiques, puis jet de sauvegarde de Dextérité de la cible (DD d’action d’arme + 2) ; en cas d’échec, elle subit l’état À terre pendant 2 tours."
  notes:
    - "Réservée aux personnages non joueurs : un personnage joueur qui équipe l’arme ne peut pas l’utiliser."
  revision: 374365
feature.troubadours-wonder:
  effets:
    - "Tant que l’objet est porté : +1 à la classe d’armure."
    - "Porteur doté d’Inspiration bardique : 1 utilisation supplémentaire."
  notes:
    - "N’octroie pas Inspiration bardique à qui ne l’a pas déjà."
  revision: 439609
feature.turn-undead:
  effets:
    - "Chaque mort-vivant dans un rayon de 9 m qui voit le lanceur fait un jet de sauvegarde de Sagesse contre son DD de sauvegarde des sorts ; en cas d’échec, il subit l’état Renvoyé pendant 3 tours."
    - "L’état prend fin si la créature subit des dégâts."
  revision: 424422
feature.twist-of-fortune-passive-feature:
  effets:
    - "Dé de dégâts de l’arme qui donne 2 ou moins : il est relancé et le nouveau résultat est conservé."
  notes:
    - "Vaut pour tous les jets de dégâts au corps à corps tant que l’arme est équipée."
  revision: 433375
feature.two-weapon-fighting:
  effets:
    - "Attaque avec l’arme en main secondaire : le modificateur de caractéristique s’ajoute à ses dégâts."
  notes:
    - "Plusieurs sources ne se cumulent pas ; sans intérêt pour les armes lancées, auxquelles le jeu ajoute déjà ce modificateur."
  revision: 433376
feature.tyrant-tongue:
  effets:
    - "Un allié au contact gagne +2 aux tests de Charisme (Intimidation) pendant 10 tours (état Langue de tyran)."
  revision: 414470
feature.umbral-attack:
  effets:
    - "Attaque avec une arme, y compris de lancer : 1d4 dégâts nécrotiques supplémentaires."
  revision: 433377
feature.undead-bane:
  effets:
    - "Jet d’attaque avec l’arme contre un mort-vivant : avantage."
  revision: 433385
feature.undead-ward:
  effets:
    - "Les morts-vivants alliés à 6 m ou moins du porteur ont la résistance aux dégâts contondants, perforants et tranchants (état Aura de protection des morts-vivants)."
  revision: 433390
feature.underdogs-bravery:
  effets:
    - "Attaque au corps à corps avec une arme, quand au moins 2 ennemis se trouvent à 3 m ou moins : avantage."
  notes:
    - "Ne vaut ni pour les attaques à mains nues ni pour les attaques de sort au corps à corps."
  revision: 433392
feature.unflinching-protection:
  effets:
    - "Réaction, une fois par repos long, quand un allié proche est visé par une attaque : cette attaque rate automatiquement."
  notes:
    - "Ne protège pas le porteur lui-même."
  revision: 425435
feature.unshackling-strike:
  effets:
    - "Attaque au corps à corps avec l’arme contre une créature : si elle touche, la créature est libérée des liens magiques qui la maintiennent entravée, paralysée ou étourdie."
  notes:
    - "Un jet d’attaque est nécessaire, même contre un allié : une classe d’armure élevée peut faire échouer la libération."
  revision: 433030
feature.unwavering:
  effets:
    - "Le porteur ignore les effets du terrain difficile."
    - "Il ne peut subir ni l’état Paralysé ni l’état Entravé."
  notes:
    - "Immunise aussi contre Estropié et Jarret tranché ; n’empêche pas de glisser sur la glace ou la graisse."
  revision: 433402
feature.unwavering-bull:
  effets:
    - "Le porteur ne peut pas être poussé contre son gré."
    - "Jet de sauvegarde contre l’état Entravé : avantage."
  notes:
    - "En pratique, cet avantage ne joue que contre certaines sources d’entrave, dont le sort Frappe piégeuse et l’enchevêtrement."
  revision: 433403
feature.veil-of-the-wind:
  effets:
    - "Tant que l’arme est équipée : +3 m à la vitesse de déplacement et à la distance de saut, et immunité aux dégâts de chute."
  revision: 402209
feature.venomous-revenge:
  effets:
    - "Soin reçu par le porteur, même à pleine santé : ses armes sont enduites de poison pendant 3 tours et infligent 1d6 dégâts de poison supplémentaires."
  notes:
    - "Vaut pour les armes de corps à corps et à distance, pas pour les armes lancées ; une arme déjà enduite n’en profite pas, et un nouvel enduit remplace l’effet."
  revision: 433418
feature.virulent-venom:
  effets:
    - "Cible à 9 m ou moins : jet de sauvegarde de Constitution (DD 14) ; en cas d’échec, état Venin virulent pendant 10 tours, et la cible devient vulnérable aux dégâts de poison."
  notes:
    - "Une cible résistante au poison perd sa résistance au lieu de devenir vulnérable ; une cible immunisée n’est pas affectée."
    - "L’action peut viser jusqu’à 3 cibles, ou 3 fois la même."
  revision: 414420
feature.vital-conduit:
  effets:
    - "Lancement d’un sort à concentration : le porteur gagne 8 points de vie temporaires."
  notes:
    - "Les sorts mineurs à concentration la déclenchent aussi ; la plupart des relances gratuites d’un sort déjà en cours, non."
  revision: 433421
feature.voice-of-the-circle:
  effets:
    - "Un allié au contact, ou le porteur lui-même, gagne +2 aux tests de Charisme (Persuasion) pendant 10 tours (état Voix du cercle)."
  revision: 425312
feature.warding-hands:
  effets:
    - "Utilisation d’une aptitude de Conduit de serment : le porteur obtient l’état Héroïsme pendant 10 tours."
  notes:
    - "Les sorts de serment ne la déclenchent pas."
  revision: 433432
feature.watersparks:
  effets:
    - "Début de tour sur une surface d’eau électrifiée : le porteur gagne 3 Charges de foudre."
  revision: 433436
feature.watery-guidance:
  effets:
    - "Attaque avec l’arme contre une créature sous l’état Mouillé : avantage."
  revision: 433438
feature.watery-rejuvenation:
  effets:
    - "En combat, début de tour sur une surface d’eau : le porteur récupère 1d4 points de vie."
  notes:
    - "Les étendues d’eau permanentes et les autres liquides (sang, alcool) ne comptent pas."
  revision: 433439
feature.weakening-strike:
  effets:
    - "Attaque au corps à corps réussie : 1d4 + modificateur de Force ou de Dextérité dégâts non létaux du type de l’arme, puis jet de sauvegarde de Force de la cible (DD d’action d’arme + 2) ; en cas d’échec, elle subit l’état Poigne affaiblie pendant 2 tours."
  notes:
    - "Une créature sans arme ne peut pas subir Poigne affaiblie."
  revision: 374483
feature.weave-eater:
  effets:
    - "Jet de sauvegarde réussi contre un sort : le porteur récupère 1d6 points de vie."
  revision: 433445
feature.well-liked-and-well-fortified:
  effets:
    - "Début du tour du porteur : il gagne des points de vie temporaires égaux à son modificateur de Charisme."
  revision: 433448
feature.whirlwind-attack-weapon-action:
  effets:
    - "Attaque au corps à corps contre chaque ennemi dans un rayon de 2 m, avec un jet d’attaque distinct pour chacun : dégâts de l’arme."
  revision: 439013
feature.winters-clutches-passive-feature:
  effets:
    - "Dégâts de froid infligés : la ou les cibles subissent 2 tours de l’état Couvert de givre."
  revision: 433453
feature.witchbreaker-passive-feature:
  effets:
    - "Jet d’attaque contre une créature qui maintient une concentration : avantage."
  notes:
    - "Vaut pour toutes les attaques du porteur, y compris de sort et à distance."
  revision: 433455
feature.withering-cut:
  effets:
    - "Réaction, coup réussi avec une arme de corps à corps : dégâts nécrotiques supplémentaires égaux au bonus de maîtrise."
  revision: 425439
feature.wound-closure:
  effets:
    - "Porteur réduit à 0 point de vie : il se stabilise automatiquement au début de son tour (état Cicatrisation)."
  revision: 433460
feature.writhing-dance:
  effets:
    - "Porteur à 50 % de ses points de vie ou moins : il ne provoque pas d’attaque d’opportunité."
  notes:
    - "Le seuil n’est vérifié qu’après des dégâts subis ou un soin reçu."
  revision: 433462
feature.xyanydes-fire:
  effets:
    - "Attaque ratée contre une cible : le porteur peut lui infliger l’état Lueurs féeriques pendant 2 tours."
  revision: 433464
feature.yeenoghus-gift:
  effets:
    - "Dégâts infligés à un ennemi par une attaque au corps à corps avec l’arme : le porteur récupère 1d6 points de vie et obtient l’état Don de Yeenoghu pendant 6 tours."
    - "Sous Don de Yeenoghu, fin d’un tour sans avoir blessé d’ennemi ainsi : jet de sauvegarde de Sagesse (DD 10) ou folie ; le porteur attaque alors toute créature proche, alliés compris."
  notes:
    - "Ce soin ne déclenche pas les autres effets liés aux soins ; lancer l’arme ne déclenche rien ; frapper de nouveau ne prolonge pas les 6 tours."
  revision: 438853
feature.zephyr-break:
  effets:
    - "Effet semblable au sort Bourrasque, portée 12 m : 6d6 dégâts de tonnerre ; jet de sauvegarde de Force contre le DD de sauvegarde des sorts du porteur."
    - "En cas d’échec : la cible est repoussée et subit l’état Déséquilibré pendant 2 tours ; en cas de réussite : moitié des dégâts."
  notes:
    - "Utilisable même en Rage."
  revision: 430865
feature.zephyr-connection:
  effets:
    - "Lancée, l’arme revient dans la main du porteur ; il ne peut pas être forcé à la lâcher."
    - "Arme lancée : explosion de 3d4 dégâts de tonnerre dans un rayon de 6 m autour de la cible."
  revision: 431595
feature.zephyr-flash:
  effets:
    - "Ruée en ligne sur 12 m : les créatures sur le trajet font un jet de sauvegarde de Dextérité (DD 15)."
    - "En cas d’échec : 6d8 dégâts de tonnerre et état Saignement pendant 3 tours ; en cas de réussite : moitié des dégâts."
  notes:
    - "La ruée ne provoque pas d’attaque d’opportunité ; une cible touchée est repoussée de 2 m."
  revision: 430867
