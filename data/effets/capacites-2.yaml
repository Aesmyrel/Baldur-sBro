# Effets rédigés des capacités, lot effets-feature, lignes 247 à 493. Voir docs/LOTS_ECRITURE.md §4.
feature.kushigo-counter:
  effets:
    - "Sous l’effet de Patience défensive : quand un ennemi rate une attaque au corps à corps contre le porteur, celui-ci peut jouer sa réaction pour lui porter une attaque à mains nues."
  revision: 432726
feature.kushigos-might:
  effets:
    - "Attaque de lancer ou attaque avec une arme improvisée : 1d4 dégâts supplémentaires."
  revision: 432727
feature.lacerate:
  effets:
    - "Attaque au corps à corps réussie : dégâts de l’arme, puis jet de sauvegarde de Constitution de la cible (DD d’action d’arme + 2) ; en cas d’échec, elle subit l’état Saignement pendant 2 tours."
  notes:
    - "Les morts-vivants et les artificiels ne peuvent pas subir Saignement."
  revision: 373909
feature.last-stand:
  effets:
    - "En combat, début de tour à 50 % de ses points de vie ou moins : le porteur obtient l’état Courroux pendant 1 tour."
  revision: 432733
feature.lay-bare-their-weakness:
  effets:
    - "Dégâts infligés par une attaque à mains nues au corps à corps : le porteur obtient l’état Mis à nu pendant 1 tour, soit +1 à son DD de sauvegarde des sorts."
  notes:
    - "Le bonus reste de +1, même après plusieurs attaques à mains nues dans le même tour."
  revision: 432736
feature.legendary-mobility:
  effets:
    - "Tant que l’objet est porté : le porteur bénéficie en permanence des états Liberté de mouvement et Grande foulée."
  revision: 432775
feature.legendary-persistence:
  effets:
    - "Tant que l’objet est porté : le porteur bénéficie en permanence des états Résistance et Protection contre les armes."
  revision: 432776
feature.lesser-infernal-retribution:
  effets:
    - "Porteur touché au corps à corps par un ennemi à 2 m ou moins : l’attaquant fait un jet de sauvegarde de Dextérité (DD 13) ; en cas d’échec, il subit 1d4 dégâts de feu."
  notes:
    - "Une seule fois par attaque subie."
  revision: 432778
feature.lesser-infernal-touch:
  effets:
    - "Attaque avec une arme : 1d4 dégâts de feu supplémentaires."
    - "Attaque à mains nues : 1d4 dégâts nécrotiques supplémentaires ; la cible fait un jet de sauvegarde de Constitution (DD 13) ou subit l’état Saignement pendant 2 tours."
  revision: 433641
feature.let-the-undead-blanch-with-fear:
  effets:
    - "Jet d’attaque d’un mort-vivant contre le porteur : désavantage."
    - "Jet de sauvegarde du porteur contre une action ou un sort d’un mort-vivant : avantage."
  revision: 432780
feature.lethal-weapon-bludgeoning:
  effets:
    - "Tant que l’arme est équipée : les dégâts contondants du porteur ignorent la résistance aux dégâts contondants."
  notes:
    - "L’immunité aux dégâts contondants, elle, n’est pas ignorée."
  revision: 408639
feature.lethal-weapon-slashing:
  effets:
    - "Tant que l’arme est équipée : ses dégâts tranchants ignorent la résistance aux dégâts tranchants."
  notes:
    - "L’immunité aux dégâts tranchants, elle, n’est pas ignorée."
    - "Profite aussi à une seconde arme tranchante tenue en main secondaire."
  revision: 432782
feature.lickspittles-alertness:
  effets:
    - "Début du combat : le porteur obtient l’état Élan pendant un nombre de tours égal à son modificateur de Charisme."
  notes:
    - "Un personnage qui rejoint un combat déjà en cours n’en profite qu’au round suivant."
  revision: 432785
feature.life-essence-harvest:
  effets:
    - "Créature hostile tuée par un sort du porteur : il obtient l’état Essence vitale jusqu’à son prochain repos long."
    - "Essence vitale : permet de lancer un sort de nécromancie sans dépenser d’emplacement de sort."
  notes:
    - "Sans limite d’utilisation ; un sort lancé grâce à Essence vitale ne rapporte pas de nouvelle charge."
  revision: 432786
feature.life-stealing-critical:
  effets:
    - "Coup critique avec l’arme : la cible subit 10 dégâts nécrotiques supplémentaires, sauf si c’est un artificiel ou un mort-vivant, et le porteur gagne 10 points de vie temporaires."
  notes:
    - "Les points de vie temporaires ne se cumulent pas avec ceux d’une autre source."
  revision: 432788
feature.lifecharger:
  effets:
    - "Gain de Charges de foudre : le porteur gagne aussi 3 points de vie temporaires, qu’il perd dès qu’il n’a plus de Charges de foudre."
  revision: 432789
feature.lightning-aura:
  effets:
    - "Consomme 3 Charges de foudre : les ennemis dans un rayon de 6 m subissent 1d6 dégâts de foudre (jet de sauvegarde de Dextérité, DD 13)."
    - "Pendant 3 tours, l’aura entoure le porteur : un ennemi qui commence son tour à 6 m ou moins subit 1d4 dégâts de foudre et ne peut plus jouer de réaction tant qu’il reste dans l’aura."
  notes:
    - "Seuls les dégâts initiaux autorisent un jet de sauvegarde."
  revision: 429129
feature.lightning-blast:
  effets:
    - "Pendant 2 tours : le prochain sort ou sort mineur du porteur qui inflige des dégâts de foudre gagne autant de dégâts de foudre supplémentaires que le porteur a de Charges de foudre."
    - "Si ce sort touche : toutes les Charges de foudre sont consommées."
  revision: 402574
feature.loving-protection:
  effets:
    - "Dégâts subis alors que le porteur a moins de 50 % de ses points de vie : il gagne 8 points de vie temporaires."
  revision: 432796
feature.lunar-bestial-fortitude:
  effets:
    - "Tant que l’objet est porté : état Protection lunaire, soit +2 à la classe d’armure et avantage aux jets de sauvegarde contre les sorts."
    - "L’effet persiste sous Forme sauvage."
  revision: 432800
feature.lunar-bestial-vitality:
  effets:
    - "Après une Forme sauvage : le porteur gagne 22 points de vie temporaires (état Vitalité lunaire)."
    - "Tant qu’il garde ces points de vie temporaires : tous les dégâts qu’il subit sont réduits de 1."
  revision: 432801
feature.magical-durability-1:
  effets:
    - "Jet de sauvegarde contre un sort : +1."
  revision: 432819
feature.magical-durability-2:
  effets:
    - "Jet de sauvegarde contre un sort : +2."
  revision: 432820
feature.magical-plate-1:
  effets:
    - "Tous les dégâts subis par le porteur sont réduits de 1."
  revision: 432821
feature.magical-plate-2:
  effets:
    - "Tous les dégâts subis par le porteur sont réduits de 2."
  revision: 432822
feature.maiming-strike:
  effets:
    - "Attaque au corps à corps réussie : 1d4 dégâts du type de l’arme + modificateur de Force ou de Dextérité, puis jet de sauvegarde de Constitution de la cible (DD d’action d’arme + 2) ; en cas d’échec, elle subit l’état Estropié pendant 2 tours."
    - "Estropié : vitesse réduite à 0 et désavantage aux jets de sauvegarde de Dextérité ; un soin y met fin."
  notes:
    - "Les créatures volantes ne peuvent pas subir Estropié."
