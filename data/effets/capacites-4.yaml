feature.stillness-of-mind-passive-feature:
  effets:
    - "Sous l’état Charmé ou Effrayé : le moine emploie automatiquement Tranquillité d’esprit, qui met fin à cet état."
  notes:
    - "Ce déclenchement automatique consomme une action et ne peut pas être désactivé."
  revision: 438393
feature.stone-camouflage:
  effets:
    - "Tests de Dextérité (Discrétion) : avantage."
  revision: 433293
feature.storms-fury:
  effets:
    - "Réaction, quand le personnage est touché par une attaque au corps à corps : l’attaquant subit des dégâts de foudre égaux au niveau d’ensorceleur."
    - "Jet de sauvegarde de Force de l’attaquant contre le DD de sauvegarde des sorts : en cas d’échec, il est aussi repoussé de 6 m ; en cas de réussite, il subit tous les dégâts mais n’est pas repoussé."
  revision: 423626
feature.strength-of-the-grave:
  effets:
    - "Une fois par repos long, en tombant à 0 point de vie : l’ensorceleur récupère 1 point de vie au lieu de tomber inconscient."
  revision: 438014
feature.strongheart-resilience:
  effets:
    - "Jets de sauvegarde contre l’état Empoisonné : avantage."
    - "Résistance aux dégâts de poison."
  revision: 433303
feature.stunning-strike-melee:
  effets:
    - "Action : attaque avec l’arme de corps à corps, dégâts de l’arme."
    - "Si elle touche, 1 point de ki : jet de sauvegarde de Constitution de la cible (DD d’action d’arme, soit 8 + bonus de maîtrise + modificateur de Force ou de Dextérité) ; en cas d’échec, état Étourdi pendant 1 tour."
  notes:
    - "Le DD réel est celui d’action d’arme, et non le DD de sauvegarde des sorts fondé sur la Sagesse."
  revision: 423670
feature.stunning-strike-unarmed:
  effets:
    - "Action : attaque à mains nues au corps à corps, dégâts contondants à mains nues."
    - "Si elle touche, 1 point de ki : jet de sauvegarde de Constitution de la cible (DD d’action d’arme, soit 8 + bonus de maîtrise + modificateur de Force ou de Dextérité) ; en cas d’échec, état Étourdi pendant 1 tour."
  notes:
    - "Le DD réel est celui d’action d’arme, et non le DD de sauvegarde des sorts fondé sur la Sagesse."
    - "La portée suit l’arme de corps à corps équipée : 2,5 m avec une arme d’allonge."
  revision: 439573
feature.superior-darkvision:
  effets:
    - "Vision dans le noir jusqu’à 24 m."
  notes:
    - "Contre une créature cachée dans ce rayon : une zone à visibilité réduite compte comme dégagée, une zone à visibilité nulle comme à visibilité réduite."
  revision: 433312
feature.supreme-sneak:
  effets:
    - "Action, une fois par repos court : état Invisible pendant 10 tours."
    - "L’invisibilité prend fin en cas d’attaque, de sort, d’action ou de dégâts subis."
  revision: 423734
feature.swamp:
  effets:
    - "Sorts accordés : Flèche acide de Melf et Ténèbres."
    - "Niveau 5 : Nuage nauséabond et Toucher du vampire ; niveau 7 : Flétrissement et Liane avide ; niveau 9 : Contagion et Brume mortelle."
  revision: 433321
feature.sweeping-attack:
  effets:
    - "Action, 1 dé de supériorité : attaque avec l’arme de corps à corps contre tous les ennemis et objets dans un cône de 2 m ; dégâts égaux au dé de supériorité, du type de l’arme (1d8, 1d10 avec Supériorité martiale améliorée)."
  notes:
    - "La plupart des bonus de dégâts ne s’appliquent pas : enchantement de l’arme, modificateur de Force, bonus de dégâts du don Maître des armes lourdes, dont le malus au jet d’attaque reste appliqué."
    - "Contrairement aux autres manœuvres, le dé de supériorité est dépensé même si toutes les attaques ratent."
    - "Ne déclenche pas les effets à l’impact propres à certaines armes."
  revision: 423782
feature.sweeping-cinder-strike:
  effets:
    - "Action, 2 points de ki : cône de feu de 5 m, 3d6 dégâts de feu ; jet de sauvegarde de Dextérité contre le DD de sauvegarde des sorts, demi-dégâts en cas de réussite ; enflamme ce qui est inflammable."
    - "Niveau 9, avec Incantation élémentaire améliorée : 4d6 dégâts."
  notes:
    - "Utiliser l’aptitude ouvre droit à Arts martiaux : attaque à mains nues supplémentaire."
  revision: 335592
feature.symbiotic-entity:
  effets:
    - "Action, 1 charge de Forme sauvage : état Entité symbiotique jusqu’au prochain repos long, avec 4 points de vie temporaires par niveau de druide."
    - "Tant qu’il reste de ces points de vie temporaires : 1d6 dégâts nécrotiques supplémentaires aux attaques avec une arme ou à mains nues, et Halo de spores inflige le double de dégâts."
    - "Niveau 10 : Propagation des spores devient utilisable sous cet état."
    - "Utiliser Forme sauvage met fin à l’état."
  notes:
    - "Les attaques avec une arme à distance profitent aussi du bonus de dégâts."
    - "Peut coexister avec des points de vie temporaires d’une autre source : la plus élevée est retenue, et les autres regarnissent celle-ci quand elle diminue, sans dépasser son plafond."
    - "Ne compte pas comme une Forme sauvage pour Frappe sauvage."
  revision: 423807
feature.tavern-brawler:
  effets:
    - "Attaque à mains nues, avec une arme improvisée ou de lancer : modificateur de Force ajouté une seconde fois au jet d’attaque et aux dégâts."
  notes:
    - "C’est toujours la Force qui s’ajoute, même quand l’attaque emploie la Dextérité ; un modificateur négatif pénalise d’autant."
    - "Sous Forme sauvage, le bonus s’applique, sauf aux formes de myrmidon d’air, de feu et d’eau."
    - "En mode Honneur, les attaques avec une arme improvisée au corps à corps ne gagnent que le bonus au jet d’attaque."
  revision: 438927
feature.tempestuous-magic:
  effets:
    - "Après le lancement d’un sort de niveau 1 ou plus : vol jusqu’à 9 m par une action bonus, jusqu’à la fin du tour, sans provoquer d’attaque d’opportunité (état Magie tempétueuse : vol, 1 tour)."
  revision: 433335
feature.tenacity:
  effets:
    - "Réaction, quand une attaque au corps à corps avec l’arme rate : la cible subit tout de même des dégâts contondants égaux au modificateur de Force du porteur (minimum 1)."
  notes:
    - "Après une action d’arme ratée, ces dégâts ne déclenchent pas les effets propres à l’action."
    - "Ces dégâts comptent comme un coup de l’arme : ils déclenchent les effets à l’impact de l’équipement, comme les enduits."
  revision: 425432
feature.third-eye-darkvision:
  effets:
    - "Action, une fois par repos long : vision dans le noir jusqu’à 24 m, jusqu’au prochain repos long (état Vision dans le noir)."
  revision: 424180
feature.third-eye-see-invisibility:
  effets:
    - "Action, une fois par repos long : état Voir l’invisible jusqu’au prochain repos long ; les créatures invisibles deviennent visibles pour le magicien."
  revision: 439636
feature.thought-shield-psychic-reflection:
  effets:
    - "Dégâts psychiques subis : l’attaquant subit les mêmes dégâts."
  revision: 433345
feature.thought-shield-psychic-resistance:
  effets:
    - "Résistance aux dégâts psychiques."
  revision: 433346
feature.thunderbolt-strike:
  effets:
    - "Dégâts de tonnerre ou de foudre infligés à une créature de taille G ou inférieure : elle peut aussi être repoussée jusqu’à 3 m."
  notes:
    - "Cette poussée remplace celle de l’action qui la déclenche au lieu de s’y ajouter, et peut la raccourcir : 3 m au lieu de 8 m avec Vague tonnante."
    - "Une créature poussée d’un rebord par ce seul effet ne subit pas de dégâts de chute."
  revision: 433350
feature.tides-of-chaos:
  effets:
    - "1 charge, rendue par un repos court ou long : avantage au prochain jet d’attaque, test de caractéristique ou jet de sauvegarde, par une réaction qui ne consomme pas la réaction du tour, ou en activant l’aptitude à l’avance."
    - "Ensuite (état Marées du chaos) : un sort de niveau 1 ou plus déclenche une manifestation de magie sauvage sur un résultat de 11 ou plus au d20, au lieu de 20 seulement."
  revision: 439263
feature.tiger-heart:
  effets:
    - "Accorde Rage : cœur de tigre : sous Rage, Soif de sang du tigre devient utilisable et la distance de saut augmente de 4,5 m."
  revision: 433353
feature.tigers-bloodlust:
  effets:
    - "Action, sous Rage : attaque avec l’arme de corps à corps contre 3 créatures non alliées au plus, dans un cône de 2 m ; chaque cible touchée subit la moitié des dégâts habituels de l’arme et l’état Saignement pendant 2 tours."
  notes:
    - "Aucun jet de sauvegarde contre Saignement : un coup réussi suffit."
    - "Beaucoup de bonus de dégâts ne sont pas divisés par deux, dont celui de Rage et celui du don Maître des armes lourdes."
    - "Ne déclenche pas les effets à l’impact propres à certaines armes."
  revision: 424228
feature.touch-of-the-storm:
  effets:
    - "Action, 1 point de ki : attaque de sort au corps à corps, 1d10 dégâts de foudre ; avantage contre une créature en armure métallique."
    - "Cible touchée : état Poigne électrique pendant 1 tour, sans réaction possible."
    - "Niveau 9, avec Incantation élémentaire améliorée : 2d10 dégâts."
  notes:
    - "Garde une composante verbale : inutilisable sous l’état Réduit au silence, contrairement aux autres aptitudes de la Voie des Quatre Éléments."
    - "Utiliser l’aptitude ouvre droit à Arts martiaux : attaque à mains nues supplémentaire."
  revision: 371825
feature.tough:
  effets:
    - "Points de vie maximum : +2 par niveau du personnage, y compris les niveaux déjà acquis."
  notes:
    - "Sans effet sous Forme sauvage."
  revision: 438958
feature.training-in-war-and-song:
  effets:
    - "Maîtrise des armures légères et de la compétence Représentation."
    - "Maîtrise des dagues, épées longues, rapières, cimeterres, épées courtes et serpes."
  revision: 433368
feature.tranquillity:
  effets:
    - "Après chaque repos long : état Sanctuaire, qui dure jusqu’à la première attaque du personnage."
  revision: 433369
feature.transmuters-stone:
  effets:
    - "Crée une pierre qui accorde à la créature qui la porte un bienfait au choix : maîtrise des jets de sauvegarde de Constitution, vision dans le noir à 12 m, vitesse +3 m, ou résistance à l’acide, au froid, au feu, à la foudre ou au tonnerre."
    - "Ensuite, état Pierre du transmutateur : magie tarie : une nouvelle pierre demande un sort de transmutation de niveau 1 ou plus, ou un repos long."
  notes:
    - "Hors combat, un sort rituel de transmutation (Amélioration de saut, Feuille morte, Grande foulée) recharge l’aptitude sans dépenser d’emplacement."
    - "Une seule pierre active par créateur : en créer une nouvelle détruit l’ancienne ; la pierre disparaît aussi si son créateur quitte le groupe actif."
  revision: 428116
feature.transmuters-stone-acid-resistance:
  effets:
    - "Crée une pierre qui donne à la créature qui la porte la résistance aux dégâts d’acide, jusqu’au prochain repos long."
    - "Une nouvelle pierre demande ensuite un sort de transmutation de niveau 1 ou plus, ou un repos long."
  revision: 428224
feature.transmuters-stone-cold-resistance:
  effets:
    - "Crée une pierre qui donne à la créature qui la porte la résistance aux dégâts de froid, jusqu’au prochain repos long."
    - "Une nouvelle pierre demande ensuite un sort de transmutation de niveau 1 ou plus, ou un repos long."
  revision: 428225
feature.transmuters-stone-constitution:
  effets:
    - "Crée une pierre qui donne à la créature qui la porte la maîtrise des jets de sauvegarde de Constitution, jusqu’au prochain repos long."
    - "Une nouvelle pierre demande ensuite un sort de transmutation de niveau 1 ou plus, ou un repos long."
  revision: 428220
feature.transmuters-stone-darkvision:
  effets:
    - "Crée une pierre qui donne à la créature qui la porte la vision dans le noir jusqu’à 12 m, jusqu’au prochain repos long."
    - "Une nouvelle pierre demande ensuite un sort de transmutation de niveau 1 ou plus, ou un repos long."
  revision: 428221
feature.transmuters-stone-fire-resistance:
  effets:
    - "Crée une pierre qui donne à la créature qui la porte la résistance aux dégâts de feu, jusqu’au prochain repos long."
    - "Une nouvelle pierre demande ensuite un sort de transmutation de niveau 1 ou plus, ou un repos long."
  revision: 428226
feature.transmuters-stone-lightning-resistance:
  effets:
    - "Crée une pierre qui donne à la créature qui la porte la résistance aux dégâts de foudre, jusqu’au prochain repos long."
    - "Une nouvelle pierre demande ensuite un sort de transmutation de niveau 1 ou plus, ou un repos long."
  revision: 428227
feature.transmuters-stone-passive-feature:
  effets:
    - "Permet de créer des pierres du transmutateur (action Pierre du transmutateur)."
    - "Après chaque création, il faut lancer un sort de transmutation de niveau 1 ou plus, ou prendre un repos long, avant d’en créer une autre."
  revision: 433370
feature.transmuters-stone-speed:
  effets:
    - "Crée une pierre qui augmente de 3 m la vitesse de déplacement de la créature qui la porte, jusqu’au prochain repos long."
    - "Une nouvelle pierre demande ensuite un sort de transmutation de niveau 1 ou plus, ou un repos long."
  revision: 428222
feature.transmuters-stone-thunder-resistance:
  effets:
    - "Crée une pierre qui donne à la créature qui la porte la résistance aux dégâts de tonnerre, jusqu’au prochain repos long."
    - "Une nouvelle pierre demande ensuite un sort de transmutation de niveau 1 ou plus, ou un repos long."
  revision: 428228
feature.trip-attack-melee:
  effets:
    - "Action : attaque avec l’arme de corps à corps ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "Puis jet de sauvegarde de Force de la cible (DD d’action d’arme) ; en cas d’échec, état À terre pendant 1 tour."
  notes:
    - "Une attaque ratée ne dépense pas de dé de supériorité."
    - "Aucune limite de taille de la cible, même très grande."
  revision: 424397
feature.trip-attack-ranged:
  effets:
    - "Action : attaque avec l’arme à distance ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8 de base)."
    - "Puis jet de sauvegarde de Force de la cible (DD d’action d’arme) ; en cas d’échec, état À terre jusqu’au prochain repos long."
  notes:
    - "La cible peut tout de même se relever au début de son tour en dépensant la moitié de son déplacement ; si rien ne lui permet de se déplacer, elle reste à terre."
    - "Une attaque ratée ne dépense pas de dé de supériorité."
    - "Aucune limite de taille de la cible, même très grande."
  revision: 424398
feature.true-strike-riposte:
  effets:
    - "Réaction, quand une créature rate une attaque au corps à corps contre le porteur : riposte avec l’arme de la main principale, et le porteur obtient l’état Coup au but pendant 2 tours."
  revision: 429159
feature.turn-the-faithless:
  effets:
    - "Action, 1 charge de Conduit de serment : chaque fée et chaque fiélon dans un rayon de 9 m fait un jet de sauvegarde de Sagesse contre le DD de sauvegarde des sorts ; en cas d’échec, état Renvoyé pendant 3 tours."
    - "Renvoyé : la créature s’éloigne le plus possible du paladin, sans pouvoir s’en approcher à 9 m ou moins ; elle n’a plus de réaction et, pour ses actions, ne peut que prendre l’action Pointe ou tenter de se libérer d’une entrave."
    - "L’état prend fin si la créature subit des dégâts."
  revision: 424423
feature.turn-the-tide:
  effets:
    - "Action bonus, 1 charge de Conduit de serment : chaque créature non hostile dans un rayon de 9 m, paladin compris, récupère 1d6 + niveau de paladin + modificateur de Charisme points de vie."
  revision: 424424
feature.turn-the-unholy:
  effets:
    - "Action, 1 charge de Conduit de serment : chaque mort-vivant et chaque fiélon dans un rayon de 9 m fait un jet de sauvegarde de Sagesse contre le DD de sauvegarde des sorts ; en cas d’échec, état Renvoyé pendant 3 tours."
    - "Renvoyé : la créature s’éloigne le plus possible du paladin, sans pouvoir s’en approcher à 9 m ou moins ; elle n’a plus de réaction et, pour ses actions, ne peut que prendre l’action Pointe ou tenter de se libérer d’une entrave."
    - "L’état prend fin si la créature subit des dégâts."
  revision: 424425
feature.twinkling-constellations:
  effets:
    - "Forme étoilée : archer : Flèche lumineuse inflige 1d8 dégâts de plus ; Forme étoilée : calice : Soins du calice rend 1d8 points de vie de plus."
    - "Forme étoilée : dragon : le druide plane et peut voler sur 6 m."
    - "Une fois par tour, par une action gratuite : passage d’une Forme étoilée à une autre."
  revision: 433374
feature.umbral-shroud:
  effets:
    - "Action, une fois par repos court, dans une zone à visibilité réduite ou nulle : état Linceul ombral pendant 10 tours, qui rend invisible."
    - "L’invisibilité prend fin en cas d’attaque, de sort, d’action ou de dégâts subis."
  revision: 424474
feature.unarmoured-defence-barbarian:
  effets:
    - "Sans armure : classe d’armure égale à 10 + modificateur de Dextérité + modificateur de Constitution."
  notes:
    - "Compatible avec un bouclier."
    - "Un casque, des gants ou des bottes classés comme armure légère, intermédiaire ou lourde comptent comme une armure et annulent l’effet."
    - "Ne se cumule pas avec Armure de mage, Résistance draconique, Peau d’écorce ni l’autre Défense sans armure : seule la meilleure classe d’armure de base compte ; les bonus d’autres sources s’ajoutent."
    - "Fonctionne sous Forme sauvage si aucune armure n’était équipée avant la transformation et si la forme a une classe d’armure de base plus basse."
  revision: 439528
feature.unarmoured-defence-monk:
  effets:
    - "Sans armure ni bouclier : classe d’armure égale à 10 + modificateur de Dextérité + modificateur de Sagesse."
  notes:
    - "Un casque ou des gants classés comme armure légère, intermédiaire ou lourde comptent comme une armure et annulent l’effet."
    - "Ne se cumule pas avec Armure de mage, Résistance draconique, Peau d’écorce ni l’autre Défense sans armure : seule la meilleure classe d’armure de base compte ; les bonus d’autres sources s’ajoutent."
    - "Fonctionne sous Forme sauvage si aucune armure n’était équipée avant la transformation et si la forme a une classe d’armure de base plus basse."
  revision: 439527
feature.unarmoured-movement:
  effets:
    - "Sans armure ni bouclier : vitesse de déplacement +3 m ; +4,5 m au niveau 6 ; +6 m au niveau 10."
  revision: 438987
feature.uncanny-dodge:
  effets:
    - "Aptitude à activer, par une réaction : les dégâts subis sont réduits de moitié."
  notes:
    - "Se déclenche sur tout dégât subi, pas seulement sur une attaque : sort à jet de sauvegarde, chute, dégâts qu’on s’inflige soi-même."
    - "Se cumule avec la résistance : jusqu’à 75 % de dégâts en moins."
    - "Peut se déclencher plusieurs fois dans le même tour face à des attaquants différents, même sous un état qui interdit les réactions, comme Ralenti."
  revision: 438158
feature.undead-thralls-additional-undead:
  effets:
    - "Sort Animation des morts : un cadavre supplémentaire peut être relevé."
  notes:
    - "La portée d’Animation des morts passe à 6 m : plus que les 3 m de base, moins que les 9 m d’un lancement à un niveau supérieur."
  revision: 433387
feature.undead-thralls-animate-dead:
  effets:
    - "Sort Animation des morts appris, s’il ne l’était pas déjà."
  revision: 433388
feature.undead-thralls-better-summons:
  effets:
    - "Créatures relevées par Animation des morts : points de vie supplémentaires égaux au niveau de magicien, et bonus de maîtrise du magicien ajouté à leurs dégâts."
  notes:
    - "Leurs jets d’attaque emploient aussi le bonus de maîtrise du magicien."
  revision: 433389
feature.underdark-passive-feature:
  effets:
    - "Sorts accordés : Toile d’araignée et Foulée brumeuse."
    - "Niveau 5 : Forme gazeuse et Nuage nauséabond ; niveau 7 : Invisibilité supérieure et Domination de bête ; niveau 9 : Contagion et Brume mortelle."
  revision: 433391
feature.unrelenting-ferocity:
  effets:
    - "Action, une fois par rage : le barbare récupère 1d8 + modificateur de Constitution points de vie."
  revision: 424530
feature.unstable-backlash:
  effets:
    - "Réaction, sous Rage, après des dégâts subis ou un jet de sauvegarde raté : un nouvel effet de magie sauvage se déclenche et remplace l’effet en cours."
  revision: 439500
feature.volley:
  effets:
    - "Action : attaque avec l’arme à distance contre chaque créature non alliée et chaque objet dans un rayon de 3 m autour d’un point à portée de l’arme ; dégâts de l’arme à chaque cible touchée."
  notes:
    - "Ne touche pas les membres du groupe, mais peut toucher des personnages amicaux."
    - "Certains effets d’équipement s’appliquent à chaque cible touchée, d’autres à une seule."
  revision: 424713
feature.vow-of-enmity:
  effets:
    - "Action bonus, 1 charge de Conduit de serment : un ennemi à 3 m ou moins ; avantage aux jets d’attaque contre lui pendant 10 tours (état Vœu d’inimitié)."
  notes:
    - "Le paladin peut se prendre lui-même pour cible : il a alors l’avantage aux jets d’attaque contre toutes les cibles pendant 10 tours."
  revision: 414411
feature.war-caster-concentration:
  effets:
    - "Jets de sauvegarde de concentration : avantage."
  revision: 438957
feature.war-caster-opportunity-spell:
  effets:
    - "Réaction, quand une créature quitte l’allonge du personnage : lancement de Poigne électrique sur elle, à la place d’une attaque d’opportunité."
  notes:
    - "Le sort n’a pas besoin d’être connu, mais ne se lance ainsi qu’en réaction ; il emploie la caractéristique d’incantation du personnage."
    - "Utilisable sous l’état Réduit au silence, et sous Sanctuaire, auquel il met fin."
    - "Ne se déclenche pas si seules des armes à distance sont équipées ; fonctionne même contre une cible protégée par Panache ou Jeu de jambes raffiné."
  revision: 438933
feature.war-magic:
  effets:
    - "Après un sort mineur qui coûte une action : attaque avec une arme par une action bonus."
  notes:
    - "Une fois par round, mais jusqu’à 2 attaques bonus si plusieurs actions bonus sont disponibles."
    - "L’attaque peut être toute attaque compatible avec Attaque supplémentaire, comme un lancer ou Lame retentissante, sans déclencher Attaque supplémentaire."
    - "Pas de déclenchement avec un sort mineur en action bonus, comme Gourdin magique, ni avec Lame retentissante portée grâce à Attaque supplémentaire."
  revision: 433429
feature.war-priest:
  effets:
    - "Après une attaque avec une arme ou à mains nues, 1 charge de Prêtre de guerre : attaque supplémentaire par une action bonus."
    - "Charges par repos long : 3 ; 4 au niveau 5 de clerc, 5 au niveau 8, 6 au niveau 11."
  notes:
    - "Fonctionne comme Attaque supplémentaire, sans demande de confirmation : les attaques compatibles sont mises en évidence."
    - "Avec Fougue, l’attaque de Prêtre de guerre passe avant celles de la seconde action."
  revision: 433430
feature.warding-flare:
  effets:
    - "Réaction, contre une créature qui attaque le clerc : désavantage à son jet d’attaque, qui peut ainsi rater."
    - "Niveau 6, avec Éclat protecteur amélioré : utilisable aussi pour protéger un allié."
  notes:
    - "Fonctionne aussi contre une créature immunisée contre l’état Aveuglé."
  revision: 425438
feature.water-whip:
  effets:
    - "Action, 2 points de ki : une cible à 9 m ou moins subit 3d10 dégâts contondants et, au choix, est attirée de 9 m vers le moine ou jetée à terre (état À terre)."
    - "Jet de sauvegarde de Dextérité contre le DD d’action d’arme (8 + bonus de maîtrise + modificateur de Force ou de Dextérité, le plus élevé) : en cas de réussite, demi-dégâts et aucun autre effet."
    - "Niveau 9, avec Incantation élémentaire améliorée : 4d10 dégâts."
  notes:
    - "Les bonus au DD d’action d’arme s’y ajoutent, pas ceux au DD de sauvegarde des sorts."
    - "Utiliser l’aptitude ouvre droit à Arts martiaux : attaque à mains nues supplémentaire."
  revision: 424786
feature.weapon-bond:
  effets:
    - "Action : lie l’arme de corps à corps de la main principale jusqu’au prochain repos long (état Arme liée)."
    - "Arme liée : impossible à faire tomber des mains ; lancée, elle revient d’elle-même."
  notes:
    - "Une seule arme liée à la fois : en lier une autre défait le premier lien."
    - "Ne donne pas la propriété de lancer : une arme qui ne l’a pas n’inflige, lancée, que des dégâts d’arme improvisée fondés sur son poids."
    - "Hors combat, une arme liée lancée ne revient pas."
    - "Le lien reste attaché à l’arme : confiée à un autre personnage, elle garde ses effets jusqu’au repos long."
  revision: 424807
feature.weapon-master:
  effets:
    - "Maîtrise de 4 armes au choix."
  revision: 438956
feature.whirlwind-attack:
  effets:
    - "Action : jet d’attaque distinct avec l’arme de corps à corps contre chaque ennemi et chaque objet dans un rayon de 2 m ; dégâts de l’arme à chaque cible touchée."
  notes:
    - "Ne touche que les ennemis : aucun risque pour les alliés."
    - "Une arme d’allonge n’agrandit pas le rayon."
    - "Certains effets d’équipement s’appliquent à chaque cible touchée, d’autres à une seule."
  revision: 424840
feature.wholeness-of-body:
  effets:
    - "Action, une fois par repos long : le moine récupère 3 × son niveau de moine points de vie et la moitié de ses points de ki maximum, arrondie à l’inférieur."
    - "Puis état Plénitude physique pendant 3 tours : 1 action bonus supplémentaire et 1 point de ki récupéré à chaque tour."
  revision: 424855
feature.wild-magic-passive-feature:
  effets:
    - "Chaque sort de niveau 1 ou plus lancé : un d20 est lancé ; sur un 20, une manifestation de magie sauvage produit un effet magique aléatoire."
  revision: 439503
feature.wild-shape:
  effets:
    - "Action, 1 charge de Forme sauvage : transformation en bête, au choix blaireau, chat, araignée ou loup ; ours en plus pour le Cercle de la Lune."
    - "Sous cette forme : Force, Dextérité, Constitution, points de vie et classe d’armure de la bête ; Intelligence, Sagesse, Charisme et maîtrises conservées ; ni parole ni sort ; l’équipement est sans effet."
    - "À 0 point de vie : retour à la forme d’origine avec les points de vie d’avant ; l’excédent de dégâts passe à la forme d’origine, et s’il la réduit à 0, la mort est immédiate."
  notes:
    - "Une concentration commencée avant la transformation continue."
    - "DD des attaques spéciales des formes : 8 + bonus de maîtrise + modificateur de Sagesse."
    - "Niveau 4 : les attaques des formes gagnent 1d4 ou 1d6 dégâts selon l’attaque ; ce dé grossit d’une taille aux niveaux 8 et 12."
  revision: 439088
feature.vapraks-greed:
  effets:
    - "Capacité de charge : +50 %, quelle que soit la race du personnage."
  notes:
    - "Pour un humain, le total avec sa polyvalence raciale reste de +50 %."
  revision: 433409
feature.wild-shape-air-myrmidon:
  effets:
    - "Action bonus, 2 charges de Forme sauvage : forme de myrmidon d’air jusqu’au prochain repos long (état Forme sauvage : myrmidon d’air), avec 90 points de vie au départ, davantage tous les 2 niveaux de druide."
    - "Armé d’un fléau qui ajoute 1d8 dégâts de foudre à chaque attaque."
    - "Actions propres : se rendre invisible ; coup de fléau électrifié, dégâts de l’arme + 1d10 dégâts de foudre, qui peut infliger l’état Étourdi pendant 2 tours ; tourbillon à 18 m ou moins, 2d8 dégâts contondants par tour, qui réduit au silence."
    - "Règles de Forme sauvage : ni parole ni sort ; retour à la forme d’origine à 0 point de vie."
  revision: 414441
feature.wild-shape-bear:
  effets:
    - "Action bonus, 1 charge de Forme sauvage : forme d’ours polaire jusqu’au prochain repos long (état Forme sauvage : ours polaire), avec 30 points de vie au départ, davantage tous les 2 niveaux de druide."
    - "Action propre : rugissement contre les ennemis dans un rayon de 9 m ; jet de sauvegarde de Sagesse, sinon état Provoqué pendant 2 tours, qui les pousse à attaquer l’ours."
    - "Règles de Forme sauvage : ni parole ni sort ; Force, Dextérité et Constitution de la bête, Intelligence, Sagesse et Charisme conservés ; retour à la forme d’origine à 0 point de vie."
  revision: 424911
feature.wild-shape-dire-raven:
  effets:
    - "Action bonus, 1 charge de Forme sauvage : forme de corbeau sanguinaire jusqu’au prochain repos long (état Forme sauvage : corbeau sanguinaire), avec 13 points de vie."
    - "Action propre : attaque aux yeux, 1d6 + modificateur de Dextérité dégâts perforants et état Aveuglé pendant 2 tours."
    - "Règles de Forme sauvage : ni parole ni sort ; Force, Dextérité et Constitution de la bête, Intelligence, Sagesse et Charisme conservés ; retour à la forme d’origine à 0 point de vie."
  notes:
    - "Les dégâts de cette forme augmentent avec le niveau de druide."
  revision: 414438
feature.wild-shape-earth-myrmidon:
  effets:
    - "Action bonus, 2 charges de Forme sauvage : forme de myrmidon de terre jusqu’au prochain repos long (état Forme sauvage : myrmidon de terre), avec 103 points de vie au départ, davantage tous les 2 niveaux de druide."
    - "Actions propres : durcir son corps, +2 à la classe d’armure pendant 4 tours pour 5 m de déplacement ; projection de boue dans un rayon de 3 m, 2d6 dégâts contondants (jet de sauvegarde de Dextérité) et terrain boueux."
    - "Enfouissement, par une action bonus et 6 m de déplacement : réapparition jusqu’à 12 m plus loin, 2d8 dégâts contondants dans un rayon de 3 m (jet de sauvegarde de Dextérité)."
    - "Règles de Forme sauvage : ni parole ni sort ; retour à la forme d’origine à 0 point de vie."
  revision: 424916
feature.wild-shape-fire-myrmidon:
  effets:
    - "Action bonus, 2 charges de Forme sauvage : forme de myrmidon de feu jusqu’au prochain repos long (état Forme sauvage : myrmidon de feu), avec 90 points de vie au départ, davantage tous les 2 niveaux de druide."
    - "Armé d’un cimeterre qui ajoute 1d6 dégâts de feu à chaque attaque."
    - "Actions propres : frappe ardente, dégâts de l’arme + 1d10 dégâts de feu, qui peut infliger l’état En flammes pendant 2 tours ; embrasement qui donne l’état Accéléré pendant 3 tours."
    - "Balayage en cône de 5 m : dégâts de l’arme + 2d6 dégâts de feu, demi-dégâts sur un jet de sauvegarde de Dextérité réussi."
    - "Règles de Forme sauvage : ni parole ni sort ; retour à la forme d’origine à 0 point de vie."
  notes:
    - "Les sorts de la forme emploient le modificateur de la dernière classe de lanceur de sorts acquise : en multiclasse, ni forcément la Sagesse ni la Dextérité."
  revision: 414567
feature.wild-shape-sabre-toothed-tiger:
  effets:
    - "Action bonus, 1 charge de Forme sauvage : forme de tigre à dents de sabre jusqu’au prochain repos long (état Forme sauvage : tigre à dents de sabre), avec 62 points de vie au départ, davantage tous les 2 niveaux de druide."
    - "Action propre : lacération, 2d4 + modificateur de Force dégâts tranchants et −2 à la classe d’armure de la cible pendant 2 tours ; la forme régénère aussi des points de vie."
    - "Règles de Forme sauvage : ni parole ni sort ; retour à la forme d’origine à 0 point de vie."
  revision: 414439
feature.wild-shape-water-myrmidon:
  effets:
    - "Action bonus, 2 charges de Forme sauvage : forme de myrmidon d’eau jusqu’au prochain repos long (état Forme sauvage : myrmidon d’eau), avec 90 points de vie au départ, davantage tous les 2 niveaux de druide."
    - "Armé d’un trident qui ajoute 1d6 dégâts de froid à chaque attaque."
    - "Actions propres : coup de trident givré, dégâts de l’arme + 1d10 dégâts de froid, qui peut infliger l’état Transi pendant 2 tours ; vapeurs qui soignent de 2d8 les créatures dans un rayon de 9 m, en combat seulement."
    - "Tridents de glace lancés à 18 m ou moins, qui créent des surfaces de glace."
    - "Règles de Forme sauvage : ni parole ni sort ; retour à la forme d’origine à 0 point de vie."
  notes:
    - "Les sorts de la forme emploient le modificateur de la dernière classe de lanceur de sorts acquise : en multiclasse, ni forcément la Sagesse ni la Force."
  revision: 414560
feature.wild-strike:
  effets:
    - "Sous Forme sauvage, hors Forme étoilée : après une action avec jet d’attaque, une attaque supplémentaire."
  notes:
    - "Vaut pour toutes les actions à jet d’attaque des formes de bête, pas seulement l’attaque à mains nues."
  revision: 432683
feature.wolf-heart:
  effets:
    - "Accorde Rage : cœur de loup : sous Rage, Hurlement galvanisant devient utilisable et les alliés ont l’avantage aux jets d’attaque au corps à corps contre les ennemis à 2 m ou moins du barbare."
  notes:
    - "L’avantage vaut pour les attaques avec une arme, à mains nues et les attaques de sort au corps à corps, comme Poigne électrique."
  revision: 433459
feature.wrath-of-the-storm:
  effets:
    - "Réaction, quand un ennemi à 2 m ou moins touche le personnage et lui inflige des dégâts : riposte au choix, 2d8 dégâts de foudre ou 2d8 dégâts de tonnerre."
    - "Jet de sauvegarde de Dextérité contre le DD de sauvegarde des sorts, demi-dégâts en cas de réussite."
  notes:
    - "Une attaque ratée ne déclenche rien, même si elle inflige des dégâts."
  revision: 433647
feature.wrath-of-the-storm-lightning:
  effets:
    - "Réaction contre un attaquant à 2 m ou moins qui a touché : 2d8 dégâts de foudre ; jet de sauvegarde de Dextérité contre le DD de sauvegarde des sorts, demi-dégâts en cas de réussite."
  notes:
    - "Ne se déclenche que sur un coup réussi qui inflige des dégâts : une attaque entièrement absorbée, par Protection arcanique par exemple, ne compte pas."
    - "Un ennemi doté d’une arme d’allonge peut attaquer hors de portée de la riposte ; une attaque d’opportunité survient souvent une fois le personnage sorti des 2 m."
  revision: 425003
feature.wrath-of-the-storm-thunder:
  effets:
    - "Réaction contre un attaquant à 2 m ou moins qui a touché : 2d8 dégâts de tonnerre ; jet de sauvegarde de Dextérité contre le DD de sauvegarde des sorts, demi-dégâts en cas de réussite."
  notes:
    - "Ne se déclenche que sur un coup réussi qui inflige des dégâts : une attaque entièrement absorbée, par Protection arcanique par exemple, ne compte pas."
    - "Compte comme un sort de foudre pour les effets qui renforcent les sorts de foudre."
  revision: 425004
feature.writhing-tide:
  effets:
    - "Action bonus, 1 charge de courant grouillant : la nuée soulève le personnage pendant 10 tours (état Marée grouillante) ; vitesse de vol de 9 m et immunité aux effets de surface."
    - "Charges : 3 au niveau 7, 4 au niveau 9."
  notes:
    - "L’immunité aux surfaces ne joue qu’après l’atterrissage : une surface atteinte au cours de ce premier vol peut encore affecter le personnage."
  revision: 425013
