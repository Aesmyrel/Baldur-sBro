# Effets rédigés des capacités, lot effets-feature, lignes 253 à 504. Voir docs/LOTS_ECRITURE.md §4.
feature.iron-mind:
  effets:
    - "Jets de sauvegarde de Sagesse et d’Intelligence : maîtrise."
  revision: 432717
feature.jack-of-all-trades:
  effets:
    - "Test de caractéristique sans maîtrise : bonus égal à la moitié du bonus de maîtrise, arrondie à l’inférieur."
  notes:
    - "Ne s’applique pas aux jets d’initiative."
  revision: 439329
feature.ki-empowered-strikes:
  effets:
    - "Attaques à mains nues : considérées comme magiques, elles passent outre la résistance et l’immunité aux dégâts contondants, perforants et tranchants non magiques."
  revision: 432724
feature.ki-resonation-blast:
  effets:
    - "Action gratuite, 1 point de ki, une fois par tour : à 18 m ou moins, fait exploser le ki d’une créature sous l’état Ki en résonance."
    - "Explosion : 3d6 dégâts de force à cette créature et aux créatures à 5 m ou moins d’elle, hors membres du groupe et invocations ; jet de sauvegarde de Dextérité contre le DD de sauvegarde des sorts, demi-dégâts en cas de réussite."
    - "Chaque créature prise dans l’explosion et elle-même en résonance explose à son tour, en chaîne."
  notes:
    - "Le DD repose sur la caractéristique d’incantation de la dernière classe prise au niveau 1 : en multiclasse, ce n’est pas forcément la Sagesse."
  revision: 420111
feature.ki-resonation-punch:
  effets:
    - "Action : attaque à mains nues au corps à corps contre une créature qui n’est pas déjà en résonance, pour les dégâts contondants habituels à mains nues."
    - "Cible touchée : état Ki en résonance pendant 10 tours, que Résonance du ki : déflagration peut faire exploser."
  notes:
    - "Permet une attaque à mains nues sans dépense de ressource, même avec une arme en main principale."
  revision: 420112
feature.ki-resonation-punch-bonus-action:
  effets:
    - "Action bonus : attaque à mains nues au corps à corps, pour les dégâts habituels à mains nues."
    - "Cible touchée : état Ki en résonance pendant 10 tours, que Résonance du ki : déflagration peut faire exploser."
  revision: 420113
feature.ki-restoration-greater:
  effets:
    - "Une fois par repos long, par une action : le porteur récupère autant de points de ki que le résultat de son dé d’arts martiaux."
  notes:
    - "Dé d’arts martiaux : 1d4 aux niveaux de moine 1 et 2, 1d6 du niveau 3 au niveau 8, 1d8 à partir du niveau 9."
  revision: 439849
feature.knowledge-of-the-ages:
  effets:
    - "Action, 1 utilisation de Conduit divin : maîtrise de toutes les compétences d’une caractéristique au choix (Force, Dextérité, Intelligence, Sagesse ou Charisme) jusqu’au prochain repos long."
  notes:
    - "Pas de cumul : une nouvelle utilisation remplace l’effet précédent."
  revision: 420155
feature.lands-stride-advantage:
  effets:
    - "Aucun effet en jeu : l’avantage annoncé aux jets de sauvegarde contre les plantes créées par magie pour entraver le déplacement ne s’applique jamais."
  revision: 432729
feature.lands-stride-difficult-terrain:
  effets:
    - "Terrain difficile : ne ralentit plus le déplacement."
  notes:
    - "Protège de tous les états de terrain difficile."
  revision: 432730
feature.lands-stride-plants:
  effets:
    - "Surfaces végétales hérissées d’épines ou de pointes : plus aucun dégât."
    - "Immunité aux entraves végétales : lianes qui enserrent ou entravent, feuillage envahissant, sorts Croissance d’épines et Croissance végétale."
  notes:
    - "Capacité cachée, obtenue en même temps que Foulée de la terre : terrain difficile."
  revision: 432731
feature.lay-on-hands:
  effets:
    - "Action, au corps à corps : dépense de charges d’Imposition des mains pour soigner une créature ou la guérir."
    - "Soin mineur : 1 charge, 2 points de vie par niveau de paladin ; soin majeur : 2 charges, 4 points de vie par niveau de paladin."
    - "Guérison : 2 charges, met fin à toutes les maladies et à tous les poisons de la créature."
    - "Sans effet sur les morts-vivants et les artificiels."
  notes:
    - "3 charges au niveau 1, puis 1 de plus aux niveaux 4 et 10 de paladin ; elles reviennent au repos long."
  revision: 420251
feature.leap-to-your-feet:
  effets:
    - "État À terre : se relever ne coûte que 1,5 m de déplacement."
  notes:
    - "Pour qui commence son tour avec moins de 3 m de déplacement, la règle ordinaire (moitié du déplacement) coûterait moins cher."
  revision: 432737
feature.legion-of-bees:
  effets:
    - "Une fois par round, après avoir touché un ennemi : la nuée d’abeilles intervient, au choix, de l’une de trois façons."
    - "Attaque : 1d6 dégâts perforants supplémentaires."
    - "Repoussement : l’ennemi est repoussé loin du personnage."
    - "Téléportation : le personnage est transporté jusqu’à 5 m plus loin."
  notes:
    - "Les trois options partagent le même temps de recharge : une seule par round."
  revision: 432777
feature.life-of-the-party:
  effets:
    - "Frappe enivrante réussie : état Boute-en-train jusqu’au début du tour suivant, soit +1 à la classe d’armure et, contre les cibles sous l’état Ivre, un bonus égal au modificateur de Sagesse aux jets d’attaque."
  notes:
    - "L’état prend fin au début du tour suivant : le bonus d’attaque ne profite qu’aux attaques du même tour."
  revision: 434189
feature.lightly-armoured:
  effets:
    - "Maîtrise des armures légères."
  revision: 438995
feature.lightning-breath:
  effets:
    - "Action, une fois par repos court : ligne de foudre de 5 m, 2d6 dégâts de foudre ; jet de sauvegarde de Dextérité (DD 8 + modificateur de Constitution + bonus de maîtrise), demi-dégâts en cas de réussite."
    - "Niveau 6 du personnage : 3d6 dégâts ; niveau 11 : 4d6."
  notes:
    - "Ce DD est un DD de sauvegarde des sorts fondé sur la Constitution : tout bonus au DD de sauvegarde des sorts s’y ajoute."
  revision: 420485
feature.lucky-ability-check:
  effets:
    - "Aptitude à activer : dépense d’un point de chance pour obtenir l’avantage au prochain test de caractéristique."
  notes:
    - "Se cumule avec la chance raciale des halfelins."
    - "Désactivée à l’obtention : elle ne peut être activée qu’après un premier test de caractéristique, une réaction ou un repos."
  revision: 438975
feature.lucky-reactions:
  effets:
    - "Réaction, 1 point de chance, lors d’un jet d’attaque ou d’un jet de sauvegarde du personnage : le jet est relancé avec avantage."
    - "Réaction, 1 point de chance, lors du jet d’attaque d’un ennemi : il doit relancer ce jet."
  notes:
    - "Se cumule avec la chance raciale des halfelins."
  revision: 438976
feature.lunar-mend:
  effets:
    - "Action bonus, sous Forme sauvage : dépense d’un emplacement de sort pour récupérer 1d8 points de vie par niveau de l’emplacement."
  revision: 420663
feature.mage-hand-legerdemain:
  effets:
    - "Sort Main de mage : la main spectrale est invisible et ne disparaît plus d’elle-même."
  notes:
    - "Presque toute action de la main met fin à son invisibilité, qui ne revient qu’après un repos court."
    - "Invoquée dans le champ de vision d’un allié sous l’état Voir l’invisible, la main perd aussitôt son invisibilité."
  revision: 432803
feature.mage-slayer-attack-caster:
  effets:
    - "Réaction, quand un ennemi lance un sort à 2 m ou moins : attaque contre lui."
  notes:
    - "L’attaque survient une fois le sort lancé : elle ne l’empêche pas."
    - "La portée reste de 2 m : une arme d’allonge ne l’étend pas."
    - "Inutilisable sous un déguisement, comme celui du sort Déguisement."
  revision: 432982
feature.mage-slayer-break-concentration:
  effets:
    - "Ennemi touché par une attaque au corps à corps : sa concentration est rompue, quel que soit le résultat de son jet de sauvegarde."
  revision: 433023
feature.mage-slayer-saving-throw-advantage:
  effets:
    - "Jets de sauvegarde contre un sort lancé par une créature à 1,5 m ou moins : avantage."
  revision: 438977
feature.magic-arrow:
  effets:
    - "Attaques à distance : considérées comme magiques, elles passent outre la résistance aux dégâts non magiques (état Flèche magique)."
  revision: 432807
feature.magic-awareness:
  effets:
    - "Action bonus, une fois par repos court : toutes les créatures à 3 m ou moins, ennemis compris, gagnent +1d4 à tous leurs jets de sauvegarde pendant 1 tour (état Perception de la magie)."
  revision: 439202
feature.magic-initiate-bard:
  effets:
    - "2 sorts mineurs et 1 sort de niveau 1 de la liste du barde, appris."
    - "Le sort de niveau 1 se lance une fois par repos long."
    - "Caractéristique d’incantation de ces 3 sorts : Charisme."
  revision: 438978
feature.magic-initiate-cleric:
  effets:
    - "2 sorts mineurs et 1 sort de niveau 1 de la liste du clerc, appris."
    - "Le sort de niveau 1 se lance une fois par repos long."
    - "Caractéristique d’incantation de ces 3 sorts : Sagesse."
  notes:
    - "Effet non affiché : en armure intermédiaire, le bonus de Dextérité à la classe d’armure plafonne à +3 au lieu de +2 ; le désavantage aux tests de Discrétion demeure."
    - "Une armure dotée de Matériau exotique perd alors son bonus de Dextérité entier : il plafonne aussi à +3."
  revision: 438979
feature.magic-initiate-druid:
  effets:
    - "2 sorts mineurs et 1 sort de niveau 1 de la liste du druide, appris."
    - "Le sort de niveau 1 se lance une fois par repos long."
    - "Caractéristique d’incantation de ces 3 sorts : Sagesse."
  revision: 438980
feature.magic-initiate-sorcerer:
  effets:
    - "2 sorts mineurs et 1 sort de niveau 1 de la liste de l’ensorceleur, appris."
    - "Le sort de niveau 1 se lance une fois par repos long."
    - "Caractéristique d’incantation de ces 3 sorts : Charisme."
  notes:
    - "Exception : appris ainsi, le sort Bouclier consomme un emplacement de sort comme un sort ordinaire, sans limite d’une fois par repos long ; sans emplacement, il est inutilisable."
  revision: 439052
feature.magic-initiate-warlock:
  effets:
    - "2 sorts mineurs et 1 sort de niveau 1 de la liste de l’occultiste, appris."
    - "Le sort de niveau 1 se lance une fois par repos long."
    - "Caractéristique d’incantation de ces 3 sorts : Charisme."
  revision: 438982
feature.magic-initiate-wizard:
  effets:
    - "2 sorts mineurs et 1 sort de niveau 1 de la liste du magicien, appris."
    - "Le sort de niveau 1 se lance une fois par repos long."
    - "Caractéristique d’incantation de ces 3 sorts : Intelligence."
  notes:
    - "Exception : appris ainsi, le sort Bouclier consomme un emplacement de sort comme un sort ordinaire, sans limite d’une fois par repos long ; sans emplacement, il est inutilisable."
  revision: 439053
feature.magical-ambush:
  effets:
    - "Sous l’état Caché : les cibles des sorts du personnage ont un désavantage à leurs jets de sauvegarde."
  notes:
    - "Vaut pour la plupart des sorts de dégâts ou de contrôle à sauvegarde immédiate, au premier jet seulement pour ces derniers."
    - "Ne vaut pas pour la plupart des sorts qui créent une zone au sol, ni pour Agrandissement/Rapetissement et Télékinésie."
  revision: 432817
feature.manifestation-of-body:
  effets:
    - "Aptitude à activer : les attaques à mains nues infligent 1d4 + modificateur de Sagesse dégâts nécrotiques supplémentaires."
    - "Incompatible avec Manifestation de l’esprit et Manifestation de l’âme : une seule à la fois."
  revision: 432825
feature.manifestation-of-mind:
  effets:
    - "Aptitude à activer : les attaques à mains nues infligent 1d4 + modificateur de Sagesse dégâts psychiques supplémentaires."
    - "Incompatible avec Manifestation du corps et Manifestation de l’âme : une seule à la fois."
  revision: 432826
feature.manifestation-of-soul:
  effets:
    - "Aptitude à activer : les attaques à mains nues infligent 1d4 + modificateur de Sagesse dégâts radiants supplémentaires."
    - "Incompatible avec Manifestation du corps et Manifestation de l’esprit : une seule à la fois."
  revision: 432827
feature.manoeuvring-attack-melee:
  effets:
    - "Action : attaque avec l’arme de corps à corps ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "Ensuite, par une action gratuite : un allié à 9 m ou moins gagne 4,5 m de déplacement et ne provoque pas d’attaque d’opportunité pendant 1 tour."
  notes:
    - "Le dé de supériorité n’est dépensé qu’en cas de coup réussi."
  revision: 420780
feature.manoeuvring-attack-ranged:
  effets:
    - "Action : attaque avec l’arme à distance ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "Ensuite, par une action gratuite : un allié à 9 m ou moins gagne 4,5 m de déplacement et ne provoque pas d’attaque d’opportunité pendant 1 tour."
  notes:
    - "Le dé de supériorité n’est dépensé qu’en cas de coup réussi."
  revision: 420781
feature.mantle-of-inspiration:
  effets:
    - "Action bonus, 1 Inspiration bardique : 2 alliés à 9 m ou moins, barde compris, gagnent 5 points de vie temporaires et l’état Manteau d’inspiration jusqu’au prochain repos long."
    - "Allié touché par une attaque au corps à corps sous cet état : l’attaquant subit l’état Charmé pendant 1 tour."
    - "Niveau 6 : 3 alliés et 8 points de vie temporaires ; niveau 10 : 4 alliés et 11 points de vie temporaires."
  notes:
    - "Contre une attaque multiple d’un seul tenant, le charme ne tombe qu’après le premier coup et n’empêche pas les suivants."
    - "Ces points de vie temporaires ne comptent pas comme un soin pour les effets qui se déclenchent sur un soin."
  revision: 420783
feature.mantle-of-majesty-command:
  effets:
    - "Action bonus, une fois par repos long, avec concentration : pendant 10 tours, le barde peut chaque tour, par une action bonus, donner un ordre à une créature à 18 m ou moins."
    - "Ordres : approcher, fuir, s’arrêter (ni déplacement ni action), se jeter à terre ou lâcher son arme ; la cible obéit pendant 1 tour."
    - "Jet de sauvegarde de Sagesse contre le DD de sauvegarde des sorts ; une cible sous l’état Charmé le rate automatiquement."
  notes:
    - "Contrairement au sort Injonction, fonctionne aussi contre les morts-vivants."
    - "Utilisable sous Rage, mais entrer en Rage rompt la concentration."
  revision: 420785
feature.martial-adept:
  effets:
    - "1 dé de supériorité supplémentaire (1d8), rendu par un repos court ou long."
  revision: 438889
feature.martial-arts-bonus-unarmed-strike:
  effets:
    - "Après une attaque au corps à corps à mains nues ou avec une arme de moine : une attaque à mains nues par une action bonus, ce tour-ci (état Arts martiaux : attaque à mains nues)."
  notes:
    - "Ne se déclenche pas sur elle-même : pour l’utiliser une seconde fois dans le tour, il faut une nouvelle attaque à mains nues ou avec une arme de moine."
    - "Toutes les aptitudes de la Voie des Quatre Éléments l’accordent aussi, même celles qui ne sont pas des attaques."
    - "Une attaque qui déclenche le combat, ou qui le rejoint au premier round, ne l’accorde pas : l’état disparaît au début du tour."
  revision: 432833
feature.martial-arts-deft-strikes:
  effets:
    - "Attaques à mains nues et avec une arme de moine : 1d4 dégâts au minimum, sauf si les dégâts normaux sont plus élevés."
    - "Niveau 3 de moine : 1d6 ; niveau 9 : 1d8."
  notes:
    - "Les armes de moine gardent leur type de dégâts ; les attaques à mains nues infligent des dégâts contondants."
    - "Au niveau 9, une arbalète de poing maîtrisée passe aussi à 1d8."
    - "Sans effet sur les armes qui lancent plusieurs dés de dégâts."
  revision: 432834
feature.martial-arts-dextrous-attacks:
  effets:
    - "Attaques à mains nues et avec une arme de moine : modificateur de Dextérité au lieu de Force, si la Dextérité est plus élevée."
  notes:
    - "Tant que la Dextérité dépasse la Force, prime sur Gourdin magique, Incantateur de corps à corps, les armes de pacte liées et Lame de feu, même si la caractéristique qu’ils emploient est plus élevée."
    - "Ne rend pas une arme sans finesse utilisable pour l’Attaque sournoise."
  revision: 432835
feature.medium-armour-master:
  effets:
    - "En armure intermédiaire : plus de désavantage aux tests de Discrétion."
    - "En armure intermédiaire : le bonus de Dextérité à la classe d’armure plafonne à +3 au lieu de +2."
  notes:
    - "Une armure dotée de Matériau exotique perd alors son bonus de Dextérité entier : il plafonne aussi à +3."
  revision: 438891
feature.menacing-attack-melee:
  effets:
    - "Action : attaque avec l’arme de corps à corps ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8)."
    - "Puis jet de sauvegarde de Sagesse de la cible (DD d’action d’arme) ; en cas d’échec, état Effrayé pendant 2 tours : désavantage aux tests de caractéristique et aux jets d’attaque, aucun déplacement possible."
  notes:
    - "Une attaque ratée ne dépense pas de dé de supériorité."
  revision: 420905
feature.menacing-attack-ranged:
  effets:
    - "Action : attaque avec l’arme à distance ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8)."
    - "Puis jet de sauvegarde de Sagesse de la cible (DD d’action d’arme) ; en cas d’échec, état Effrayé pendant 2 tours : désavantage aux tests de caractéristique et aux jets d’attaque, aucun déplacement possible."
  notes:
    - "Une attaque ratée ne dépense pas de dé de supériorité."
  revision: 420906
feature.mighty-cloud-of-jellyfish:
  effets:
    - "Une fois par round, après avoir touché un ennemi : la nuée de méduses intervient, au choix, de l’une de trois façons."
    - "Attaque : 1d8 dégâts de foudre supplémentaires."
    - "Piqûre électrique : tente d’infliger à l’ennemi les états Électrocuté et Désarmé."
    - "Téléportation : le personnage est transporté jusqu’à 5 m plus loin et gagne +2 à la classe d’armure jusqu’au début de son prochain tour."
  notes:
    - "Les trois options partagent le même temps de recharge : une seule par round."
  revision: 420959
feature.mighty-flurry-of-moths:
  effets:
    - "Une fois par round, après avoir touché un ennemi : la nuée de phalènes intervient, au choix, de l’une de trois façons."
    - "Attaque : 1d8 dégâts psychiques supplémentaires."
    - "Nuée aveuglante : tente d’infliger à l’ennemi les états Aveuglé et Ralenti."
    - "Téléportation : le personnage est transporté jusqu’à 5 m plus loin et gagne +2 à la classe d’armure jusqu’au début de son prochain tour."
  notes:
    - "Les trois options partagent le même temps de recharge : une seule par round."
  revision: 420960
feature.mighty-impel:
  effets:
    - "Action bonus, sous Rage : lance une créature ou un objet de taille moyenne ou inférieure jusqu’à 9 m."
    - "Plus la créature ou l’objet lancé est lourd, plus les dégâts à l’impact sont élevés."
  notes:
    - "Portée fixe de 9 m, quels que soient la Force et le poids lancé ; aucune Force minimale n’est requise pour soulever."
  revision: 420961
feature.mighty-legion-of-bees:
  effets:
    - "Une fois par round, après avoir touché un ennemi : la nuée d’abeilles intervient, au choix, de l’une de trois façons."
    - "Attaque : 1d8 dégâts perforants supplémentaires."
    - "Repoussement : l’ennemi est repoussé loin du personnage et peut aussi tomber À terre."
    - "Téléportation : le personnage est transporté jusqu’à 5 m plus loin et gagne +2 à la classe d’armure jusqu’au début de son prochain tour."
  notes:
    - "Les trois options partagent le même temps de recharge : une seule par round."
  revision: 433034
feature.mighty-swarm:
  effets:
    - "Attaque de la nuée : 1d8 dégâts au lieu de 1d6 (perforants, de foudre ou psychiques selon la nuée)."
    - "Option d’entrave renforcée : les abeilles peuvent aussi jeter l’ennemi À terre, les méduses le désarmer, les phalènes lui infliger l’état Ralenti."
    - "Téléportation avec la nuée : +2 à la classe d’armure jusqu’au début du tour suivant."
  revision: 432853
feature.mindless-rage:
  effets:
    - "Sous l’état Frénétique : aucun état de charme ni de peur ne peut être subi."
    - "Le sort Apaisement des émotions ne met plus fin à la rage."
  revision: 432854
feature.minor-conjuration-create-water:
  effets:
    - "Action, une fois par repos court : pluie dans un rayon de 4 m, à 9 m ou moins ; elle éteint les flammes exposées et forme une surface d’eau."
    - "Créatures dans la zone : état Mouillé pendant 3 tours, soit immunité à l’état En flammes, résistance aux dégâts de feu et vulnérabilité aux dégâts de foudre et de froid."
  notes:
    - "Équivaut au sort Création ou destruction d’eau de niveau 1, sans emplacement de sort et sans lancement à un niveau supérieur."
  revision: 420996
feature.mist-stance:
  effets:
    - "Action, 4 points de ki, avec concentration : état Forme gazeuse jusqu’au prochain repos long."
    - "Forme gazeuse : taille très petite, résistance à tous les dégâts non magiques, avantage aux jets de sauvegarde de Force, de Dextérité et de Constitution, immunité à l’état Saignement."
    - "Sous cette forme : Force et Dextérité ramenées à 10, ni attaque, ni sort, ni parole ; le moine vole, ne peut pas tomber et passe par de petites ouvertures."
  notes:
    - "Les petites ouvertures comprennent tuyaux, terriers et barreaux, qui permettent parfois de rejoindre d’autres zones."
  revision: 382494
feature.misty-escape:
  effets:
    - "Réaction, une fois par repos court, après avoir subi des dégâts : état Invisible, soit avantage aux jets d’attaque et désavantage aux jets d’attaque des ennemis."
    - "L’invisibilité prend fin en cas d’attaque, de sort, d’action ou de dégâts subis."
    - "Au tour suivant : le sort Foulée brumeuse peut être lancé, mais il met fin à l’invisibilité."
  revision: 432858
feature.mobile:
  effets:
    - "Vitesse de déplacement : +3 m."
  revision: 439290
feature.mobile-evade-difficult-terrain:
  effets:
    - "Après l’action Pointe : le terrain difficile ne ralentit plus le déplacement."
  notes:
    - "Ne vaut que pour le terrain difficile ordinaire, la boue et les lianes ; les autres terrains difficiles ralentissent toujours."
  revision: 439293
feature.mobile-evade-opportunity-attack:
  effets:
    - "Déplacement après une attaque au corps à corps, réussie ou non : la cible ne peut pas porter d’attaque d’opportunité contre le personnage pendant 1 tour."
  notes:
    - "Se déclenche aussi avec une attaque de sort au corps à corps."
  revision: 439296
feature.moderately-armoured:
  effets:
    - "Maîtrise des armures intermédiaires et des boucliers."
  revision: 438996
feature.mortal-reminder:
  effets:
    - "Coup critique : la cible et les ennemis à 3 m ou moins d’elle font un jet de sauvegarde de Sagesse contre le DD de sauvegarde des sorts ; en cas d’échec, état Effrayé (rappel de la mortalité) jusqu’à la fin de leur prochain tour."
    - "Effrayé : aucun déplacement, désavantage aux tests de caractéristique et aux jets d’attaque."
  notes:
    - "Se déclenche à chaque coup critique, même contre un objet, y compris ceux des jets d’attaque cachés (Briseur de hordes, Couteau de glace, flèches élémentaires)."
    - "Les effets qui donnent l’avantage ou le désavantage contre la peur, comme Contre-charme, ne jouent pas sur ce jet."
    - "Le DD repose sur la caractéristique d’incantation de la dernière classe prise au niveau 1 : en multiclasse, ce n’est pas forcément le Charisme."
  revision: 438193
feature.mountain:
  effets:
    - "Sorts accordés : Image miroir et Croissance d’épines."
    - "Niveau 5 : Éclair et Octroi du vol ; niveau 7 : Peau de pierre et Domination de bête ; niveau 9 : Mur de pierre et Invocation d’élémentaire."
  revision: 432873
feature.multiattack-defence:
  effets:
    - "Ennemi qui attaque le personnage : −4 à ses jets d’attaque suivants contre lui, jusqu’au début de son prochain tour (état Défense contre les attaques multiples)."
  revision: 432877
feature.natural-recovery:
  effets:
    - "Action, hors combat : dépense de charges de Ressourcement pour récupérer un emplacement de sort dépensé ; le coût en charges est égal au niveau de l’emplacement."
    - "Emplacements récupérables : niveau 1 au niveau 2 de druide, puis jusqu’au niveau 2 d’emplacement au niveau 3, 3 au niveau 5, 4 au niveau 7 et 5 au niveau 9."
  notes:
    - "Charges : la moitié du niveau de druide, arrondie au supérieur ; elles reviennent au repos long."
    - "Ne crée aucun emplacement : seuls les emplacements dépensés sont rendus."
  revision: 428898
feature.naturally-stealthy:
  effets:
    - "Tests de Dextérité (Discrétion) : avantage."
  revision: 432910
feature.natures-ward:
  effets:
    - "Immunité aux états de charme et de peur infligés par les élémentaires et les fées."
    - "Immunité aux états de maladie et d’empoisonnement."
  revision: 432914
feature.natures-wrath:
  effets:
    - "Action, 1 charge de Conduit de serment : un ennemi à 3 m ou moins fait un jet de sauvegarde de Force contre le DD de sauvegarde des sorts ; en cas d’échec, état Courroux de la nature pendant 10 tours."
    - "Courroux de la nature : aucun déplacement, avantage aux jets d’attaque contre la cible, désavantage à ses jets d’attaque et à ses jets de sauvegarde de Dextérité."
  revision: 431658
feature.oath-of-devotion-tenets:
  effets:
    - "Aucun effet chiffré : rappelle les préceptes que suit un paladin du Serment de Dévotion."
    - "Agir à l’encontre de ces préceptes fait rompre le serment."
  revision: 432925
feature.oath-of-the-ancients-tenets:
  effets:
    - "Aucun effet chiffré : rappelle les préceptes que suit un paladin du Serment des Anciens."
    - "Agir à l’encontre de ces préceptes fait rompre le serment."
  revision: 432927
feature.oath-of-the-crown-tenets:
  effets:
    - "Aucun effet chiffré : rappelle les préceptes que suit un paladin du Serment de la Couronne."
    - "Agir à l’encontre de ces préceptes fait rompre le serment."
  revision: 432928
feature.oath-of-vengeance-tenets:
  effets:
    - "Aucun effet chiffré : rappelle les préceptes que suit un paladin du Serment de Vengeance."
    - "Agir à l’encontre de ces préceptes fait rompre le serment."
  revision: 432929
feature.opportunity-attack:
  effets:
    - "Réaction : attaque au corps à corps contre un ennemi qui sort de l’allonge de la créature."
  notes:
    - "L’action Désengagement permet de s’éloigner sans provoquer cette attaque."
    - "Avec une arme de corps à corps dans chaque main, les deux frappent : main principale, puis main secondaire."
    - "Impossible avec une arme à distance, sous un état qui interdit les réactions (À terre, Neutralisé, Endormi) ou sans voir la cible."
  revision: 425412
feature.panache:
  effets:
    - "Action : test de Charisme (Persuasion) contre la Perspicacité passive d’une créature à 18 m ou moins."
    - "Ennemi qui échoue : état Panache : désavantage pendant 10 tours, soit désavantage aux jets d’attaque contre toute autre cible que le bretteur, et aucune attaque d’opportunité sauf contre lui."
    - "Autre créature qui échoue : état Charmé pendant 10 tours."
    - "Sans effet sur les bêtes, artificiels, élémentaires, monstruosités, plantes, vases et morts-vivants."
  notes:
    - "Perspicacité passive : 10 + modificateur de Sagesse + bonus de maîtrise si la compétence est maîtrisée ; un avantage en Perspicacité ajoute 5 au DD, un désavantage en retire 5."
    - "L’état prend fin dès qu’une autre créature que le bretteur attaque la cible ou la vise avec une aptitude nuisible."
    - "Les attaques d’opportunité accordées à l’ennemi par certains dons restent possibles."
  revision: 439051
feature.patient-defence:
  effets:
    - "Action bonus, 1 point de ki : jusqu’au tour suivant, désavantage aux jets d’attaque contre le moine et avantage à ses jets de sauvegarde de Dextérité (état Patience défensive)."
  revision: 421713
feature.poison-breath:
  effets:
    - "Action, une fois par repos court : cône de poison de 5 m, 2d6 dégâts de poison ; jet de sauvegarde de Constitution (DD 8 + modificateur de Constitution + bonus de maîtrise), demi-dégâts en cas de réussite."
    - "Niveau 6 du personnage : 3d6 dégâts ; niveau 11 : 4d6."
  notes:
    - "Ce DD est un DD de sauvegarde des sorts fondé sur la Constitution : tout bonus au DD de sauvegarde des sorts s’y ajoute."
  revision: 391126
feature.polearm-master-bonus-attack:
  effets:
    - "Une fois par tour, après une attaque au corps à corps avec une coutille, une hallebarde, une pique, un bâton ou une lance : attaque avec le talon de l’arme par une action bonus."
    - "Cette attaque inflige 1d4 + modificateur de Force ou de Dextérité (le plus élevé) dégâts contondants."
  notes:
    - "Avec une arme de pacte liée, le modificateur est le Charisme ; Gourdin magique ne le change pas."
    - "Une seule fois par tour, même avec deux actions bonus ; pas de déclenchement sur l’attaque qui ouvre le combat ni sur un lancer."
  revision: 433634
feature.polearm-master-opportunity-attack:
  effets:
    - "Réaction, avec une coutille, une hallebarde, une pique, un bâton ou une lance en main : attaque d’opportunité contre une créature qui entre dans l’allonge du personnage."
  notes:
    - "Pas de déclenchement si l’ennemi y est amené de force, par une bousculade par exemple."
    - "Utilisable sous Sanctuaire, mais met aussitôt fin à cet effet."
    - "Fonctionne même contre une cible protégée par Panache ou Jeu de jambes raffiné."
  revision: 433635
feature.portent:
  effets:
    - "Après chaque repos long : 2 dés de Présage, de valeurs différentes tirées au hasard."
    - "Jet d’attaque ou jet de sauvegarde dont l’auteur ou la cible se trouve à 18 m ou moins : le résultat du dé peut être remplacé par l’un de ces dés, par une réaction qui ne consomme pas la réaction du tour."
    - "Chaque dé ne sert qu’une fois ; ceux qui restent sont perdus au repos long suivant."
  notes:
    - "Le dé de Présage remplace le résultat avant modificateurs ; aucune ligne de vue n’est nécessaire."
    - "Seulement à l’avantage du groupe : attaque ratée d’un allié rendue réussie, attaque réussie d’un ennemi rendue ratée, et de même pour les sauvegardes ; les créatures neutres comptent comme alliées."
    - "Une valeur comprise dans la plage de coup critique du personnage produit un coup critique."
  revision: 439118
feature.potent-cantrip:
  effets:
    - "Sort mineur à jet de sauvegarde : une cible qui réussit sa sauvegarde subit tout de même la moitié des dégâts, mais aucun effet secondaire."
  notes:
    - "Concerne notamment Aspersion d’acide, Bouffée de poison, Éclatement des chairs, Flamme sacrée, Glas et Moquerie cruelle."
    - "Sans effet sur les sorts mineurs à jet d’attaque, comme Trait de feu ou Rayon de givre."
  revision: 432960
feature.potent-spellcasting:
  effets:
    - "Dégâts des sorts mineurs de clerc : + modificateur de Sagesse."
  notes:
    - "Sorts concernés : Flammes, Flamme sacrée, Éclatement des chairs et Glas."
  revision: 432962
feature.precision-attack:
  effets:
    - "Sans coût d’action, 1 dé de supériorité : état Attaque de précision jusqu’au prochain repos long."
    - "Attaque de précision : le prochain jet d’attaque avec une arme gagne un bonus égal au dé de supériorité, 1d8 (1d10 avec Supériorité martiale améliorée)."
  notes:
    - "Seulement avec une arme : ni attaque à mains nues, ni lancer, même d’une arme de lancer."
    - "Une attaque à plusieurs jets, comme Enchaînement ou une attaque à deux armes, ajoute un dé distinct à chaque jet."
  revision: 421975
feature.preserve-life:
  effets:
    - "Action, 1 charge de Conduit divin : les alliés dans un rayon de 9 m récupèrent 3 points de vie par niveau du personnage."
    - "Sans effet sur les morts-vivants et les artificiels."
  notes:
    - "Le soin dépend du niveau total du personnage, et non de son seul niveau de clerc."
  revision: 380603
feature.preys-scent-swarmkeeper:
  effets:
    - "Attaque de la nuée contre une créature marquée par Marque du chasseur : 1d6 dégâts supplémentaires du type de la nuée (perforants pour les abeilles, de foudre pour les méduses, psychiques pour les phalènes)."
  notes:
    - "Seule l’option d’attaque de la nuée en profite, pas ses autres options."
    - "Le bonus reste de 1d6 avec Essaim puissant et n’est pas doublé sur un coup critique."
  revision: 432968
feature.primal-stampede:
  effets:
    - "Action et déplacement, sous Rage : cœur d’élan : charge en ligne droite sur 9 m, sans provoquer d’attaque d’opportunité."
    - "Chaque créature non alliée à 2 m ou moins du trajet : jet d’attaque à mains nues au corps à corps, 1d4 + modificateur de Force dégâts contondants."
    - "Puis jet de sauvegarde de Force (DD 10 + modificateur de Force) ; en cas d’échec, état À terre pendant 2 tours."
  notes:
    - "Déclenche Attaque supplémentaire."
    - "Les bonus aux jets d’attaque à mains nues s’appliquent ; les bonus aux dégâts à mains nues, non, sauf ceux qui portent sur tous les dégâts."
  revision: 421986
feature.primal-strike:
  effets:
    - "Sous Forme sauvage : les attaques sont considérées comme magiques et passent outre la résistance et l’immunité aux dégâts non magiques."
  revision: 432969
feature.projected-ward:
  effets:
    - "Réaction, quand un allié proche subit des dégâts alors que Protection arcanique est active : ces dégâts sont réduits d’autant que la protection a de charges, puis elle perd 1 charge."
  revision: 432971
feature.protection:
  effets:
    - "Réaction, avec un bouclier en main : quand un ennemi visible attaque un allié à 1,5 m ou moins du personnage, cette attaque subit un désavantage."
  notes:
    - "Inutilisable pour se protéger soi-même."
    - "Inutilisable sous Forme étoilée ou sous un déguisement, comme celui du sort Déguisement."
  revision: 438525
feature.purity-of-body:
  effets:
    - "Immunité aux dégâts de poison."
    - "Immunité aux états d’empoisonnement et de maladie."
  revision: 432988
feature.pushing-attack-melee:
  effets:
    - "Action : attaque avec l’arme de corps à corps ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "Puis jet de sauvegarde de Force de la cible (DD d’action d’arme) ; en cas d’échec, elle est repoussée de 4,5 m."
  notes:
    - "Une attaque ratée ne dépense pas de dé de supériorité."
  revision: 422050
feature.pushing-attack-ranged:
  effets:
    - "Action : attaque avec l’arme à distance ; si elle touche, dégâts de l’arme + 1 dé de supériorité (1d8, 1d10 avec Supériorité martiale améliorée)."
    - "Puis jet de sauvegarde de Force de la cible (DD d’action d’arme) ; en cas d’échec, elle est repoussée de 4,5 m."
  notes:
    - "Une attaque ratée ne dépense pas de dé de supériorité."
    - "La poussée dépend d’un jet de sauvegarde distinct : une cible touchée peut y résister."
  revision: 422051
feature.radiance-of-the-dawn:
  effets:
    - "Action, 1 charge de Conduit divin : dissipe les ténèbres magiques dans un rayon de 9 m."
    - "Dans ce rayon : 2d10 + niveau du personnage dégâts radiants ; jet de sauvegarde de Constitution contre le DD de sauvegarde des sorts, demi-dégâts en cas de réussite."
    - "Une créature derrière un abri total n’est pas touchée."
  revision: 422093
feature.rage:
  effets:
    - "Action bonus, 1 charge de Rage, en combat : état Rage pendant 10 tours."
    - "Rage : +2 dégâts avec les armes de corps à corps, les armes improvisées, les attaques à mains nues et les lancers ; +3 au niveau 9."
    - "Rage : résistance aux dégâts contondants, perforants et tranchants ; avantage aux tests et aux jets de sauvegarde de Force."
    - "Sous Rage : ni sort ni concentration ; la rage prend fin si, depuis le tour précédent, le barbare n’a ni attaqué d’ennemi ni subi de dégâts."
    - "En armure lourde (état Rage bridée) : ni bonus de dégâts, ni résistance, ni avantage de Force."
  notes:
    - "Entrer en rage met fin à toute concentration ; une concentration qui ne vient pas d’un sort peut ensuite commencer."
    - "Toute action dirigée contre une créature non alliée entretient la rage, pas seulement une attaque avec une arme."
    - "Subir des dégâts n’entretient pas la rage si une autre capacité se déclenche aussi sur les dégâts subis, comme Esquive instinctive."
    - "Le bonus de dégâts vaut aussi pour une arme de finesse maniée avec la Dextérité."
  revision: 422103
feature.rage-bear-heart:
  effets:
    - "Action bonus, 1 charge de Rage, en combat : état Rage : cœur d’ours pendant 10 tours."
    - "+2 dégâts avec les armes de corps à corps, les armes improvisées et les lancers (+3 au niveau 9) ; avantage aux tests et aux jets de sauvegarde de Force."
    - "Résistance à tous les dégâts sauf psychiques ; Férocité acharnée devient utilisable."
    - "Sous cet état : ni sort ni concentration ; il prend fin si, depuis le tour précédent, le barbare n’a ni attaqué d’ennemi ni subi de dégâts."
  notes:
    - "En armure lourde (état Rage bridée), seule la résistance demeure, contrairement aux autres rages."
  revision: 422104
feature.rage-becomes-frenzy:
  effets:
    - "Accorde Frénésie, variante de Rage : mêmes effets de rage, plus Frappe frénétique, Lancer enragé et une attaque avec une arme improvisée au corps à corps par une action bonus."
  revision: 432995
feature.rage-eagle-heart:
  effets:
    - "Action bonus, 1 charge de Rage, en combat : état Rage : cœur d’aigle pendant 10 tours."
    - "+2 dégâts avec les armes de corps à corps, les armes improvisées et les lancers (+3 au niveau 9) ; résistance aux dégâts contondants, perforants et tranchants ; avantage aux tests et aux jets de sauvegarde de Force."
    - "En plus : Frappe en piqué utilisable, Pointe par une action bonus, désavantage aux attaques d’opportunité des ennemis contre le barbare."
    - "Sous cet état : ni sort ni concentration ; il prend fin si, depuis le tour précédent, le barbare n’a ni attaqué d’ennemi ni subi de dégâts."
  notes:
    - "En armure lourde (état Rage bridée) : ni bonus de dégâts, ni résistance, ni avantage de Force."
  revision: 422105
feature.rage-elk-heart:
  effets:
    - "Action bonus, 1 charge de Rage, en combat : état Rage : cœur d’élan pendant 10 tours."
    - "+2 dégâts avec les armes de corps à corps, les armes improvisées et les lancers (+3 au niveau 9) ; résistance aux dégâts contondants, perforants et tranchants ; avantage aux tests et aux jets de sauvegarde de Force."
    - "En plus : Ruée primitive utilisable ; vitesse de déplacement +4,5 m."
    - "Sous cet état : ni sort ni concentration ; il prend fin si, depuis le tour précédent, le barbare n’a ni attaqué d’ennemi ni subi de dégâts."
  notes:
    - "En armure lourde (état Rage bridée) : ni bonus de dégâts, ni résistance, ni avantage de Force."
  revision: 422106
feature.rage-tiger-heart:
  effets:
    - "Action bonus, 1 charge de Rage, en combat : état Rage : cœur de tigre pendant 10 tours."
    - "+2 dégâts avec les armes de corps à corps, les armes improvisées et les lancers (+3 au niveau 9) ; résistance aux dégâts contondants, perforants et tranchants ; avantage aux tests et aux jets de sauvegarde de Force."
    - "En plus : Soif de sang du tigre utilisable ; distance de saut +4,5 m."
    - "Sous cet état : ni sort ni concentration ; il prend fin si, depuis le tour précédent, le barbare n’a ni attaqué d’ennemi ni subi de dégâts."
  notes:
    - "En armure lourde (état Rage bridée) : ni bonus de dégâts, ni résistance, ni avantage de Force."
  revision: 422107
feature.rage-wild-magic:
  effets:
    - "Action bonus, 1 charge de Rage, en combat : état Rage pendant 10 tours, avec les mêmes effets que l’action Rage."
    - "À l’entrée en rage : un effet magique aléatoire se produit, tiré de la table de magie sauvage du barbare."
  notes:
    - "En armure lourde (état Rage bridée) : ni bonus de dégâts, ni résistance, ni avantage de Force."
  revision: 439499
feature.rage-wolf-heart:
  effets:
    - "Action bonus, 1 charge de Rage, en combat : état Rage : cœur de loup pendant 10 tours."
    - "+2 dégâts avec les armes de corps à corps, les armes improvisées et les lancers (+3 au niveau 9) ; résistance aux dégâts contondants, perforants et tranchants ; avantage aux tests et aux jets de sauvegarde de Force."
    - "En plus : Hurlement galvanisant utilisable ; les alliés ont l’avantage aux jets d’attaque au corps à corps contre les ennemis à 2 m ou moins du barbare."
    - "Sous cet état : ni sort ni concentration ; il prend fin si, depuis le tour précédent, le barbare n’a ni attaqué d’ennemi ni subi de dégâts."
  notes:
    - "L’avantage ne profite pas au barbare lui-même."
    - "En armure lourde (état Rage bridée) : ni bonus de dégâts, ni résistance, ni avantage de Force."
  revision: 422109
feature.rakish-audacity:
  effets:
    - "Jets d’initiative : +2 ; +3 au niveau 5 de roublard, +4 au niveau 10."
    - "Attaque sournoise sans avantage : conditions détaillées à Attaque sournoise effrontée (corps à corps) et Attaque sournoise effrontée (à distance)."
  revision: 432996
feature.rakish-sneak-attack-melee:
  effets:
    - "Action, une fois par tour : attaque au corps à corps avec une arme de finesse ; si elle touche, dégâts de l’arme + 2d6 du type de l’arme."
    - "Utilisable avec l’avantage contre la cible ; sans avantage, si un allié est à 1,5 m ou moins de la cible ou si aucune autre créature en combat n’est à 1,5 m ou moins ; jamais avec désavantage."
    - "Niveau 5 de roublard : 3d6 ; niveau 7 : 4d6 ; niveau 9 : 5d6 ; niveau 11 : 6d6."
  notes:
    - "D’autres ennemis proches de la cible ne bloquent l’attaque que s’ils sont aussi à 1,5 m ou moins de l’attaquant."
    - "Un allié à 1,5 m ou moins de l’attaquant, mais pas de la cible, rend l’attaque inutilisable."
    - "L’arme de finesse emploie la Force si elle est plus élevée que la Dextérité."
  revision: 426303
feature.rakish-sneak-attack-ranged:
  effets:
    - "Action, une fois par tour : attaque avec une arme à distance ; si elle touche, dégâts de l’arme + 2d6 du type de l’arme."
    - "Utilisable seulement si un allié est à 1,5 m ou moins de la cible ou si aucune autre créature en combat n’est à 1,5 m ou moins, même avec l’avantage ; jamais avec désavantage."
    - "Niveau 5 de roublard : 3d6 ; niveau 7 : 4d6 ; niveau 9 : 5d6 ; niveau 11 : 6d6."
  notes:
    - "D’autres ennemis proches de la cible ne bloquent l’attaque que s’ils sont aussi à 1,5 m ou moins de l’attaquant."
    - "Un allié à 1,5 m ou moins de l’attaquant, mais pas de la cible, rend l’attaque inutilisable."
  revision: 426311
feature.rally:
  effets:
    - "Action bonus, 1 dé de supériorité : un allié gagne 8 points de vie temporaires (état Ragaillardi, 5 tours)."
  notes:
    - "Un allié tombé à 0 point de vie revient d’abord à 1 point de vie."
    - "Les points de vie temporaires ne se cumulent pas avec ceux d’une autre source."
    - "La valeur reste de 8 au niveau 10, malgré le dé de supériorité plus grand."
  revision: 422130
feature.rangers-companion:
  effets:
    - "Action, une fois par repos court : invoque un compagnon animal qui combat aux côtés du rôdeur, au choix : ours, sanglier, corbeau sanguinaire, loup ou araignée-loup."
  notes:
    - "Indépendant du sort Appel de familier : le compagnon et un familier peuvent être présents en même temps."
  revision: 318743
feature.read-thoughts:
  effets:
    - "Action, 1 charge de Conduit divin, avec concentration : état Détection des pensées jusqu’au prochain repos long ; permet de lire les pensées de certaines créatures au cours d’une conversation."
  revision: 422185
feature.reaper:
  effets:
    - "Sort mineur de nécromancie qui ne vise qu’une créature : une seconde créature peut être ciblée."
  notes:
    - "Concerne Frisson des os, Éclatement des chairs et Glas."
    - "Ne se cumule pas avec Incantateur adroit."
  revision: 433005
feature.reckless-attack:
  effets:
    - "Action : attaque avec une arme de corps à corps, dégâts de l’arme."
    - "Jusqu’au tour suivant (état Témérité, 1 tour) : avantage aux jets d’attaque au corps à corps et de lancer du barbare, mais les ennemis ont aussi l’avantage aux jets d’attaque contre lui."
    - "Peut aussi s’activer sans coût après une attaque au corps à corps ratée qui ne bénéficiait pas déjà de l’avantage."
  revision: 433722
feature.redirect-attack:
  effets:
    - "Réaction, 1 point de ki, quand une créature rate une attaque au corps à corps contre le moine : attaque à mains nues contre cet attaquant."
