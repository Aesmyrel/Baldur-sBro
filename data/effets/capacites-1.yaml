feature.illuminating-shot:
  effets:
    - "Tir : la cible subit l’état Orbe rayonnant pendant 1 tour."
  revision: 373864
feature.illusion-quickening:
  effets:
    - "Après avoir touché une créature avec une attaque d’arme : le porteur peut lancer un sort d’illusion ou d’enchantement par une action bonus (état Incantation accélérée, 1 tour)."
  revision: 432661
feature.immolating-gaze:
  effets:
    - "Regard porté sur une cible : dégâts de feu, puis jet de sauvegarde d’Intelligence (DD de sauvegarde des sorts du porteur) ; en cas d’échec, elle subit l’état Apeuré pendant 3 tours."
  revision: 361243
feature.imperial-retaliation:
  effets:
    - "Jet de sauvegarde réussi par le porteur : l’ennemi qui l’a provoqué fait un jet de sauvegarde d’Intelligence (DD 15) ; en cas d’échec, il subit l’état Étourdi pendant 1 tour."
  revision: 438299
feature.improved-critical:
  effets:
    - "Tant que l’arme est équipée : le résultat nécessaire pour un coup critique baisse de 1."
  notes:
    - "Se cumule avec les autres réductions du seuil de coup critique."
  revision: 432677
feature.impulse-blast:
  effets:
    - "Quand le porteur tue une cible ou porte un coup critique : chaque créature proche fait un jet de sauvegarde de Dextérité (DD 14) ; en cas d’échec, elle subit l’état À terre pendant 2 tours."
  revision: 432685
feature.incise-ligaments:
  effets:
    - "Attaque d’arme qui inflige des dégâts nécrotiques supplémentaires : jet de sauvegarde de Dextérité (DD d’action d’arme + 2) ; en cas d’échec, la cible subit l’état Ralenti pendant 2 tours."
  notes:
    - "Inutilisable par les personnages joueurs, même avec l’arme équipée."
  revision: 438226
feature.infernal-acuity:
  effets:
    - "Tant que l’objet est porté : +1 aux jets d’attaque de sort et au DD de sauvegarde des sorts."
  revision: 433207
feature.infernal-evasion:
  effets:
    - "Jet de sauvegarde raté : le porteur peut jouer sa réaction pour le transformer en réussite."
  revision: 407080
feature.infernal-retribution:
  effets:
    - "Jet de sauvegarde réussi par le porteur : le lanceur à l’origine du jet subit l’état En flammes (orthonique) pendant 3 tours."
  revision: 437849
feature.infernal-sight:
  effets:
    - "Tant que l’objet est porté : le porteur voit dans les ténèbres ordinaires et magiques jusqu’à 12 m et ne peut pas subir l’état Aveuglé."
  revision: 432697
feature.infernal-touch:
  effets:
    - "Attaque d’arme : 1d6 dégâts de feu supplémentaires."
    - "Attaque à mains nues : 1d6 dégâts nécrotiques supplémentaires, et la cible fait un jet de sauvegarde de Constitution (DD 15) ; en cas d’échec, elle subit l’état Saignement pendant 2 tours."
  revision: 432700
feature.infernal-weapon:
  effets:
    - "Cible touchée : 3 dégâts de poison supplémentaires, puis jet de sauvegarde de Constitution (DD 12) ; en cas d’échec, elle subit l’état Empoisonné pendant 2 tours."
  revision: 432703
feature.inject-nostrum:
  effets:
    - "Attaque d’arme qui inflige des dégâts nécrotiques supplémentaires : jet de sauvegarde de Dextérité (DD d’action d’arme + 2) ; en cas d’échec, la cible subit l’état Empoisonné pendant 2 tours."
  notes:
    - "Inutilisable par les personnages joueurs, même avec l’arme équipée."
  revision: 437885
feature.innate-fortitude:
  effets:
    - "Une fois par repos long : le porteur peut jouer sa réaction pour faire un jet d’attaque ou un jet de sauvegarde avec avantage."
  revision: 407086
feature.intense-adamantine-backlash:
  effets:
    - "Attaque au corps à corps qui touche le porteur : l’attaquant subit l’état Chancelant pendant 3 tours."
  revision: 438449
feature.interplanar-slayer:
  effets:
    - "Contre les githyanki, les aberrations, les fiélons et les élémentaires : +1d4 aux jets d’attaque et de dégâts avec cette arme."
  revision: 432713
feature.intimate-embrace:
  effets:
    - "Une fois par repos long : le porteur peut lancer Lien de protection sur une créature qui porte l’anneau jumeau."
  revision: 432714
feature.invisible-weapon:
  effets:
    - "Tant qu’elle est équipée, l’arme est invisible (état Arme invisible) : avantage aux jets d’attaque et coup critique sur un 19."
    - "Jet d’attaque raté : l’arme perd ces propriétés pendant 2 rounds."
  revision: 432716
feature.ironvine:
  effets:
    - "Attaque au corps à corps qui touche le porteur pendant qu’il tient une arme sous Gourdin magique : l’attaquant subit des dégâts perforants égaux au modificateur de Sagesse du porteur."
  revision: 432718
feature.keen-attack:
  effets:
    - "Attaque à distance avec cette arme, sans désavantage : le bonus de maîtrise du porteur est doublé."
  revision: 432722
feature.ki-restoration-lesser:
  effets:
    - "À l’activation : le porteur récupère 2 points de ki."
  revision: 439845
