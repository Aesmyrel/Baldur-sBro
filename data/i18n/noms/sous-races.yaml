# Noms français des sous-races (lot noms-subrace). Voir docs/LOTS_ECRITURE.md §3.
# VF_DND : lignage du SRD 5.2.1 (srd-5.2.1-fr) de même nom anglais (High Elf, Wood Elf, Forest Gnome, Rock Gnome)
# ou peuple nommé tel quel dans le SRD (duergar) ; sinon NON_OFFICIELLE.
# Composition : nom de la race, puis le qualificatif. Drakéides : couleurs et métaux des dragons du SRD
# (« Dragon d’airain », « Dragon de bronze »…). Demi-elfes : qualificatif du lignage elfique (drow, haut-elfe, sylvestre).
