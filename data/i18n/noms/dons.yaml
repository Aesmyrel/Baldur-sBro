# « Magic Initiate (Cleric) ») : termes du SRD repris, statut NON_OFFICIELLE.
# Armures : vocabulaire du SRD (« formation aux armures légères », armures intermédiaires, armures lourdes).
# Chaque don porte le même nom français que la capacité de même nom anglais (capacites-3.yaml).
