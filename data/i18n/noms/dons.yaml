# Noms français des dons (lot noms-feat). Voir docs/LOTS_ECRITURE.md §3.
# VF_DND : don du SRD 5.2.1 (srd-5.2.1-fr) de même nom anglais (Alert, Savage Attacker, Skilled) ; sinon NON_OFFICIELLE.
