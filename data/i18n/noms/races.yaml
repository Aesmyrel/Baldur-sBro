# Noms français des races (lot noms-race). Voir docs/LOTS_ECRITURE.md §3.
# VF_DND : nom anglais exactement égal à une espèce ou à un lignage du SRD 5.2.1 (srd-5.2.1-fr), même sens ; sinon NON_OFFICIELLE.
# Le SRD 5.2.1 n'a ni demi-elfe, ni demi-orc (seulement « Orc »), ni githyanki.
race.dragonborn:
  fr: Drakéide
  statut: VF_DND
  source: srd-5.2.1-fr
race.drow:
