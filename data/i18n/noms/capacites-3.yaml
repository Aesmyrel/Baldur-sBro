# Noms français des capacités de race et de don (lot noms-feature, troisième vague). Voir docs/LOTS_ECRITURE.md §3.
# VF_DND : nom anglais exactement égal à un trait ou à un don du SRD 5.2.1 (srd-5.2.1-fr), même sens ; sinon NON_OFFICIELLE.
# Pas VF_DND : Gnome Cunning (SRD : Gnomish Cunning), Halfling Luck (SRD : Luck), Hellish Resistance, Human Versatility.
# Une capacité porte le nom français du don de même nom anglais (dons.yaml) ; « Nom du don : précision » sinon.
# Termes repris : Ascendance draconique (déjà employé, VF_DND), Attaque d’opportunité, Plaies béantes, Résistance (« Resilience »,
# comme Résistance draconique et Résistance naine) ; « attaque bonus » distingue l’action bonus d’Attaque supplémentaire.
